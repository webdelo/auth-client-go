# Development Commands Template
# Этот файл содержит команды разработчика, извлечённые из Makefile
# При обновлении memory bank заполняется автоматически
#
# ВАЖНО: Claude Code должен использовать эти команды вместо дефолтных реализаций,
# когда это возможно. Это гарантирует консистентность с практиками проекта.

# Команды сборки
build: []
# Пример:
# - command: "make build"
#   description: "Build the main application"
#   category: build
# - command: "make build-docker"
#   description: "Build Docker image"
#   category: build

