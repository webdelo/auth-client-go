# Сырые команды из Makefile (для справки)
# Заполняется автоматически всеми найденными .PHONY targets
raw_makefile_targets: []

# Метаданные
metadata:
  generated_at: ""            # Дата генерации (ISO 8601)
  makefile_path: "Makefile"   # Путь к анализируемому Makefile
  total_commands: 0           # Общее количество команд
