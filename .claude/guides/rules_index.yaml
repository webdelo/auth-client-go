# ═══════════════════════════════════════════════════════════════════════════════
# AGENTS - When to use which agent
# ═══════════════════════════════════════════════════════════════════════════════
agents:
  reference: ".claude/AGENTS.yaml"

  by_task:
    code_writing:
      agent: "code-writer"
      triggers: ["написать код", "реализовать", "implement"]

    code_review:
      agent: "code-reviewer"
      triggers: ["review", "ревью", "проверить"]
      use_after: ["code-writer", "refactorer"]

    unit_tests:
      agent: "unit-test-writer"
      triggers: ["unit test", "тест"]
      use_after: ["code-writer"]

    integration_tests:
      agent: "gonkey-test-writer"
      triggers: ["gonkey", "integration test", "yaml test"]

    test_review:
      agent: "test-reviewer"
      triggers: ["review test", "проверить тесты"]
      use_after: ["unit-test-writer", "gonkey-test-writer"]

    debugging_simple:
      agent: "debugger"
      model: "sonnet"
      description: "Simple errors: compilation, linter, basic runtime"
      triggers:
        - "cannot find"
        - "undefined"
        - "syntax app_error"
        - "import cycle"
        - "golangci-lint"
        - "revive"
        - "staticcheck"
        - "nil pointer"
        - "index out of range"
        - "FAIL"
        - "got .* want"
        - "assertion failed"

    debugging_complex:
      agent: "debugger-complex"
      model: "opus"
      description: "Complex errors: race, deadlock, concurrency, flaky tests"
      triggers:
        - "DATA RACE"
        - "race detected"
        - "concurrent"
        - "deadlock"
        - "all goroutines are asleep"
        - "goroutine leak"
        - "flaky"
        - "intermittent"
        - "sometimes fails"
        - "blocked"
        - "timeout"
        - "context deadline exceeded"

    research:
      agent: "code-researcher"
      triggers: ["найти", "search", "где используется"]

    web_search:
      agent: "web-searcher"
      triggers: ["документация", "docs", "как работает"]
      model: "opus"

    refactoring:
      agent: "refactorer"
      triggers: ["рефакторинг", "refactor", "улучшить структуру"]

    security:
      agent: "security-auditor"
      triggers: ["security", "безопасность", "auth", "credentials"]

    benchmarks:
      agent: "benchmark-runner"
      triggers: ["benchmark", "performance", "производительность"]

    documentation:
      agent: "doc-generator"
      triggers: ["документация", "README", "godoc"]

  dba_agents:
    - agent: "repository-postgres"
      triggers: ["postgres", "pgx", "sql query"]
    - agent: "repository-clickhouse"
      triggers: ["clickhouse", "OLAP"]
    - agent: "repository-redis"
      triggers: ["redis", "cache", "streams"]
    - agent: "repository-mysql"
      triggers: ["mysql", "mariadb"]
    - agent: "repository-mongodb"
      triggers: ["mongodb", "document"]
    - agent: "repository-sqlite"
      triggers: ["sqlite", "embedded"]
    - agent: "repository-qdrant"
      triggers: ["qdrant", "vector"]

