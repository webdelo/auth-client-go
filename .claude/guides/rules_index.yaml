# ═══════════════════════════════════════════════════════════════════════════════
# SCRATCH CLI - Code generation from scratch.yaml
# ═══════════════════════════════════════════════════════════════════════════════
scratch:
  scratch_usage:
    path: ".claude/guides/libs/scratch_usage.md"
    priority: 2
    severity: warning
    triggers:
      # Изменение спецификации / схемы
      - "обновить спецификацию"
      - "update spec"
      - "openapi"
      - "swagger"
      - "спецификация"
      - "перегенерировать"
      - "regenerate"
      - "codegen"
      # Подключение/отключение инфраструктуры
      - "подключить базу"
      - "добавить postgres"
      - "добавить redis"
      - "добавить clickhouse"
      - "добавить kafka"
      - "добавить aerospike"
      - "добавить valkey"
      - "добавить grpc"
      - "отключить postgres"
      - "отключить redis"
      - "отключить clickhouse"
      - "отключить kafka"
      - "подключить storage"
      - "новая база данных"
      - "new database"
      - "add storage"
      - "remove storage"
      - "enable grpc"
      - "disable grpc"
      # Прямые упоминания scratch
      - "scratch"
      - "scratch.yaml"
      - "scratch generate"
    critical_rules:
      - id: "SCR-0001"
        title: "After scratch.yaml change — ALWAYS run scratch generate"
      - id: "SCR-0002"
        title: "NEVER manually edit files in generated/scratch/"
      - id: "SCR-0003"
        title: "If scratch.yaml exists — read it to understand infrastructure"

# ═══════════════════════════════════════════════════════════════════════════════
# BUILD ARTIFACTS - File placement rules
# ═══════════════════════════════════════════════════════════════════════════════
build_artifacts:
  guide: ".claude/guides/build_artifacts.yaml"
  prefix: "BUILD"

  triggers:
    - "go test -c"
    - "test binary"
    - "*.test"
    - "report"
    - "coverage"
    - "benchmark"
    - ".build"

  critical_rules:
    - rule: "BUILD-0001: Test binaries MUST be in .build/ directory"
      enforcement: "Use go test -c -o .build/name.test"

    - rule: "BUILD-0002: Reports to designated directories"
      agent_reports: ".memory_bank/agent_task_results/"
      task_results: "task_management/results/"
      guide: ".claude/guides/project/file_organization.md"

    - rule: "BUILD-0003: Cleanup temporary files after use"
      command: "make clean"

