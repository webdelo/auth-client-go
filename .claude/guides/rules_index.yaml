# Unified Rules Index
# Мета-индекс всех правил проекта для ленивой загрузки.
# Оркестратор загружает только этот файл и читает конкретные guides по триггерам.

metadata:
  version: "3.1"
  last_updated: "2026-03-17"

# ═══════════════════════════════════════════════════════════════════════════════
# ЗАГРУЗКА ПРАВИЛ — 2-ШАГОВАЯ ПРОЦЕДУРА
# ═══════════════════════════════════════════════════════════════════════════════
# Каждый workflow содержит load_rules блок с двумя шагами:
#
# ШАГ 1: mandatory_guides — обязательные файлы для данного workflow
#   Читать ЦЕЛИКОМ (Read каждый файл). Маппинг см. в command_mandatory_guides ниже.
#
# ШАГ 2: trigger_based_extras — дополнительные файлы по keywords задачи
#   Проанализировать keywords задачи и загрузить ЦЕЛЫЕ файлы:
#   - concurrency (goroutine/mutex/atomic/chan) → .claude/guides/golang/effective_concurrency.md
#   - postgres/clickhouse/redis/repository → .claude/guides/dba/rules_index.yaml → файлы из совпавшей секции
#   - docker/k8s/deploy → .claude/guides/devops/rules_index.yaml → файлы из совпавшей секции
#   Нельзя удалять mandatory_guides — только добавлять.
#
# ПРИМЕР:
#   Workflow: /execute-prp
#   → mandatory: effective_standards.md, coding_style.md (читать целиком)
#   → задача упоминает "clickhouse", "OHLCV"
#   → загрузить: .claude/guides/dba/rules_index.yaml → секция clickhouse → файлы целиком
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# ORCHESTRATOR VS AGENTS - Гибридный подход
# ═══════════════════════════════════════════════════════════════════════════════
execution_strategy:
  agents_for:
    - "Изолированные автономные задачи (code-review, unit-tests, benchmarks)"
    - "Специализированная экспертиза (DBA, security)"
    - "Параллельные независимые задачи"
    - "Долгие операции (> 5 шагов)"
  orchestrator_for:
    - "Итеративные задачи с диалогом"
    - "Простые задачи (< 3 шагов)"
    - "Задачи требующие общего контекста"
    - "Координация и планирование"
  agent_rules:
    - rule: "Агент = автономная задача без уточнений"
    - rule: "Промпт содержит ВСЁ необходимое"
    - rule: "Параллелить независимые задачи"
    - rule: "Не использовать агентов для < 3 шагов"
    - rule: "Передавать конкретные файлы, не 'весь код'"

# ═══════════════════════════════════════════════════════════════════════════════
# GOLANG STANDARDS
# ═══════════════════════════════════════════════════════════════════════════════
golang:
  # Базовые стандарты - ВСЕГДА проверять при работе с Go кодом
  effective_standards:
    path: ".claude/guides/golang/effective_standards.md"
    prefix: "ES"
    priority: 1
    severity: critical
    triggers:
      - "написать код"
      - "функция"
      - "метод"
      - "структура"
      - "go файл"
      - ".go"
      - "usecase"
      - "use case"
      - "entity"
      - "entities"
      - "handler"
      - "dto"
      - "interface"
      - "package"
      - "repository"
      - "models"
      - "builders"
      - "row struct"
      - "mapper"
    critical_rules:
      - id: "ES-0051"
        title: "Define interfaces at consumer, not producer"
      - id: "ES-0055"
        title: "No generalized interfaces in provider packages"
      - id: "ES-0060"
        title: "Handle errors explicitly"
      - id: "ES-0063"
        title: "No panic in production code"
      - id: "ES-0143"
        title: "Use noop defaults for optional deps instead of nil-checks"
      - id: "ES-0045"
        title: "No optional parameters via zero values — use separate methods"
      - id: "ES-0160"
        title: "Domain entity не повторяет структуру таблицы БД — использует value objects"
      - id: "ES-0161"
        title: "Database row struct хранится в пакете models/ внутри репозитория"
      - id: "ES-0162"
        title: "Маппинг entity ↔ row реализуется как builder в пакете builders/"
      - id: "ES-0170"
        title: "Prefer value parameters over pointers"
      - id: "ES-0171"
        title: "nolint annotations are FORBIDDEN"
      - id: "ES-0172"
        title: "Full object names in log messages"
      - id: "ES-0173"
        title: "Variable naming — no unclear abbreviations"

  # Concurrency - загружать при наличии примитивов
  effective_concurrency:
    path: ".claude/guides/golang/effective_concurrency.md"
    prefix: "EC"
    priority: 2
    severity: critical
    triggers:
      - "goroutine"
      - "go func"
      - "sync.Mutex"
      - "sync.RWMutex"
      - "sync.WaitGroup"
      - "atomic."
      - "chan "
      - "<-"
      - "select {"
      - "concurrency"
      - "параллел"
    critical_rules:
      - id: "EC-0010"
        title: "Every goroutine must have a clear lifecycle"
      - id: "EC-0012"
        title: "Avoid goroutine leaks"
      - id: "EC-0021"
        title: "Close channels on sender side only"
      - id: "EC-0033"
        title: "Always use defer with mutex unlock"
      - id: "EC-0040"
        title: "Add before starting goroutine"
      - id: "EC-0051"
        title: "Never store context in structs"
      - id: "EC-0062"
        title: "Use Swap for entry guards"
      - id: "EC-0063"
        title: "Don't mix atomic and mutex"
      - id: "EC-0064"
        title: "Maximum 1 mutex per method"
      - id: "EC-0091"
        title: "Capture loop variables"

  # Стиль кода
  coding_style:
    path: ".claude/guides/golang/coding_style.md"
    prefix: "CS"
    priority: 3
    severity: warning
    condition: |
      ОБЯЗАТЕЛЕН для /execute-prp и /review-code (всегда загружать).
      Для остальных команд (/execute-bug-fix, /generate-prp, /review-code-it, /execute-it-bug-fix)
      загружать ТОЛЬКО если задача ЯВНО связана со стилем/форматированием/именованием.
    task_kinds:
      - "coding"
      - "review"
    triggers:
      - "стиль"
      - "форматирование"
      - "naming"
      - "именование"
    key_rules:
      - id: "CS-0010"
        title: "Empty line after if/switch/select blocks"
      - id: "CS-0050"
        title: "Each entity in separate package"
      - id: "CS-0110"
        title: "No internal standard references in code comments"
      - id: "CS-0113"
        title: "Entity = identity + lifecycle + closed mutable state"
      - id: "CS-0114"
        title: "No error storage in struct fields for deferred retrieval"
      - id: "CS-0115"
        title: "Value Object = value semantics + immutability"
      - id: "CS-0116"
        title: "DTO = transport structure + open fields + no domain invariants"
      - id: "CS-0117"
        title: "Exported Entity/VO/DTO structs must live in entity/vo/dto packages"
      - id: "CS-0118"
        title: "Layer-local structs outside entity/vo/dto must be unexported"

  # Uber style guide
  uber_style:
    path: ".claude/guides/golang/uber_style_guide.md"
    priority: 4
    severity: suggestion
    triggers:
      - "uber"
      - "best practice"

# ═══════════════════════════════════════════════════════════════════════════════
# TESTING STANDARDS
# ═══════════════════════════════════════════════════════════════════════════════
testing:
  index: ".claude/guides/golang/tests_rules_index.yaml"

  unit_tests:
    path: ".claude/guides/golang/unit_tests_standards.md"
    prefix: "UT"
    condition: |
      Загружать если задача работает с _test.go файлами или mock-ами.
      НЕ загружать для /review-code-it и /execute-it-bug-fix —
      для них нужен integration_tests, а не unit_tests.
    triggers:
      - "тест"
      - "test"
      - "_test.go"
      - "mock"
      - "coverage"
      - "table-driven"
      - "testify"
      - "mockery"
      - "repository test"
      - "repo test"
    critical_rules:
      - id: "UT-0001"
        title: "Table-driven tests mandatory"
      - id: "UT-0002"
        title: "One method = one test function"
      - id: "UT-0010"
        title: "Function naming Test<Type>_<Method>"
      - id: "UT-0020"
        title: "Mocks ONLY via mockery"
      - id: "UT-0021"
        title: "Use Expecter API (.EXPECT()), not .On()"
      - id: "UT-0022"
        title: "All mocks with .Once()/.Times(n)"
      - id: "UT-0023"
        title: "mock.Anything ЗАПРЕЩЁН ПОЛНОСТЬЮ — используй точные значения"
      - id: "UT-0028"
        title: "No helper functions for test data, mocks, or assertions"
      - id: "UT-0029"
        title: "No package-level shared variables for test data"
      - id: "UT-0030"
        title: "require for critical, assert for additional"
      - id: "UT-0032"
        title: "No logic in tests — use closures in want"
      - id: "UT-0040"
        title: "t.Parallel() with tc := tc capture"
      - id: "UT-0110"
        title: "Repository unit tests ОБЯЗАТЕЛЬНЫ"
      - id: "UT-0112"
        title: "Обязательные кейсы: happy_path, edge cases, PG-ошибки, инфраструктурные ошибки"

  integration_tests:
    path: ".claude/guides/golang/integration_tests_standards.md"
    prefix: "IT"
    triggers:
      - "интеграцион"
      - "integration"
      - "gonkey"
      - "e2e"
      - "yaml test"
      - "fixture"
      - "grpc test"
      - "gRPC test"
      - "happy path"
      - "error case"
      - "review-code-it"
      - "execute-it-bug-fix"
      - "it_review"
      - "it_bug_fix"
      - "IT-"
    critical_rules:
      - id: "IT-0001"
        title: "Test file location: tests/*_test.go"
      - id: "IT-0002"
        title: "YAML naming: +happy.yaml / -app_error.yaml"
      - id: "IT-0003"
        title: "Always start with empty_db fixture"
      - id: "IT-0004"
        title: "Always specify calls: N for mocks"
      - id: "IT-0006"
        title: "$matchRegexp() for dynamic fields"
      - id: "IT-0007"
        title: "BDD naming: КОГДА / ТОГДА"
      - id: "IT-0009"
        title: "No business logic in tests"
      - id: "IT-0010"
        title: "No parallel execution"

