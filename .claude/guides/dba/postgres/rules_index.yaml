key_rules:
  - id: "PG-001"
    rule: "Use pgxpool for connection pooling"
    example: "pgxpool.New(ctx, connString)"
    critical: true
  - id: "PG-002"
    rule: "Use ANY($1::type[]) instead of IN for arrays"
    example: "WHERE id = ANY($1::uuid[])"
  - id: "PG-003"
    rule: "Always use RETURNING for INSERT/UPDATE"
    example: "INSERT ... RETURNING id, created_at"
  - id: "PG-004"
    rule: "Use QueryRow for single row, Query for multiple"
  - id: "PG-005"
    rule: "Batch operations with COPY or unnest()"
  - id: "PG-006"
    rule: "Use prepared statements for repeated queries"
  - id: "PG-007"
    rule: "Handle pgx.ErrNoRows explicitly"
    critical: true
  - id: "PG-008"
    rule: "Use context with timeout for all queries"
    critical: true
