key_rules:
  - id: "CH-001"
    rule: "Use batch inserts, never single-row INSERT"
    critical: true
  - id: "CH-002"
    rule: "Choose correct MergeTree engine for use case"
    critical: true
  - id: "CH-003"
    rule: "Partition by date/month for time-series"
  - id: "CH-004"
    rule: "Use PREWHERE for filtering before reading"
  - id: "CH-005"
    rule: "Avoid JOINs, denormalize data"
  - id: "CH-006"
    rule: "Use AggregatingMergeTree for real-time aggregates"
  - id: "CH-007"
    rule: "Set max_execution_time for queries"
    critical: true
  - id: "CH-008"
    rule: "NEVER use SELECT ... FINAL — use argMax(col, version_col) + GROUP BY instead"
    example: "SELECT id, argMax(state, updated_at) AS state FROM t GROUP BY id"
    critical: true
