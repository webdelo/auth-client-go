key_rules:
  - id: "RD-001"
    rule: "Use Pipeline for batch operations"
    example: "pipe := rdb.Pipeline()"
  - id: "RD-002"
    rule: "Use Lua scripts for atomic operations"
  - id: "RD-003"
    rule: "Set TTL for cache keys"
    example: "rdb.Set(ctx, key, val, time.Hour)"
    critical: true
  - id: "RD-004"
    rule: "Use SCAN instead of KEYS in production"
    critical: true
  - id: "RD-005"
    rule: "Handle redis.Nil for missing keys"
    critical: true
  - id: "RD-006"
    rule: "Use Streams for reliable messaging"
  - id: "RD-007"
    rule: "Prefix keys with namespace"
    example: "app:users:123"
