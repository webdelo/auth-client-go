# DBA Rules Index
# Мета-индекс правил для работы с базами данных.
# Каждый пакет БД имеет свой rules_index.yaml с детальным описанием файлов.

metadata:
  version: "4.0"
  last_updated: "2026-03-10"
  description: "Keyword-based index of database rules and patterns"
  total_rules: 801
  rule_prefixes:
    - "PG-XXX: PostgreSQL (168 rules)"
    - "CH-XXX: ClickHouse (125 rules)"
    - "RD-XXX: Redis (102 rules)"
    - "MY-XXX: MySQL (123 rules)"
    - "MG-XXX: MongoDB (88 rules)"
    - "SQ-XXX: SQLite (86 rules)"
    - "QD-XXX: Qdrant (107 rules)"
    - "DB-XXX: Common DB rules (8 rules)"
    - "DB-SCHEMA-XXX: Schema design (1 rule)"

# ═══════════════════════════════════════════════════════════════════════════════
# USAGE — ПОРЯДОК ПОИСКА ПРАВИЛ
# ═══════════════════════════════════════════════════════════════════════════════
usage: |
  1. Извлеки ключевые слова из задачи (TASK/PRP файл, описание, код)
  2. Сопоставь keywords каждой секции ниже с ключевыми словами задачи
  3. При совпадении ≥1 keyword → загрузи sub-index по index_path
  4. В sub-index найди files[] с подходящими keywords → загрузи по priority
  5. ВСЕГДА загружай common rules (apply ко всем БД)
  6. Если задача упоминает несколько БД — загрузи секции для каждой

  Примеры:
    Задача "написать репозиторий для сохранения сигналов в PostgreSQL"
    → keywords match: postgres, pgx, repository, sql, INSERT, RETURNING
    → загрузить: postgres/rules_index.yaml → go_integration.md (pri 1), query_patterns.md (pri 2)

    Задача "оптимизировать запросы к ClickHouse для OHLCV данных"
    → keywords match: clickhouse, OHLCV, optimization, query, time-series
    → загрузить: clickhouse/rules_index.yaml → query_patterns.md, optimization.md

