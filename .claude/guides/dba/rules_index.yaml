# ═══════════════════════════════════════════════════════════════════════════════
# COMMON RULES (apply to all databases)
# ═══════════════════════════════════════════════════════════════════════════════
common:
  files:
    - path: "sql_schema_design.md"
      description: "SQL schema design rules: no CASCADE, application-side management"
      priority: 1

  rules:
    - id: "DB-001"
      rule: "Always use context with timeout"
      example: "ctx, cancel := context.WithTimeout(ctx, 5*time.Second)"
      critical: true
    - id: "DB-002"
      rule: "Close connections/cursors with defer"
      critical: true
    - id: "DB-003"
      rule: "Use connection pooling"
      critical: true
    - id: "DB-004"
      rule: "Handle errors explicitly, wrap with context"
      critical: true
    - id: "DB-005"
      rule: "Use transactions for multi-statement operations"
    - id: "DB-006"
      rule: "Log slow queries"
    - id: "DB-007"
      rule: "Use prepared statements for repeated queries"
    - id: "DB-SCHEMA-001"
      rule: "No CASCADE in foreign keys — all relationship management on application side"
      details: "See sql_schema_design.md for patterns and examples"
      critical: true
