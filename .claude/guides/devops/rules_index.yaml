# DevOps Rules Index
# Индекс правил для DevOps и инфраструктурных задач.
# Поиск по ключевым словам: найди keywords, совпадающие с контекстом задачи,
# и загрузи файл из path соответствующей секции.

metadata:
  version: "3.0"
  last_updated: "2026-03-10"
  description: "Keyword-based index of DevOps rules and patterns"
  total_rules: 275
  rule_prefixes:
    - "DK-XXX: Docker (18 rules)"
    - "K8-XXX: Kubernetes (17 rules)"
    - "PGD-XXX: PostgreSQL Deploy (33 rules)"
    - "CHD-XXX: ClickHouse Deploy (44 rules)"
    - "RDD-XXX: Redis Deploy (39 rules)"
    - "MYD-XXX: MySQL Deploy (34 rules)"
    - "MGD-XXX: MongoDB Deploy (50 rules)"
    - "KF-XXX: Kafka (40 rules)"

# ═══════════════════════════════════════════════════════════════════════════════
# USAGE — ПОРЯДОК ПОИСКА ПРАВИЛ
# ═══════════════════════════════════════════════════════════════════════════════
usage: |
  1. Извлеки ключевые слова из задачи (TASK/PRP файл, описание, код)
  2. Сопоставь keywords каждой секции ниже с ключевыми словами задачи
  3. При совпадении ≥1 keyword → загрузи файл по path
  4. ВСЕГДА загружай common rules (apply ко всем DevOps задачам)
  5. Если задача затрагивает несколько технологий — загрузи секции для каждой

  Примеры:
    Задача "создать Dockerfile для signal-analyzer"
    → keywords match: Docker, Dockerfile, container, multi-stage, image
    → загрузить: docker.md

    Задача "настроить ClickHouse в Kubernetes с репликацией"
    → keywords match: kubernetes, clickhouse, deployment, cluster, replica
    → загрузить: kubernetes.md + clickhouse.md

# ═══════════════════════════════════════════════════════════════════════════════
# DOCKER
# ═══════════════════════════════════════════════════════════════════════════════
docker:
  keywords:
    # Технология
    - "docker"
    - "Dockerfile"
    - "docker-compose"
    - "docker compose"
    - "container"
    - "контейнер"
    - "image"
    - "образ"
    # Паттерны
    - "multi-stage"
    - "scratch"
    - "distroless"
    - "alpine"
    - "CGO_ENABLED"
    - "HEALTHCHECK"
    - ".dockerignore"
    # Операции
    - "docker build"
    - "docker run"
    - "docker push"
    - "registry"
    - "Docker Hub"
    - "GHCR"
    # Безопасность
    - "non-root"
    - "USER nonroot"
    - "image scan"
    - "trivy"
    - "snyk"

  path: "docker.md"
  lines: 650
  total_rules: 18
  rule_id_range: "DK-001..DK-018"

  sections:
    - name: "Multi-Stage Builds"
      description: "Patterns for multi-stage Dockerfiles"
      keywords: ["multi-stage", "builder", "scratch", "distroless"]
    - name: "Docker Compose"
      description: "Service orchestration patterns"
      keywords: ["docker-compose", "compose", "service", "network", "volume"]
    - name: "Security"
      description: "Non-root, secrets, scanning"
      keywords: ["non-root", "USER", "secret", "scan", "trivy"]
    - name: "Performance"
      description: "Layer caching, image optimization"
      keywords: ["cache", "layer", "size", "optimization"]

  key_rules:
    - id: "DK-001"
      rule: "Use multi-stage builds for production"
      critical: true
    - id: "DK-002"
      rule: "Run as non-root user"
      example: "USER nonroot:nonroot"
      critical: true
    - id: "DK-003"
      rule: "Cache dependencies layer separately"
      example: "COPY go.mod go.sum ./ && RUN go mod download"
    - id: "DK-004"
      rule: "Use specific image tags, not :latest"
      critical: true
    - id: "DK-005"
      rule: "Minimize layers, combine RUN commands"
    - id: "DK-006"
      rule: "Use .dockerignore"
      critical: true
    - id: "DK-007"
      rule: "Set HEALTHCHECK"
    - id: "DK-008"
      rule: "Use CGO_ENABLED=0 for Go"
    - id: "DK-009"
      rule: "Use scratch or distroless for production"
      critical: true
    - id: "DK-010"
      rule: "Never expose secrets in ARG/ENV"
      critical: true
    - id: "DK-011"
      rule: "Set resource limits"

