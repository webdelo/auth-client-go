# ═══════════════════════════════════════════════════════════════════════════
# DEBUGGING AGENTS (для отладки и исправления ошибок)
# ═══════════════════════════════════════════════════════════════════════════

debugging_agents:
  # Типичные ошибки в PRODUCTION CODE (НЕ тесты)
  debugger:
    name: "debugger"
    subagent_type: "debugger"
    native_subagent: true  # Built-in Claude Code agent
    category: "debugging"
    purpose: "Ошибки в PRODUCTION CODE (*.go): компиляция, runtime, linter, DI"
    model: "sonnet"
    tools: ["Read", "Edit", "Grep", "Glob", "Bash", "Write"]
    background: true
    mode: "acceptEdits"

    triggers:
      keywords:
        # Compilation (в *.go, НЕ *_test.go)
        - "cannot find"
        - "undefined"
        - "type mismatch"
        - "syntax app_error"
        - "import cycle"
        # Linter (требует логики)
        - "errcheck"
        - "staticcheck"
        - "ineffassign"
        # Runtime
        - "nil pointer"
        - "index out of range"
        - "panic"
        # DI
        - "missing dependency"
        - "invoke failed"
        - "circular dependency"

    when_to_use: "Ошибки в production code (*.go БЕЗ _test.go)"

    does_not_handle:
      - "*_test.go errors → unit-test-writer"
      - "FAIL, got X want Y → unit-test-writer"
      - "mock not satisfied → unit-test-writer"
      - "DATA RACE → debugger-complex"
      - "deadlock → debugger-complex"
      - "flaky tests → debugger-complex"

    file_filter: "*.go (excluding *_test.go)"

    standards:
      lazy_loading: true
      index: ".claude/guides/rules_index.yaml"

    output: ".memory_bank/agent_task_results/{DATE}_debug_{issue}.md"

  # Сложные ошибки: race, deadlock, concurrency, flaky, multi-file
  debugger-complex:
    name: "debugger-complex"
    subagent_type: "debugger-complex"
    native_subagent: true  # Built-in Claude Code agent
    category: "debugging"
    purpose: "Сложные ошибки: race, deadlock, goroutine leak, flaky tests, multi-file logic"
    model: "opus"  # Глубокий reasoning для сложных случаев
    tools: ["Read", "Edit", "Grep", "Glob", "Bash", "Write"]
    background: true
    mode: "acceptEdits"

    triggers:
      keywords:
        - "DATA RACE"
        - "race detected"
        - "concurrent read/write"
        - "deadlock"
        - "all goroutines are asleep"
        - "goroutine leak"
        - "leaked goroutine"
        - "never terminates"
        - "flaky"
        - "intermittent"
        - "sometimes fails"
        - "send on closed channel"
        - "blocked on chan"
        - "FSM"
        - "invalid transition"

    when_to_use: "Сложные ошибки требующие stress testing, wait-for graph, call graph analysis"

    exclusive_to_this_agent:
      - "Race conditions (multi-goroutine happens-before)"
      - "Deadlocks (wait-for graph)"
      - "Goroutine leaks (lifecycle tracing)"
      - "Flaky tests (stress testing)"
      - "Channel issues (ownership patterns)"
      - "Multi-file logic (3+ files in trace)"

    standards:
      always_load:
        - ".claude/guides/golang/effective_concurrency.md"
        - ".claude/guides/libs/concurrency_patterns.md"

    output: ".memory_bank/agent_task_results/{DATE}_debug_{issue}.md"

