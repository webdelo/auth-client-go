# Claude Code Agents Catalog
# Централизованный каталог всех доступных агентов с триггерами для автоматического выбора

metadata:
  version: "1.1"
  created_at: "2026-01-27"
  updated_at: "2026-01-30"
  description: |
    Catalog of all available Claude Code agents with:
    - Capabilities and tools
    - Triggers for automatic selection
    - When to use recommendations
    - Mandatory/optional flags

# ═══════════════════════════════════════════════════════════════════════════
# AGENT TYPES EXPLANATION
# ═══════════════════════════════════════════════════════════════════════════
#
# There are two types of agents in this catalog:
#
# 1. BUILT-IN AGENTS (native_subagent: true)
#    - These are built into Claude Code and can be called directly
#    - Example: Task(subagent_type="code-writer", prompt="...")
#    - The subagent_type value is a native type recognized by Claude Code
#
# 2. VIRTUAL AGENTS (native_subagent: false)
#    - These are custom agents defined only in this project
#    - They use "general-purpose" as the actual subagent_type
#    - The prompt must include instructions from the agent's .md file
#    - Example: Task(subagent_type="general-purpose", prompt="<contents of .claude/agents/devops-engineer.md> + task")
#    - instruction_file points to the agent definition with full instructions
#
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
# CODING AGENTS (для написания и изменения кода)
# ═══════════════════════════════════════════════════════════════════════════

coding_agents:
  code_writer:
    name: "code-writer"
    subagent_type: "code-writer"
    native_subagent: true  # Built-in Claude Code agent
    category: "coding"
    purpose: "Написание нового кода (функции, модули, фичи)"
    model: "sonnet"
    tools: ["Read", "Edit", "Write", "NotebookEdit", "TodoWrite", "Skill", "SlashCommand", "mcp__ide__getDiagnostics"]
    background: true

    triggers:
      keywords:
        - "написать"
        - "создать"
        - "реализовать"
        - "добавить функцию"
        - "новый метод"
        - "имплементировать"

    when_to_use: "При создании нового кода (функций, модулей, features)"
    standards:
      - ".claude/guides/golang/coding_style.md"
      - ".claude/guides/golang/effective_standards.md"
      - ".claude/guides/golang/effective_concurrency.md"

    # ═══════════════════════════════════════════════════════════════════
    # ОБЯЗАТЕЛЬНЫЙ ПРОМПТ-ШАБЛОН
    # Оркестратор ДОЛЖЕН включить эти инструкции в КАЖДЫЙ вызов агента
    # ═══════════════════════════════════════════════════════════════════
    prompt_template: |
      ПЕРЕД написанием кода ОБЯЗАТЕЛЬНО:
      1. Прочитай .claude/guides/golang/rules_index.yaml — индекс правил (ES-*, EC-*, CS-*)
      2. Если задача работает с БД (postgres, clickhouse, redis, repository, query, SQL):
         → Прочитай .claude/guides/dba/rules_index.yaml
         → Найди секцию по keywords задачи
         → Загрузи файлы из files[] по priority
         → Применяй key_rules при написании кода
      3. Если задача связана с инфраструктурой (docker, kubernetes, deployment):
         → Прочитай .claude/guides/devops/rules_index.yaml
         → Найди секцию по keywords задачи
         → Применяй key_rules

  refactorer:
    name: "refactorer"
    subagent_type: "refactorer"
    native_subagent: true  # Built-in Claude Code agent
    category: "coding"
    purpose: "Механические преобразования: форматирование, rename, nolint, перенос файлов"
    model: "haiku"  # Быстрая модель для простых задач
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash"]
    background: true
    mode: "acceptEdits"

    triggers:
      keywords:
        - "gofmt"
        - "goimports"
        - "rename"
        - "переименовать"
        - "move file"
        - "переместить"
        - "nolint"
        - "update imports"
        - "обновить импорты"
        - "dead code"
        - "мёртвый код"
        - "magic number"
        - "константа"

    when_to_use: "Механические задачи БЕЗ анализа логики: форматирование, rename, nolint, перенос файлов"

    does_not_handle:
      - "extract function (требует анализа логики)"
      - "изменение control flow"
      - "исправление багов → debugger"
      - "сложный рефакторинг → ручной review"

# ═══════════════════════════════════════════════════════════════════════════
# REVIEW AGENTS (для проверки качества кода и тестов)
# ═══════════════════════════════════════════════════════════════════════════

review_agents:
  code_reviewer:
    name: "code-reviewer"
    subagent_type: "code-reviewer"
    native_subagent: true  # Built-in Claude Code agent
    category: "review"
    purpose: "Проверка качества, безопасности и maintainability кода"
    model: "sonnet"
    tools: ["Read", "Edit", "Grep", "Glob", "Bash", "Write"]
    background: true
    mode: "acceptEdits"

    triggers:
      keywords:
        - "code review"
        - "проверить код"
        - "ревью кода"
        - "проверка качества"

    when_to_use: "ОБЯЗАТЕЛЬНО после написания значительного кода, перед PR"
    mandatory_after: ["code-writer", "refactorer"]

    standards:
      - priority: 1
        guide: ".claude/guides/golang/effective_standards.md"
        prefix: "ES"
      - priority: 2
        guide: ".claude/guides/golang/effective_concurrency.md"
        prefix: "EC"
      - priority: 3
        guide: ".claude/guides/golang/coding_style.md"
        prefix: "CS"
      - priority: 4
        guide: ".claude/guides/dba/rules_index.yaml"
        prefix: "PG/CH/RD/MY/MG/SQ/QD/DB"
        condition: "Если код работает с БД"
      - priority: 5
        guide: ".claude/guides/devops/rules_index.yaml"
        prefix: "DK/K8/DO"
        condition: "Если код связан с инфраструктурой"

    critical_rules:
      - "EC-0063: НЕ смешивать atomic и mutex"
      - "EC-0064: Максимум 1 mutex на метод"
      - "EC-0062: Использовать Swap() для entry guards"

    # ═══════════════════════════════════════════════════════════════════
    # ОБЯЗАТЕЛЬНЫЙ ПРОМПТ-ШАБЛОН
    # Оркестратор ДОЛЖЕН включить эти инструкции в КАЖДЫЙ вызов агента
    # ═══════════════════════════════════════════════════════════════════
    prompt_template: |
      ПЕРЕД ревью ОБЯЗАТЕЛЬНО:
      1. Прочитай .claude/guides/golang/rules_index.yaml — индекс правил (ES-*, EC-*, CS-*)
      2. Если код работает с БД (файлы в internal/repository/, SQL запросы, pgx, clickhouse-go):
         → Прочитай .claude/guides/dba/rules_index.yaml
         → Найди секцию по keywords (postgres → PG-*, clickhouse → CH-*)
         → Верифицируй key_rules в ревью
         → Добавь dba_rules в секцию rules_verified отчёта
      3. Если код связан с инфраструктурой (Dockerfile, K8s manifests):
         → Прочитай .claude/guides/devops/rules_index.yaml
         → Верифицируй key_rules
         → Добавь devops_rules в секцию rules_verified отчёта

    # ═══════════════════════════════════════════════════════════════════════
    # ОБЯЗАТЕЛЬНЫЕ ПРОВЕРКИ (КРИТИЧЕСКИ ВАЖНО!)
    # ═══════════════════════════════════════════════════════════════════════
    required_checks:
      - id: "DOD-001"
        description: "Проверка DOD чеклиста из TASK файла"
        mandatory: true
        actions:
          - "Прочитать TASK файл (task_management/tasks/{TASK-ID}.md)"
          - "Найти секцию DOD (Definition of Done)"
          - "Проверить КАЖДЫЙ критерий из DOD"
          - "Выполнить grep-проверки если указаны в DOD"
          - "В CODE-REVIEW указать статус КАЖДОГО критерия DOD"

      - id: "DOD-002"
        description: "Grep-проверки из DOD"
        mandatory: true
        condition: "Если DOD содержит grep-проверки"
        actions:
          - "Выполнить ВСЕ grep команды указанные в DOD"
          - "Записать результаты в CODE-REVIEW"
          - "Если grep находит запрещённые паттерны → verdict: CHANGES_REQUESTED"

      - id: "DOD-003"
        description: "Проверка полноты выполнения"
        mandatory: true
        actions:
          - "Проверить что ВСЕ фазы PRP выполнены"
          - "Если какая-то фаза не выполнена → verdict: CHANGES_REQUESTED"
          - "Partial execution = CHANGES_REQUESTED (не APPROVED)"

    # ═══════════════════════════════════════════════════════════════════════
    # ЗАПРЕЩЁННЫЕ ДЕЙСТВИЯ
    # ═══════════════════════════════════════════════════════════════════════
    forbidden:
      - "❌ ЗАПРЕЩЕНО редактировать .memory_bank/tasks_list.yaml напрямую"
      - "❌ Для обновления статуса использовать ТОЛЬКО: python3 .claude/scripts/req_status.py refresh-lifecycle {TASK-ID}"
      - "❌ ЗАПРЕЩЕНО самовольно исключать scope/фазы из PRP"
      - "❌ ЗАПРЕЩЕНО решать 'out of scope' без согласования с пользователем"
      - "❌ ЗАПРЕЩЕНО утверждать partial execution как APPROVED"
      - "❌ ЗАПРЕЩЕНО игнорировать DOD чеклист из TASK файла"
      - "❌ ЗАПРЕЩЕНО игнорировать grep-проверки из DOD"
      - "❌ 'Backward compatibility' НЕ является причиной не удалять deprecated код"

    # ═══════════════════════════════════════════════════════════════════════
    # VERDICT RULES
    # ═══════════════════════════════════════════════════════════════════════
    verdict_rules:
      APPROVED:
        conditions:
          - "ВСЕ фазы PRP выполнены"
          - "ВСЕ критерии DOD выполнены"
          - "ВСЕ grep-проверки из DOD пройдены"
          - "Нет critical issues"

      APPROVED_WITH_COMMENTS:
        conditions:
          - "ВСЕ фазы PRP выполнены"
          - "ВСЕ критерии DOD выполнены"
          - "Есть warnings/suggestions но НЕ critical"

      CHANGES_REQUESTED:
        conditions:
          - "Хотя бы одна фаза PRP НЕ выполнена"
          - "Хотя бы один критерий DOD НЕ выполнен"
          - "Grep-проверки нашли запрещённые паттерны"
          - "Есть critical issues"
          - "Deprecated код НЕ удалён хотя требовалось"

    output:
      intermediate: ".memory_bank/agent_task_results/{DATE}_code-review_{package}.yaml"
      final: "task_management/reviews/{TASK-ID}-CODE-REVIEW.yaml"

  test_reviewer:
    name: "test-reviewer"
    subagent_type: "test-reviewer"
    native_subagent: true  # Built-in Claude Code agent
    category: "review"
    purpose: "Проверка качества тестов и соответствия стандартам"
    model: "sonnet"
    tools: ["Read", "Edit", "Grep", "Glob", "Bash", "Write"]
    background: true
    mode: "acceptEdits"

    triggers:
      keywords:
        - "проверить тесты"
        - "ревью тестов"
        - "test review"
        - "проверка покрытия"

    when_to_use: "ОБЯЗАТЕЛЬНО после написания тестов"
    mandatory_after: ["unit-test-writer", "gonkey-test-writer"]

    standards:
      - ".claude/guides/golang/tests_rules_index.yaml"  # Индекс UT-XXXX и IT-XXXX правил
      - ".claude/guides/golang/unit_tests_standards.md"
      - ".claude/guides/golang/integration_tests_standards.md"
      - ".claude/guides/libs/testify.md"

    # ═══════════════════════════════════════════════════════════════════
    # ОБЯЗАТЕЛЬНЫЙ ПРОМПТ-ШАБЛОН
    # Оркестратор ДОЛЖЕН включить эти инструкции в КАЖДЫЙ вызов агента
    # ═══════════════════════════════════════════════════════════════════
    prompt_template: |
      ПЕРЕД ревью тестов ОБЯЗАТЕЛЬНО прочитай:
      1. .claude/guides/golang/tests_rules_index.yaml — индекс правил (UT-XXXX / IT-XXXX)
      2. .claude/guides/golang/unit_tests_standards.md — стандарты unit тестов
      3. .claude/guides/libs/testify.md — стандарты testify
      4. Если тесты работают с БД (internal/repository/, SQL, pgx, clickhouse fixtures):
         → Прочитай .claude/guides/dba/rules_index.yaml
         → Найди секцию по keywords → проверь соответствие DBA правилам

    output:
      intermediate: ".memory_bank/agent_task_results/{DATE}_test-review_{package}.md"

  security_auditor:
    name: "security-auditor"
    subagent_type: "security-auditor"
    native_subagent: true  # Built-in Claude Code agent
    category: "review"
    purpose: "Аудит безопасности по OWASP Top 10"
    model: "sonnet"
    tools: ["Read", "Grep", "Glob", "Bash"]
    background: true

    triggers:
      keywords:
        - "безопасность"
        - "security"
        - "OWASP"
        - "уязвимость"
        - "authentication"
        - "аутентификация"
        - "authorization"
        - "авторизация"
        - "password"
        - "пароль"
        - "credentials"
        - "secret"
        - "API key"
        - "валидация"
        - "user input"
        - "XSS"
        - "SQL injection"

    when_to_use: "При работе с auth, credentials, user input, перед релизом"
    output: ".memory_bank/agent_task_results/{DATE}_security-audit_{scope}.md"

# ═══════════════════════════════════════════════════════════════════════════
# TESTING AGENTS (для написания тестов)
# ═══════════════════════════════════════════════════════════════════════════

testing_agents:
  unit_test_writer:
    name: "unit-test-writer"
    subagent_type: "unit-test-writer"
    native_subagent: true  # Built-in Claude Code agent
    instruction_file: ".claude/agents/unit-test-writer.md"  # Инструкции агента с правилами
    category: "testing"
    purpose: "ЭКСКЛЮЗИВНЫЙ владелец *_test.go: написание И исправление тестов"
    model: "sonnet"
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash"]
    background: true
    mode: "acceptEdits"

    triggers:
      keywords:
        # Написание тестов
        - "написать тесты"
        - "unit тесты"
        - "покрыть тестами"
        - "тестовое покрытие"
        - "coverage"
        # Исправление тестов (НОВОЕ)
        - "FAIL"
        - "got X want Y"
        - "assertion failed"
        - "expected call"
        - "mock not satisfied"
        - "test compilation"
        - "_test.go"
        - "тест падает"
        - "fix test"
        - "исправить тест"

    when_to_use: "ВСЕ задачи с *_test.go файлами: написание И исправление"
    mandatory_after: ["code-writer"]

    exclusive_owner_of:
      - "*_test.go files"
      - "test failures (got X want Y)"
      - "mock issues (expected call, mock not satisfied)"
      - "test compilation errors"

    does_not_handle:
      - "production code (*.go without _test) → debugger"
      - "race conditions → debugger-complex"

    standards:
      - ".claude/guides/golang/tests_rules_index.yaml"  # Индекс UT-XXXX правил
      - ".claude/guides/golang/unit_tests_standards.md"
      - ".claude/guides/libs/testify.md"
      - ".claude/guides/libs/mockery.md"

    # ═══════════════════════════════════════════════════════════════════
    # ОБЯЗАТЕЛЬНЫЙ ПРОМПТ-ШАБЛОН
    # Оркестратор ДОЛЖЕН включить эти инструкции в КАЖДЫЙ вызов агента
    # ═══════════════════════════════════════════════════════════════════
    prompt_template: |
      ПЕРЕД написанием тестов ОБЯЗАТЕЛЬНО прочитай:
      1. .claude/guides/golang/tests_rules_index.yaml — индекс правил (UT-XXXX)
      2. .claude/guides/golang/unit_tests_standards.md — стандарты тестов
      3. .claude/guides/libs/testify.md — библиотека assertions
      4. .claude/guides/libs/mockery.md — генерация моков
      5. Если тесты работают с БД (файлы в internal/repository/, SQL, pgx, clickhouse-go):
         → Прочитай .claude/guides/dba/rules_index.yaml
         → Найди секцию по keywords → загрузи файлы по priority
         → Применяй key_rules при написании тестов (корректные моки pgxpool и т.д.)

      АБСОЛЮТНЫЕ ПРАВИЛА (с ID из tests_rules_index.yaml):
      - UT-0001/UT-0002: Table-driven tests ОБЯЗАТЕЛЬНЫ (один метод = одна функция Test<Type>_<Method>)
      - UT-0020/UT-0021: Моки ТОЛЬКО через mockery (из mocks/), Expecter API (.EXPECT().Method())
      - UT-0022: Все моки с .Once()/.Times(n) — обязательно
      - UT-0023: Запрещено mock.Anything для бизнес-данных
      - UT-0040/UT-0041: t.Parallel() + tc := tc
      - Если нужного мока нет — добавь интерфейс в .mockery.yaml и запусти make mocks

    output: ".memory_bank/agent_task_results/{DATE}_tests_{package}.md"

  gonkey_test_writer:
    name: "gonkey-test-writer"
    subagent_type: "gonkey-test-writer"
    native_subagent: true  # Built-in Claude Code agent
    category: "testing"
    purpose: "Написание Gonkey интеграционных YAML-тестов для REST/JSON API"
    model: "sonnet"
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash"]
    background: true
    mode: "acceptEdits"

    triggers:
      keywords:
        - "интеграционные тесты"
        - "gonkey"
        - "API тесты"
        - "HTTP тесты"
        - "тесты с БД"

    when_to_use: "Для интеграционного тестирования HTTP API с БД и mocks"

    standards:
      - ".claude/guides/golang/tests_rules_index.yaml"  # Индекс IT-XXXX правил
      - ".claude/guides/golang/integration_tests_standards.md"
      - ".claude/guides/libs/gonkey.md"

    # ═══════════════════════════════════════════════════════════════════
    # ОБЯЗАТЕЛЬНЫЙ ПРОМПТ-ШАБЛОН
    # Оркестратор ДОЛЖЕН включить эти инструкции в КАЖДЫЙ вызов агента
    # ═══════════════════════════════════════════════════════════════════
    prompt_template: |
      ПЕРЕД написанием интеграционных тестов ОБЯЗАТЕЛЬНО прочитай:
      1. .claude/guides/golang/tests_rules_index.yaml — индекс правил (IT-XXXX)
      2. .claude/guides/golang/integration_tests_standards.md — стандарты IT тестов
      3. .claude/guides/libs/gonkey.md — паттерны gonkey framework
      4. Gonkey тесты ВСЕГДА работают с БД — ОБЯЗАТЕЛЬНО:
         → Прочитай .claude/guides/dba/rules_index.yaml
         → Найди секцию по keywords (postgres, clickhouse, redis...)
         → Загрузи файлы по priority → применяй key_rules для fixtures и dbQuery/dbResponse

    output: "YAML тест-кейсы + fixtures + mocks + отчёт"

  benchmark_runner:
    name: "benchmark-runner"
    subagent_type: "benchmark-runner"
    native_subagent: true  # Built-in Claude Code agent
    category: "testing"
    purpose: "Тестирование производительности"
    model: "sonnet"
    tools: ["Read", "Bash", "Grep", "Glob", "Write"]
    background: true

    triggers:
      keywords:
        - "benchmark"
        - "бенчмарк"
        - "производительность"
        - "performance"
        - "оптимизация"
        - "узкие места"

    when_to_use: "При оптимизации критичного кода, сравнении реализаций"
    output: ".memory_bank/agent_task_results/{DATE}_benchmark_{scope}.md"

# ═══════════════════════════════════════════════════════════════════════════
# RESEARCH AGENTS (для исследования и анализа)
# ═══════════════════════════════════════════════════════════════════════════

research_agents:
  code_researcher:
    name: "code-researcher"
    subagent_type: "code-researcher"
    native_subagent: true  # Built-in Claude Code agent
    category: "research"
    purpose: "Исследование кодовой базы, поиск паттернов, анализ архитектуры"
    model: "sonnet"
    tools: ["Read", "Grep", "Glob", "Bash"]
    background: true

    triggers:
      # Поиск примеров
      search_keywords:
        - "найти похожий"
        - "как это сделано"
        - "посмотреть пример"
        - "где используется"
        - "найти все места"
        - "аналогично"
        - "по примеру"
        - "как в"
        - "кодовая база"
        - "код примера"

      # Изучение кода
      exploration_keywords:
        - "какой паттерн"
        - "существующая реализация"
        - "как реализовано"
        - "аналогичный функционал"
        - "похожая логика"

      # Архитектура
      architecture_keywords:
        - "архитектура"
        - "структура проекта"
        - "зависимости"
        - "взаимодействие между"
        - "как связаны"

    when_to_use: "ВСЕГДА при планировании новой фичи - для поиска существующих паттернов"
    mandatory: true
    mandatory_for: ["planning"]

    output: ".memory_bank/agent_task_results/{DATE}_code-research_{feature}.md"

  web_searcher:
    name: "web-searcher"
    subagent_type: "web-searcher"
    native_subagent: true  # Built-in Claude Code agent
    category: "research"
    purpose: "Поиск документации и best practices в интернете"
    model: "opus"
    tools: ["WebSearch", "Bash", "Read", "Write"]
    background: true

    triggers:
      # Интеграция
      integration_keywords:
        - "интегрировать"
        - "интеграция"
        - "подключить"
        - "добавить поддержку"
        - "использовать"
        - "настроить"

      # Изучение
      learning_keywords:
        - "как работает"
        - "как использовать"
        - "пример использования"
        - "как правильно"
        - "способы"
        - "варианты реализации"

      # Документация
      documentation_keywords:
        - "документация"
        - "docs"
        - "documentation"
        - "гайд"
        - "guide"
        - "tutorial"
        - "readme"

      # Research
      research_keywords:
        - "best practices"
        - "best practice"
        - "рекомендации"
        - "стандарты"
        - "как решить"
        - "как сделать"

      # Web/HTTP
      web_keywords:
        - "http"
        - "https"
        - "REST"
        - "API"
        - "webhook"
        - "websocket"

      # External libraries
      external_library_patterns:
        - "github.com/"
        - "go.uber.org/"
        - "google.golang.org/"
        - "gopkg.in/"

    when_to_use: "При работе с новыми библиотеками, внешними API или нестандартными паттернами"
    mandatory: false

    # ═══════════════════════════════════════════════════════════════════
    # ОБЯЗАТЕЛЬНЫЙ ПРОМПТ-ШАБЛОН
    # Оркестратор ДОЛЖЕН включить эти инструкции в КАЖДЫЙ вызов агента
    # ═══════════════════════════════════════════════════════════════════
    prompt_template: |
      **CRITICAL INSTRUCTIONS — READ BEFORE DOING ANYTHING:**

      1. You MUST NOT use WebFetch tool. It is FORBIDDEN.
      2. To download web pages, use ONLY Bash with curl:
         ```bash
         curl --max-time 30 -sL -H "User-Agent: Mozilla/5.0" "<URL>" | python3 .claude/scripts/html2text.py
         ```
      3. WebSearch summaries are your PRIMARY data source (90% of research).
         Only download pages when summaries lack specific code examples or configuration.
      4. Maximum 3 curl downloads per session.
      5. If curl fails (timeout/DNS/empty) — skip URL, move on.

    output: ".memory_bank/agent_task_results/{DATE}_web-research_{topic}.md"

