# ────────────────────────────────────────────────────────────────────────────────
# PRP DOD COMPLIANCE
# ────────────────────────────────────────────────────────────────────────────────
prp_dod_compliance:
  cookies_security_regression_guard: pass
  # HttpOnly=true and Secure=true re-asserted AFTER the opts loop (cookies.go:102-106)
  cookies_no_insecure_options: pass
  # Only 4 permitted option constructors exist: WithCookieDomain, WithCookiePath,
  # WithCookieMaxAge, WithCookieSameSite — no security-disabling options
  cookies_defaults_correct: pass
  # defaultRefreshCookieName="refresh_token", defaultRefreshCookiePath="/auth/refresh",
  # defaultRefreshCookieMaxAge=14*24*60*60 (1209600s), SameSite=StrictMode, Domain="" (host-only)
  cookies_clear_expires_epoch: pass
  # ClearRefreshCookie: MaxAge=-1 AND Expires=time.Unix(0,0) with RFC 6265 §5.3 comment
  helpers_fallback_chain_order: pass
  # IPFromRequest: X-Real-IP → XFF[0] (SplitN limit=2, TrimSpace) → SplitHostPort host → RemoteAddr
  helpers_security_warning: pass
  # SECURITY spoofing warning present in godoc with correct mitigation note
  godoc_es0080_es0081: pass
  # All 9 exported identifiers have godoc starting with the identifier name
  no_nolint_es0171: pass
  # No //nolint annotations in either file

# ────────────────────────────────────────────────────────────────────────────────
# TEST STANDARDS COMPLIANCE
