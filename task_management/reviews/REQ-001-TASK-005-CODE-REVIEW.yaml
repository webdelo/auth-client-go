  UT-0002: pass  # Exactly one test function per public method
  UT-0011: pass  # "happy_path" is the first declared case in every test map
  UT-0012: pass  # All case names are snake_case throughout both files
  UT-0027: pass  # No decorative // ───── separators found
  UT-0028: pass  # No helper functions for test data construction
  UT-0029: pass  # No package-level shared test variables
  UT-0030: pass  # require.Len used as critical guard before cookies[0] dereference in both cookie tests
  UT-0040: pass  # t.Parallel() called at top of every outer Test* function AND every subtest

# ────────────────────────────────────────────────────────────────────────────────
# POSITIVES
# ────────────────────────────────────────────────────────────────────────────────
positives:
  # From code-reviewer
  - "Functional options pattern (ES-0120) correctly applied — CookieOption is func(*http.Cookie), identical idiom to Option func(*Client) from TASK-002."
  - "Security invariant (HttpOnly+Secure forcibly re-asserted AFTER opts loop) implemented in newRefreshCookie; ordering contract documented in CookieOption godoc."
  - "Only 4 permitted options exported; no security-disabling options exist. Forbidden options named in unexported helper's godoc."
  - "ClearRefreshCookie correctly sets MaxAge=-1 AND Expires=time.Unix(0,0) together, matching RFC 6265 §5.3 compat pattern from auth-service reference."
  - "All exported identifiers start their godoc with the identifier name (ES-0080/0081) — verified for all 9 exported symbols."
  - "Named constants for all defaults; no magic numbers (CS-0003)."
  - "No lines exceed 120 characters (CS-0001). No decorative separators (CS-0112)."
  - "IPFromRequest fallback chain matches PRP specification exactly: X-Real-IP → XFF[0] → SplitHostPort host → RemoteAddr verbatim."
  - "strings.SplitN(xff, \",\", 2) correctly uses limit=2, preventing unnecessary work when XFF contains many hops."
  - "strings.TrimSpace applied to XFF first element before returning."
  - "SECURITY warning in IPFromRequest godoc is concise, actionable, and documents spoofing risk with correct mitigation."
  - "UserAgentFromRequest is a clean passthrough; rationale comment (API symmetry) explains why trivial wrapper is warranted."
  - "Guard-clause pattern (ES-0021) produces flat, readable control flow in both files."
  - "No goroutines, mutex, atomic, or channels in either file — no concurrency concerns."
  # From test-reviewer
  - "All 28 test cases pass with -race; 0 data-race warnings across all subtests. Total test runtime ~1.3s."
  - "tc := tc capture present in both cookie test loops (cookies_test.go:125, 196) and helper test loops (helpers_test.go:70, 111)."
  - "RFC 6265 leading-dot-stripping comment in cookies_test.go is a useful annotation for readers."
  - "Priority chain (X-Real-IP > X-Forwarded-For > RemoteAddr) exercised by dedicated priority test cases."
  - "IPv6 bracket stripping, whitespace trimming, and empty-source fallback are all explicitly covered in TestIPFromRequest."
  - "require.Len correctly placed before cookies[0] dereference in both cookie test loops — acts as critical guard against index panic."

