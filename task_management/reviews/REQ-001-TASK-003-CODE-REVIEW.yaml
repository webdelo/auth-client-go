    title: "Internal rule codes in godoc comments (ES-0051, EC-0051)"
    description: |
      Two comments embedded internal coding-standard rule identifiers:
        - Line 153: "auth_v1.AuthServiceClient (ES-0051 — interfaces live where they are used)."
        - Line 180: "not a per-request context (EC-0051 exception)."
      CS-0110 prohibits references to internal rules/standards inside production code comments.
      Comments should explain the "why" in plain language without coupling code to an internal
      rule numbering scheme.
    recommended_fix: |
      // Line 153 — replace:
      // auth_v1.AuthServiceClient (ES-0051 — interfaces live where they are used).
      // with:
      // auth_v1.AuthServiceClient. Defined here so the SDK can mock it in tests without
      // depending on the generated stub package in test binaries.

      // Line 180 — replace:
      // not a per-request context (EC-0051 exception).
      // with:
      // not a per-request context — it is a lifecycle context that drives background
      // goroutines (cache cleanup, etc.) and is cancelled by Close.
    resolution_status: fixed
    resolution_note: >
      Both rule-code references replaced with plain-language explanations as prescribed.
      Line 153 now reads "Defined here so the SDK can mock it in tests without depending on
      the generated stub package in test binaries." Line 180 now reads "not a per-request
      context — it is a lifecycle context that drives background goroutines (cache cleanup,
      etc.) and is cancelled by Close."

