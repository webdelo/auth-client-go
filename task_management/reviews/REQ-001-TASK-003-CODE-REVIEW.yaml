    security_category: header_compliance
    security_severity: LOW
    title: "DoS: maxBearerLen cap applied after TrimSpace and ContainsAny, not before"
    description: >
      In bearerToken(), the 8 KiB length cap is the LAST condition checked after TrimSpace()
      and ContainsAny() have already traversed the full token string. An attacker can send a
      token up to net/http's 1 MB header limit, causing O(n) string scans before O(1) rejection.
      For gRPC, per-metadata size limits are less strict. Severity LOW because real-world JWT
      tokens are well under 2 KB and server-level limits reduce blast radius.
    recommendation: >
      Apply the length cap on the raw authorization header string BEFORE any string scanning,
      immediately after the initial TrimLeft. This makes rejection of oversized tokens O(1).

  - id: CR-032
    severity: SUGGESTION
    rule_id: null
    source_package: security
    original_id: SEC-003
    file: lib/client.go
    line: 205
    security_category: transport
    security_severity: LOW
    title: "Insecure gRPC transport is the hard default; TLS override requires explicit consumer action"
    description: >
      New() unconditionally adds grpc.WithTransportCredentials(insecure.NewCredentials()) as
      the first dial option. All ValidateToken calls (carrying the raw access token in the
      protobuf body) go over plaintext by default. There is no warning in Config.Endpoint or
      New() documentation that the connection is plaintext by default.
    recommendation: >
      Add a godoc note on Config.Endpoint or Config.DialOptions stating that the default
      transport is insecure (no TLS) and that production deployments to a remote AUTH server
      MUST supply grpc.WithTransportCredentials(...) in DialOptions. Consider logging a
      Warn() at startup if the endpoint is not localhost/127.x/unix: and no TLS credentials
      are detected.

  - id: CR-033
    severity: SUGGESTION
    rule_id: null
    source_package: security
    original_id: SEC-004
    file: lib/middleware_http.go
    line: 79
    security_category: leak
    security_severity: LOW
    title: "HTTP 401 body distinguishes 'blocked' from 'invalid token', exposing account status"
    description: >
      When err is ErrBlocked, the middleware writes err.Error() ("authclient: user blocked")
      to the HTTP 401 response body. The same disclosure occurs in the gRPC interceptor where
      vErr.Error() is passed as the status message. Many auth systems deliberately collapse
      "blocked", "invalid", and "expired" to a single generic "invalid_token" to prevent
      account enumeration.
    recommendation: >
      Collapse all 401 error bodies to a single opaque message: `http.Error(w, "unauthorized",
      http.StatusUnauthorized)`. The WWW-Authenticate header already carries `error="invalid_token"`.
      For gRPC, use `status.Error(codes.Unauthenticated, "unauthenticated")`.

