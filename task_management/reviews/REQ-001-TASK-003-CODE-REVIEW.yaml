  - id: CR-W003
    original_id: CR-003
    source_report: 2026-05-18_code-review_REQ-001-TASK-003_lib.yaml
    severity: warning
    category: LOGIC
    rule_id: ES-0053
    file: lib/client.go
    line: 132
    title: "Missing compile-time interface assertion for cacheAdapter -> Cache"
    description: |
      The cacheAdapter type is the only concrete value assigned to Client.cache when no custom
      cache is provided. There was no compile-time check asserting it satisfies Cache. If a
      future refactor changes the Cache interface (e.g. adds a method) the compiler would not
      catch the mismatch at declaration — only at the assignment in New(), which is less obvious
      and further from the type. ES-0053 requires: var _ Interface = (*Impl)(nil) for all
      non-trivial implementations.
    recommended_fix: |
      // Add immediately after the cacheAdapter struct declaration in client.go:
      var _ Cache = (*cacheAdapter)(nil)
    resolution_status: fixed
    resolution_note: >
      Added var _ Cache = (*cacheAdapter)(nil) immediately after the cacheAdapter struct
      declaration in client.go.

  - id: CR-W004
    original_id: CR-004
    source_report: 2026-05-18_code-review_REQ-001-TASK-003_lib.yaml
    severity: warning
    category: LOGIC
    rule_id: CS-0060
    file: lib/client.go
    line: 132
    title: "WithCache(nil) godoc claim is inaccurate when cfg.Cache is non-nil"
    description: |
      The godoc for WithCache stated:
        "Pass nil to use the default MemoryCache (semantically equivalent to not calling WithCache)."
      This was only true when cfg.Cache was also nil. The resolution logic in New() is:
        1. Apply options (WithCache(nil) sets c.cache = nil).
        2. if c.cache == nil && cfg.Cache != nil -> c.cache = cfg.Cache.
        3. if c.cache == nil -> create default MemoryCache.
      So if a consumer passes cfg.Cache = myCache and then WithCache(nil), they get cfg.Cache,
      not the default MemoryCache. The documented and actual behaviours diverged in this edge case.
    recommended_fix: |
      // Replace the WithCache godoc with:
      // WithCache overrides the ValidateToken result cache. A non-nil value replaces
      // both Config.Cache and the SDK default MemoryCache; the SDK will not start its
      // own cleanup goroutine. Passing nil is a no-op: the priority falls through to
      // Config.Cache, then to the built-in MemoryCache.
    resolution_status: fixed
    resolution_note: >
      WithCache godoc updated to accurately describe the nil fall-through priority:
      option value -> Config.Cache -> built-in MemoryCache. The misleading "semantically
      equivalent to not calling WithCache" claim was removed.

