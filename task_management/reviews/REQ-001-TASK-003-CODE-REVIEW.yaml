  # ── WARNINGS: lib (code review) ─────────────────────────────────────────────

  - id: CR-001
    severity: WARNING
    rule_id: CS-0060
    source_package: lib
    original_id: CR-LIB-W001
    file: lib/client.go
    line: 83
    title: "Config.ValidateCacheTTL godoc claims 'skips creation' but code always creates MemoryCache"
    description: >
      The field comment states the cache layer skips creation when TTL is zero. In practice,
      New() always allocates a MemoryCache object (with cleanupInterval=0, so no goroutine).
      Caching is functionally disabled because MemoryCache.Set is a no-op for TTL=0, but the
      documentation is inaccurate and misleads custom Cache implementors.
    recommendation: >
      Replace the inaccurate sentence in the godoc: "Zero means 'cache disabled': New still
      allocates an in-memory cache object, but Set is a no-op for TTL=0 so no entries are ever
      stored. Effectively every ValidateAccessToken call reaches gRPC."

  - id: CR-002
    severity: WARNING
    rule_id: ES-0053
    source_package: lib
    original_id: CR-LIB-W002
    file: lib/client.go
    line: 314
    title: "cacheAdapter.Get/Set/Delete at 0% coverage — type assertion in Get is untested"
    description: >
      cacheAdapter wraps *cachepkg.MemoryCache. Its Get() contains a type assertion
      (user, ok := v.(User)) that is never exercised because all validate.go tests inject a
      mock Cache via WithCache, bypassing the adapter. A bug where cacheAdapter.Set stores a
      non-User value would silently cause Get to return (User{}, false) with no test catching it.
    recommendation: >
      Add a test in client_test.go that creates a real Client (using FakeAuthClient from
      export_test.go) with the default MemoryCache (no WithCache option) and calls
      ValidateAccessToken twice — the second call exercises cacheAdapter.Get/Set.

  - id: CR-003
    severity: WARNING
    rule_id: CS-0060
    source_package: lib
    original_id: CR-LIB-W003
    file: lib/errors.go
    line: 1
    title: "Package-level doc comment lives in errors.go instead of client.go or doc.go"
    description: >
      Go convention expects the package comment in the primary entry-point file or a dedicated
      doc.go. Currently the package comment is on errors.go while client.go (which defines
      Client, New, Config) has no package comment. This is confusing for readers who open
      client.go first and find no package-level explanation.
    recommendation: >
      Move the package comment to client.go or create doc.go containing only the package
      comment. Remove the comment from errors.go (leave only `package authclient`).

