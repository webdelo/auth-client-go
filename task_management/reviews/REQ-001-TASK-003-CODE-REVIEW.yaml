  # ── WARNINGS: lib/internal/cache (code review) ──────────────────────────────

  - id: CR-010
    severity: WARNING
    rule_id: EC-0081
    source_package: lib/internal/cache
    original_id: CACHE-W001
    file: lib/internal/cache/memory.go
    line: 41
    title: "No WaitGroup — cleanup goroutine exit is fire-and-forget after Close"
    description: >
      NewMemoryCache launches cleanupLoop as a bare goroutine with no sync.WaitGroup tracking.
      When Client.Close() calls cancelBG(), it signals the goroutine but returns immediately
      without waiting for cleanupLoop to finish. The goroutine may still be mid-execution inside
      c.m.Range() at that point. This makes goroutine-count assertions in tests (DOD requirement)
      inherently racy and prevents deterministic shutdown verification.
    recommendation: >
      Add sync.WaitGroup to MemoryCache. Call wg.Add(1) before the goroutine launch, defer
      wg.Done() inside the goroutine. Add a Wait() method. In Client.Close(), call
      c.memCache.Wait() after c.cancelBG() and before c.grpcConn.Close().

  - id: CR-011
    severity: WARNING
    rule_id: ES-0052
    source_package: lib/internal/cache
    original_id: CACHE-W002
    file: lib/internal/cache/memory.go
    line: 55
    title: "Bare type assertion v.(entry) without comma-ok in Get and cleanupLoop"
    description: >
      Line 55 in Get uses `e := v.(entry)` — bare assertion, panics if the stored value is not
      entry. Line 94 in the cleanupLoop Range callback uses `v.(entry).expiresAt` — same issue.
      While logically safe today (only Set writes to the map), ES-0052 mandates comma-ok for all
      type assertions. A panic inside the Range callback would crash the cleanup goroutine silently.
    recommendation: >
      Use comma-ok in both locations. On unexpected type, delete the corrupt entry and treat
      as miss/skip: `e, ok := v.(entry); if !ok { c.m.Delete(key); return nil, false }`.

  - id: CR-012
    severity: WARNING
    rule_id: ES-0140
    source_package: lib/internal/cache
    original_id: CACHE-W003
    file: lib/internal/cache/memory.go
    line: 37
    title: "Constructor named NewMemoryCache violates ES-0140 (must be New)"
    description: >
      ES-0140 mandates the constructor for a package's primary type is named New().
      Since cache is a single-entity package, the constructor should be New(), making
      call sites cachepkg.New(...) rather than the redundant cachepkg.NewMemoryCache(...).
    recommendation: >
      Rename to `func New(bgCtx context.Context, cleanupInterval time.Duration) *MemoryCache`.
      Update the call site in client.go accordingly.

  # ── WARNINGS: lib/internal/cache (test review) ──────────────────────────────

  - id: CR-013
    severity: WARNING
    rule_id: UT-0040
    source_package: lib/internal/cache
    original_id: TR-CACHE-W001
    file: lib/internal/cache/memory_test.go
    line: 128
    title: "TestMemoryCache_Cleanup missing t.Parallel() on the outer function"
    description: >
      TestMemoryCache_Cleanup does not call t.Parallel() at the top. The comment explains
      that subtests cannot be parallel (they use runtime.NumGoroutine() global state), but
      the outer wrapper function itself can declare t.Parallel() so it runs concurrently
      with other top-level test functions (TestMemoryCache_Get, TestMemoryCache_Concurrent),
      without making its own subtests parallel. Not calling t.Parallel() on the outer
      function unnecessarily serializes the entire test group.
    recommendation: >
      Add `t.Parallel()` at line 129 (immediately after the function opens). Keep subtests
      sequential (no t.Parallel() inside the loop) as currently documented.

  - id: CR-014
    severity: WARNING
    rule_id: UT-0051
    source_package: lib/internal/cache
    original_id: TR-CACHE-W002
    file: lib/internal/cache/memory_test.go
    line: 43
    title: "Magic numbers for TTL and sleep durations without named constants"
    description: >
      Several magic numeric literals appear in test cases: 10*time.Millisecond (entry TTL),
      20*time.Millisecond (sleepBefore), 5*time.Millisecond (short TTL), 60*time.Millisecond
      (wait for cleanup). The relationship between TTL and sleep is implicit — if TTL is
      changed and sleep is not updated, the test silently breaks.
    recommendation: >
      Define named constants that express the relationship, e.g.
      `const entryTTL = 10*time.Millisecond` and `sleepBefore: 25*time.Millisecond // > entryTTL`.
      Follow the pattern of the existing `const cleanupInterval = 20*time.Millisecond` on line 174.

  - id: CR-015
    severity: WARNING
    rule_id: UT-0071
    source_package: lib/internal/cache
    original_id: TR-CACHE-W003
    file: lib/internal/cache/memory_test.go
    line: 128
    title: "Time-dependent tests use real time.Sleep instead of testing/synctest"
    description: >
      Three subtests rely on wall-clock sleeping: "expired_returns_false" (20ms sleep),
      "goroutine_exits_when_ctx_cancelled" (polling loop up to 200ms), and
      "expired_entry_removed_by_cleanup" (60ms sleep). Go 1.24+ provides testing/synctest
      (available on this project's go1.26.2). The PRP Applied Standards section explicitly
      references UT-0071 and synctest. Real sleeps make tests slow, potentially flaky under
      high CPU load, and non-deterministic.
    recommendation: >
      Refactor time-dependent subtests using synctest.Run + synctest.Wait() to advance the
      fake clock. Note: synctest.Run manages its own goroutines, so t.Parallel() must not
      be called inside such subtests. The outer TestMemoryCache_Cleanup can still call
      t.Parallel() (per CR-013).

  # ── WARNINGS: security ───────────────────────────────────────────────────────

  - id: CR-016
    severity: WARNING
    rule_id: null
    source_package: security
    original_id: SEC-001
    file: lib/interceptor_grpc.go
    line: 35
    security_category: leak
    security_severity: MEDIUM
    title: "Panic value forwarded verbatim to gRPC clients — potential internal detail leak"
    description: >
      The panic recovery uses `status.Errorf(codes.Internal, "panic: %v", r)` where r is the
      unfiltered recovered value. Any string passed to panic() — including one that accidentally
      contains internal state, SQL queries, file paths, or config snippets — is serialized
      with %v and sent directly to the remote gRPC caller as the status message. The reference
      implementation in signal-analyzer correctly uses the fixed string "internal app_error"
      for the client message and logs full panic detail internally.
    recommendation: >
      Replace the status.Errorf call with a fixed generic message and move all diagnostic
      detail to the logger: `err = status.Error(codes.Internal, "internal error")`.
      Log the full panic value and debug.Stack() via c.logger.Error(). Import "runtime/debug".

