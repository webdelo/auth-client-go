  - id: CR-W006
    original_id: TEST-W002
    source_report: 2026-05-18_test-review_REQ-001-TASK-003_lib.yaml
    severity: WARNING
    rule_id: UT-0026
    file: lib/validate_test.go
    line: 28
    description_applies_to:
      - lib/validate_test.go (validateTestMocks)
      - lib/middleware_http_test.go (httpMiddlewareTestMocks)
      - lib/interceptor_grpc_test.go (interceptorTestMocks)
    title: "testMocks struct lacks newTestMocks(t) constructor"
    description: |
      UT-0026 requires the canonical pattern: testMocks struct + newTestMocks(t *testing.T)
      constructor (with t.Helper()) + newHandlerFromMocks for object construction. The three
      test files defined the struct correctly but instantiated it via inline struct literals:

        m := &validateTestMocks{
            cache: mocks.NewMockCache(t),
            auth:  &authclient.FakeAuthClient{},
        }

      Without a newTestMocks(t) constructor, t.Helper() is not called, meaning any failure
      during mock setup is attributed to the t.Run subtest line rather than the actual failing
      mock.NewMockXxx call. Adding a new dependency to the mocks struct also requires updating
      every instantiation site instead of just the constructor.
    recommended_fix: |
      Add a newTestMocks(t) constructor in each test file. Example for validate_test.go:

        func newValidateTestMocks(t *testing.T) *validateTestMocks {
            t.Helper()
            return &validateTestMocks{
                cache: mocks.NewMockCache(t),
                auth:  &authclient.FakeAuthClient{},
            }
        }

      Then in the t.Run body:
        m := newValidateTestMocks(t)
        tc.prepareMocks(t, m)

      Repeat for httpMiddlewareTestMocks (middleware_http_test.go) and
      interceptorTestMocks (interceptor_grpc_test.go).
    resolution_status: fixed
    resolution_note: >
      Added newValidateTestMocks(t), newHTTPMiddlewareTestMocks(t), and
      newInterceptorTestMocks(t) constructor functions with t.Helper() in their respective
      test files. All inline struct literals in t.Run bodies replaced with calls to the
      new constructors.

  - id: CR-W007
    original_id: TEST-W003
    source_report: 2026-05-18_test-review_REQ-001-TASK-003_lib.yaml
    severity: WARNING
    rule_id: UT-0020
    file: lib/client_test.go
    line: 12
    title: "recordingLogger / stubCache are manual stubs without import-cycle explanation"
    description: |
      client_test.go defined two hand-written types implementing SDK interfaces:
        - type recordingLogger struct{} implementing Logger
        - type stubCache struct{} implementing Cache

      UT-0020 forbids manually written mock/stub structs — generated mocks must be used. The
      accepted exception here is the import cycle: client_test.go is in package authclient
      (internal test file), and importing lib/mocks from package authclient would create a
      circular dependency. This is the same reason FakeAuthClient exists in export_test.go.
      However, while export_test.go had a clear 7-line comment block explaining the workaround,
      client_test.go had no such explanation. A future developer might attempt to replace them
      with mocks.MockLogger/mocks.MockCache, causing a build error.
    recommended_fix: |
      Add an explanatory comment at the top of client_test.go before the type declarations:

        // recordingLogger and stubCache are hand-written test doubles rather than mockery-
        // generated mocks because this file is in package authclient (internal test package).
        // Importing lib/mocks from package authclient would create a circular dependency:
        //   lib (authclient) -> lib/mocks -> lib (authclient).
        // External tests (package authclient_test) use mocks.MockCache / mocks.MockLogger
        // and avoid the cycle. See export_test.go for the same pattern applied to FakeAuthClient.
    resolution_status: fixed
    resolution_note: >
      Added the prescribed import-cycle explanation comment block immediately before the
      recordingLogger and stubCache type declarations in client_test.go, mirroring the
      style of the existing comment in export_test.go.

