  # ── SUGGESTIONS: lib/internal/cache (code review) ───────────────────────────

  - id: CR-026
    severity: SUGGESTION
    rule_id: null
    source_package: lib/internal/cache
    original_id: CACHE-S001
    file: lib/internal/cache/memory.go
    line: 93
    title: "cleanupLoop Range callback double-asserts entry struct — use local variable"
    description: >
      `v.(entry).expiresAt` in the Range callback triggers a copy of the entry struct on
      each iteration. Assigning to a local variable makes the copy explicit, avoids the
      double type-assertion, and pairs naturally with the CACHE-W002 comma-ok fix.
    recommendation: >
      `e, ok := v.(entry); if !ok { c.m.Delete(k); return true }; if now.After(e.expiresAt)
      { c.m.Delete(k) }`. Single assignment + reuse is clearer and marginally more efficient.

  - id: CR-027
    severity: SUGGESTION
    rule_id: null
    source_package: lib/internal/cache
    original_id: CACHE-S002
    file: lib/internal/cache/memory.go
    line: 37
    title: "cleanupInterval derivation (TTL/2) computed outside MemoryCache — consider documenting the contract"
    description: >
      The recommended cleanupInterval = ValidateCacheTTL/2 is computed in client.go. NewMemoryCache
      accepts any interval > 0. If a caller passes interval > TTL, tombstones accumulate longer
      than the TTL; if interval << TTL, excessive CPU is spent scanning. The godoc does not
      recommend a typical ratio relative to the TTL.
    recommendation: >
      Add a godoc note: "A value of TTL/2 is recommended: frequent enough to bound memory
      growth while keeping overhead low. A value of 0 or less skips the goroutine entirely —
      expired entries are still evicted lazily inside Get."

