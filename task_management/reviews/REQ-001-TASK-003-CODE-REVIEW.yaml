    rule_id: ES-0033
    file: lib/client.go
    line: 199
    title: "Pre-allocate dialOpts slice with named capacity constant"
    description: |
      The slice was allocated with capacity 3+len(cfg.DialOptions) and exactly 3 base options
      are appended before cfg.DialOptions, which is correct. No functional change is required,
      but naming the constant makes the capacity maintenance explicit and prevents future drift
      when a fourth default option is added without updating the magic literal.
    recommended_fix: |
      // Consider naming the constant:
      const defaultDialOptsCount = 3
      dialOpts := make([]grpc.DialOption, 0, defaultDialOptsCount+len(cfg.DialOptions))
      // This makes the capacity maintenance explicit.
    resolution_status: fixed
    resolution_note: >
      Introduced a package-level const defaultDialOptsCount = 3. The make call now reads
      make([]grpc.DialOption, 0, defaultDialOptsCount+len(cfg.DialOptions)), making the
      intentional capacity self-documenting.

  - id: CR-S003
    original_id: CR-S003
    source_report: 2026-05-18_code-review_REQ-001-TASK-003_lib.yaml
    severity: suggestion
    category: LOGIC
    rule_id: CS-0021
    file: lib/errors.go
    line: 102
    title: "retryAfterFromStatus is a no-op placeholder with a dead parameter"
    description: |
      retryAfterFromStatus took *status.Status but immediately discarded it with "_ = st".
      While the comment explained this is a future-compat placeholder, the "_ = st" idiom
      avoids an "unused parameter" compile error without adding real functionality. Using a
      blank identifier in the signature is the idiomatic Go approach for intentionally unused
      parameters, and the body should carry a TODO comment describing the future intent.
    recommended_fix: |
      // Replace the function body:
      func retryAfterFromStatus(_ *status.Status) time.Duration {
          // TODO: parse google.rpc.RetryInfo from status details when AUTH v1 adds it.
          return 0
      }
      // Using a blank identifier in the signature instead of "_ = st" inside the body
      // is idiomatic Go for intentionally unused parameters.
    resolution_status: fixed
    resolution_note: >
      Changed function signature to use a blank identifier (_ *status.Status) and added
      a TODO comment: "TODO: parse google.rpc.RetryInfo from status details when AUTH v1
      adds it." The "_ = st" line inside the body was removed.

  - id: CR-S004
    original_id: TEST-S001
    source_report: 2026-05-18_test-review_REQ-001-TASK-003_lib.yaml
    severity: SUGGESTION
    rule_id: UT-0023
    file: lib/validate_test.go
    line: 59
    description_applies_to:
      - lib/validate_test.go (all mock.MatchedBy for ctx)
      - lib/middleware_http_test.go (all mock.MatchedBy for ctx)
      - lib/interceptor_grpc_test.go (all mock.MatchedBy for ctx)
    title: "Context MatchedBy check is ctx != nil — consider asserting deadline derivation"
    description: |
      All cache mock expectations used:
        mock.MatchedBy(func(ctx context.Context) bool { return ctx != nil })

      mock.MatchedBy is the correct approach when the exact context value cannot be injected.
      However, ctx != nil is the weakest possible check — it accepts any non-nil context
      including context.Background(). A stronger predicate would verify the context has a
      deadline (confirming ValidateTimeout was actually applied). This is a suggestion rather
      than a violation because (a) mock.MatchedBy IS the prescribed fallback per UT-0023, and
      (b) the current check does protect against nil context regressions.
    recommended_fix: |
      Optionally strengthen the context matcher in validate_test.go, middleware_http_test.go,
      and interceptor_grpc_test.go:

        mock.MatchedBy(func(ctx context.Context) bool {
            _, hasDeadline := ctx.Deadline()
            return hasDeadline  // validates ValidateTimeout was applied
        })

      If the context timeout logic is already tested via behavior (e.g., the test for
      grpc_deadline_exceeded), keeping ctx != nil is acceptable to avoid over-specifying
      the internal implementation detail of when context.WithTimeout is called.
    resolution_status: fixed
    resolution_note: >
      Strengthened context matchers in validate_test.go, middleware_http_test.go, and
      interceptor_grpc_test.go to assert _, hasDeadline := ctx.Deadline(); return hasDeadline,
      verifying that ValidateTimeout was applied before the cache call.

