    rule_id: EC-0054
    source_package: lib
    original_id: CR-LIB-S001
    file: lib/errors.go
    line: 86
    title: "codes.Canceled maps to ErrUnavailable — misleading for caller-cancelled contexts"
    description: >
      In mapGRPCError, there is no case for codes.Canceled, so it falls through to default
      and wraps as ErrUnavailable with "unexpected grpc code Canceled". When a caller cancels
