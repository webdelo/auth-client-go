  - id: CR-030
    severity: SUGGESTION
    rule_id: null
    source_package: lib/internal/cache
    original_id: TR-CACHE-S003
    file: lib/internal/cache/memory_test.go
    line: 154
    title: "Goroutine-leak assertion is fragile: compares absolute count to baseline"
    description: >
      In "goroutine_exits_when_ctx_cancelled", `baseline := runtime.NumGoroutine()` is captured
      before creating the cache and asserted `<= baseline` after cancel. This is fragile:
      parallel tests may start goroutines inflating the count above baseline; also the assertion
      passes even if the cleanup goroutine never started. The correct assertion is net delta == 0.
    recommendation: >
      Verify the goroutine starts (assert Eventually count >= baseline+1), then verify it exits
      (assert Eventually count <= baseline). Use require.Eventually/assert.Eventually from
      testify. Using synctest.Run (CR-015) would resolve both concerns via isolation.

