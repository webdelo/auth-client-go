# === CODE REVIEW ISSUES ===
# Original IDs from: 2026-05-18_code-review_REQ-001-TASK-001.yaml
code_review:
  files_reviewed: 8
  issues:
    critical: []

    warnings:
      - id: "CR-W001"
        original_id: "TASK001-W001"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "SDK-only env vars bleed into auth-app container via env_file: test.env"
        file: "dev/deployments/compose.test.yaml"
        line: 62
        standard: "effective_standards.md ES-0021 (minimize scope)"
        description: |
          auth-app's env_file: test.env injected SDK-test-only variables
          (AUTH_REPO_PATH, AUTH_ENDPOINT, RUN_INTEGRATION_TESTS) into the AUTH server
          container. AUTH server silently ignores unknown vars, so no runtime failure,
          but it violates minimal-scope: server config and test harness config should not
          share the same env file. Full split (Option B) deferred to v0.2.0.
        issue_status: "FIXED"
        fix_applied: |
          Added clarifying comment in compose.test.yaml on the env_file line documenting
          that test.env mixes SDK vars (AUTH_REPO_PATH, AUTH_ENDPOINT, RUN_INTEGRATION_TESTS)
          and that the AUTH server silently ignores unrecognised variables.
          Full split into auth-server.env / sdk-test.env deferred to v0.2.0.
        fix_date: "2026-05-18"

      - id: "CR-W002"
        original_id: "TASK001-W002"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "auth-postgres exposes port 5432 to host — conflicts with local Postgres"
        file: "dev/deployments/compose.test.yaml"
        line: 29
        standard: "effective_standards.md ES-0022 (minimize scope)"
        description: |
          auth-postgres bound port 5432 unconditionally to the host interface. On machines
          with a local Postgres (signal-analyzer, funding-bot), this causes "address already
          in use" on `make env-up`. Inter-container traffic uses compose DNS and does not
          need the host binding at all.
        issue_status: "FIXED"
        fix_applied: |
          Removed the `ports: ["5432:5432"]` block from auth-postgres entirely.
          Added an explanatory comment noting that services communicate over the compose
          project network (auth-postgres:5432 hostname) and no host port binding is needed.
        fix_date: "2026-05-18"

    suggestions:
      - id: "CR-S001"
        original_id: "TASK001-S001"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "env-down not guaranteed if env-up fails partially"
        file: "dev/deployments/extra.mk"
        line: 33
        description: |
          If dev-up-test-env fails (e.g. auth-app never reaches healthy), make stops before
          the recipe body — env-down is NOT called. Partially started containers remain.
          Behaviour is documented in PRP Failure-Mode Sanity table and is acceptable for v0.1.0,
          but README did not cover this specific scenario (only Ctrl+C was documented).
        issue_status: "FIXED"
        fix_applied: |
          Added second bullet under "Known limitations" in README documenting that partial
          env-up failure does NOT auto-call env-down; user must run `make env-down` manually.
        fix_date: "2026-05-18"

      - id: "CR-S002"
        original_id: "TASK001-S002"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "auth-migrate double-run: run --rm then up auth-app triggers second migration"
        file: "dev/deployments/extra.mk"
        line: 17
        description: |
          dev-up-test-env runs auth-migrate explicitly via `docker compose run --rm` (step 2),
          then `docker compose up -d --wait auth-app` (step 3). Compose sees the depends_on
          condition, the --rm container is gone, and spins up a new migrate container.
          Migrations run twice; since `migrate up` is idempotent this is not a correctness bug,
          but adds ~2-5s and produces confusing double-migration log output.
        issue_status: "FIXED"
        fix_applied: |
          Added `--no-deps` flag to the `up -d --wait auth-app` step in extra.mk.
          This skips depends_on processing for that call, preventing the second silent migrate run
          while preserving the explicit migrate output from step 2.
        fix_date: "2026-05-18"

      - id: "CR-S003"
        original_id: "TASK001-S003"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "STYLE"
        title: ".temp/ missing from .gitignore"
        file: ".gitignore"
        line: null
        standard: "coding_style.md CS-0004; CLAUDE.md policy (Temp files → .temp/)"
        description: |
          CLAUDE.md mandates `Temp files → .temp/`. The .gitignore did not contain an entry
          for .temp/, so ad-hoc `go build -o .temp/...` binaries would appear as untracked files.
        issue_status: "FIXED"
        fix_applied: "Added `.temp/` entry to .gitignore."
        fix_date: "2026-05-18"

      - id: "CR-S004"
        original_id: "TASK001-S004"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "STYLE"
        title: "CI integration job runs without requiring lint/test/build to pass first"
        file: ".github/workflows/ci.yaml"
        line: 76
        description: |
          The integration job had no `needs:` field. When triggered via workflow_dispatch
          with run_integration=true, it runs concurrently with lint, test, and build jobs.
          For v0.1.0 with manual-only trigger this is acceptable, but the intent was not
          documented in the workflow file.
        issue_status: "FIXED"
        fix_applied: |
          Added a comment above the `if: ${{ inputs.run_integration == true }}` line in
          ci.yaml explaining the intentional absence of `needs:` (manual-only trigger;
          developer is responsible for running lint/test/build before integration; add
          `needs: [lint, test, build]` when integration becomes a mandatory gate).
        fix_date: "2026-05-18"

      - id: "CR-S005"
        original_id: "TASK001-S005"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "STYLE"
        title: "Decorative separator characters in runtime echo output (extra.mk)"
        file: "dev/deployments/extra.mk"
        line: 16
        standard: "coding_style.md CS-0112 (borderline)"
        description: |
          echo statements in extra.mk use box-drawing characters (━━━) as visual separators
          in terminal output. CS-0112 prohibits decorative separators in source code.
          The reviewer assessed this as borderline — CS-0112 targets structural code separators,
          not user-facing terminal formatting. The ━━━ pattern is established convention in
          sibling repos (auth, signal-analyzer, funding-bot).
        issue_status: "ACCEPTED"
        accepted_deviation: true
        deviation_reason: |
          CS-0112 targets decorative separators used as structural dividers within source code.
          The ━━━ characters here appear in runtime echo output (terminal UX), not as code
          structural markers. The pattern is consistent with sibling repos (auth, signal-analyzer,
          funding-bot) — keeping the convention avoids divergence from established platform style.
          Reviewer explicitly flagged as "borderline; flagged for team decision". Team decision:
          runtime echo output is outside CS-0112 scope; pattern accepted.

  summary:
