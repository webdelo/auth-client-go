        original_id: "TASK001-W001"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "SDK-only env vars bleed into auth-app container via env_file: test.env"
        file: "dev/deployments/compose.test.yaml"
        line: 65
        standard: "ES-0021 (minimize scope)"
        description: |
          auth-app's env_file: test.env injected SDK-test-only variables
          (AUTH_REPO_PATH, AUTH_ENDPOINT, RUN_INTEGRATION_TESTS) into the AUTH server
          container. AUTH server silently ignores unknown vars, so no runtime failure,
          but it violated minimal-scope: server config and test harness config should not
          share the same env file.
        issue_status: "FIXED"
        fix_commit: "ed462b4"
        fix_applied: |
          Added clarifying comment immediately above the env_file: block in compose.test.yaml
          (lines 65–68) documenting the dual-purpose nature of test.env and the planned
          v0.2.0 split into auth-server.env + sdk-test.env. Full env-file split deferred to v0.2.0.
        v2_evidence: "dev/deployments/compose.test.yaml lines 65–68 comment verified present by v2 reviewer"
        residual: "Env var bleed still exists functionally (deferred v0.2.0). AUTH server silently ignores unknown vars — accepted."

      - id: "CR-W002"
        original_id: "TASK001-W002"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "auth-postgres exposes port 5432 to host — conflicts with local Postgres"
        file: "dev/deployments/compose.test.yaml"
        line: 29
        standard: "ES-0022 (minimize scope)"
        description: |
          auth-postgres bound port 5432 unconditionally to the host interface. On machines
          with a local Postgres (signal-analyzer, funding-bot), this caused "address already
          in use" on `make env-up`. Inter-container traffic uses compose DNS and does not
          need the host binding at all.
        issue_status: "FIXED"
        fix_commit: "ed462b4"
        fix_applied: |
          Removed the `ports: ["5432:5432"]` block from auth-postgres entirely.
          Added explanatory comment (lines 29–33) noting that inter-container communication
          uses compose DNS (auth-postgres:5432) and no host port binding is needed.
          Comment also documents optional DEBUG_POSTGRES_PORT for ad-hoc external access.
        v2_evidence: |
          No ports: block under auth-postgres in committed state — verified by v2 reviewer
          reading full service definition (lines 21–42). Regression analysis confirmed:
          auth-migrate DSN and auth-app POSTGRES_HOST both use compose hostname — fully safe.
        regression_check: "NO REGRESSION — both auth-migrate and auth-app use compose DNS hostname, not host-mapped port"

    suggestions:
      - id: "CR-S001"
        original_id: "TASK001-S001"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "env-down not guaranteed if env-up fails partially"
        file: "dev/deployments/extra.mk"
        line: 33
        description: |
          If dev-up-test-env fails (e.g. auth-app never reaches healthy), make stops before
          env-down is called. Partially started containers remain. Not covered in README.
        issue_status: "FIXED"
        fix_commit: "ed462b4"
        fix_applied: |
          Added second bullet under "Known limitations" in README.md documenting that partial
          env-up failure does NOT auto-call env-down; user must run `make env-down` manually.
        v2_evidence: "README.md lines 65–72 verified by v2 reviewer — both Ctrl+C and partial-failure bullets present"

      - id: "CR-S002"
        original_id: "TASK001-S002"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "LOGIC"
        title: "auth-migrate double-run: run --rm then up auth-app triggers second migration"
        file: "dev/deployments/extra.mk"
        line: 17
        description: |
          dev-up-test-env ran auth-migrate explicitly via `docker compose run --rm` (step 2),
          then `docker compose up -d --wait auth-app` (step 3). Compose re-evaluated depends_on
          and spun up a second migrate container. Migrations ran twice; idempotent but added
          ~2-5s and produced confusing double-migration log output.
        issue_status: "FIXED"
        fix_commit: "ed462b4"
        fix_applied: |
          Added `--no-deps` flag to the `up -d --wait auth-app` step in extra.mk (line 21).
          Prevents second silent migrate run while preserving the explicit migration output.
        v2_evidence: |
          dev/deployments/extra.mk line 21 verified: `${_COMPOSE} --profile test up -d --wait --no-deps auth-app`
          --no-deps flag confirmed present. Regression analysis: step ordering (postgres healthy →
          migrate → auth-app with --no-deps) is safe — no dependency restart triggered.
        regression_check: "NO REGRESSION — --no-deps suppresses dependency re-start only; auth-postgres stays healthy from step 1"

      - id: "CR-S003"
        original_id: "TASK001-S003"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "STYLE"
        title: ".temp/ missing from .gitignore"
        file: ".gitignore"
        line: 42
        standard: "CS-0004; CLAUDE.md policy (Temp files → .temp/)"
        description: |
          CLAUDE.md mandates `Temp files → .temp/`. The .gitignore did not contain an entry
          for .temp/, so ad-hoc `go build -o .temp/...` binaries would appear as untracked files.
        issue_status: "FIXED"
        fix_commit: "ed462b4"
        fix_applied: "Added `.temp/` entry with CLAUDE.md policy reference comment to .gitignore."
        v2_evidence: ".gitignore lines 42–43 verified: comment + .temp/ entry with CLAUDE.md policy rationale"

      - id: "CR-S004"
        original_id: "TASK001-S004"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "STYLE"
        title: "CI integration job runs without requiring lint/test/build to pass first"
        file: ".github/workflows/ci.yaml"
        line: 76
        description: |
          The integration job had no `needs:` field. When triggered via workflow_dispatch with
          run_integration=true, it runs concurrently with lint, test, and build jobs. Intent
          was not documented in the workflow file.
        issue_status: "FIXED"
        fix_commit: "ed462b4"
        fix_applied: |
          Added explanatory comment above the `if:` condition in ci.yaml (lines 79–81)
          documenting the intentional absence of `needs:` (manual-only trigger; developer
          responsible; future upgrade path via needs: [lint, test, build] noted).
        v2_evidence: ".github/workflows/ci.yaml lines 79–81 comment verified present and accurate by v2 reviewer"

      - id: "CR-S005"
        original_id: "TASK001-S005"
        source_report: "2026-05-18_code-review_REQ-001-TASK-001.yaml"
        category: "STYLE"
        title: "Decorative separator characters in runtime echo output (extra.mk)"
        file: "dev/deployments/extra.mk"
        line: 16
        standard: "CS-0112 (borderline)"
        description: |
          echo statements in extra.mk use box-drawing characters (━━━) as visual separators
          in terminal output. CS-0112 prohibits decorative separators in source code.
          Reviewer assessed as borderline — CS-0112 targets structural code separators, not
          user-facing terminal formatting.
        issue_status: "ACCEPTED"
        accepted_deviation: true
        deviation_reason: |
          CS-0112 targets decorative separators used as structural dividers within source code.
          The ━━━ characters appear in runtime echo output (terminal UX), not as code structural
          markers. Pattern is consistent with sibling repos (auth, signal-analyzer, funding-bot).
          v2 reviewer re-confirmed: lines 16, 25, 34 in extra.mk still contain ━━━ — no action
          required. Team decision: runtime echo output is outside CS-0112 scope.
        v2_evidence: |
          dev/deployments/extra.mk lines 16, 25, 34 confirmed containing ━━━ in @echo strings.
          Accepted deviation re-validated in v2 review with same rationale.

