  - id: CR-010
    original_id: "4"
    source_agent: test-reviewer
    source_report: 2026-05-18_test-review_lib_v3.yaml
    source_package: lib
    severity: SUGGESTION
    category: structure
    rule: "UT-0001, IT-0010"
    file: lib/client_integration_test.go
    line: 24
    title: "Blank import of singleflight in integration test file -- consider tools.go for dep pinning"
    description: |
      TestAuthEndpointReachable is guarded by the build tag "integration" and the TestMain
      RUN_INTEGRATION_TESTS env check, so it only runs intentionally. The test itself is
      correct: not table-driven (acceptable for integration tests per IT-0010), uses t.Fatalf
      for infra failure (correct), and uses conditional default for endpoint (input-setup logic,
      not assertion logic, so UT-0032 is not violated).

      The only stylistic issue: the blank import of golang.org/x/sync/singleflight in
      an integration test file is an unusual dep-pinning technique. It works (go mod tidy
      respects it because the file is part of the module even under a build tag), but it is
      non-obvious. A clearer alternative for dep pinning is a tools.go file at module root.
    suggestion: |
      Consider creating lib/internal/tools/tools.go (or root-level tools.go) for dep pinning:

        //go:build tools

        package tools

        import (
            _ "golang.org/x/sync/singleflight" // pinned for TASK-004 refresh singleflight
        )

      This is idiomatic Go dep pinning (golang.org/x/tools/cmd/... convention) and does not
      pollute the integration test file with an unrelated concern. Not required -- current
      approach works -- but more discoverable.

  - id: CR-011
    original_id: "5"
    source_agent: test-reviewer
    source_report: 2026-05-18_test-review_lib_v3.yaml
    source_package: lib
    severity: SUGGESTION
    category: style
    rule: "PRP Task 8 (recordingLogger note)"
    file: lib/client_test.go
    line: 12
    title: "recordingLogger lacks the infos counter field noted in PRP"
    description: |
      The PRP code pattern for recordingLogger shows:

        type recordingLogger struct {
            infos int
        }
        func (r *recordingLogger) Info(context.Context, string, ...any) { r.infos++ }

      The actual implementation omits the infos counter:

        type recordingLogger struct{}
        func (*recordingLogger) Info(context.Context, string, ...any) {}

      For the current test (only checking logger type assignment via type assertion), the
      counter is not needed. However the PRP included it as a future-use field: if a test
      needs to verify that the logger is actually being called, the counter enables that
      assertion without any change.

      This is a low-priority style note -- the empty struct is functionally correct for
      TASK-002 scope.
    suggestion: |
      Optionally add the counter for forward-compatibility with future tests that verify
      logger invocation counts:

        type recordingLogger struct {
            infos int
        }

        func (r *recordingLogger) Info(_ context.Context, _ string, _ ...any)             { r.infos++ }
        func (r *recordingLogger) Warn(_ context.Context, _ string, _ ...any)             {}
        func (r *recordingLogger) Error(_ context.Context, _ string, _ error, _ ...any)   {}

      No change required if TASK-002 scope does not require logger invocation count checks.

