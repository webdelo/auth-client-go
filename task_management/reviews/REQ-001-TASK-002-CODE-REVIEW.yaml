      func (NoopLogger) Error(context.Context, string, error, ...any) {}

  - id: CR-008
    original_id: "6"
    source_agent: code-reviewer
    source_report: 2026-05-18_code-review_lib.yaml
    source_package: lib
    severity: SUGGESTION
    category: correctness
