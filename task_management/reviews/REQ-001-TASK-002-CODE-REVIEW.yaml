  - id: CR-005
    original_id: "1"
    source_agent: test-reviewer
    source_report: 2026-05-18_test-review_lib_v3.yaml
    source_package: lib
    severity: WARNING
    category: missing_case
    rule: "DOD (REQ-001-TASK-002.md) + PRP Task 8"
    file: lib/client_test.go
    line: 33
    title: "Missing TestNew case: endpoint_invalid_returns_dial_error_or_lazy"
    description: |
      PRP Task 8 (lib/client_test.go) lists 9 required cases for TestNew. All 8 functional
      cases are present, but the 9th -- "endpoint_invalid_returns_dial_error_or_lazy" -- is
      absent. The PRP specifies: endpoint "bad host with spaces". grpc.NewClient sometimes
      validates the target eagerly, sometimes lazily. If it returns err -> assert; if nil -> skip.

      The actual file has 9 cases (including an extra "with_cache_custom" that is not in
      the minimal PRP list), but the specific boundary case for an invalid/malformed endpoint
      string is not covered. grpc.NewClient does validate the target string -- a space in the
      address triggers an error -- and documenting this behavior in a test is explicitly required
      by the PRP.
    suggestion: |
      Add a test case in the TestNew map:

        "endpoint_invalid_format_returns_error": {
            cfg: Config{Endpoint: "bad host with spaces"},
            want: func(t *testing.T, c *Client, err error) {
                // grpc.NewClient rejects targets with spaces at parse time
                if err != nil {
                    require.Error(t, err)
                    assert.Nil(t, c)
                } else {
                    // lazy dial: no error at construction, only at first RPC
                    require.NotNil(t, c)
                    t.Cleanup(func() { _ = c.Close() })
                }
            },
        },

      Note: the want closure's conditional branch is acceptable here because the test
      explicitly documents the two possible grpc.NewClient behaviors (eager vs. lazy validation).

  - id: CR-006
    original_id: "2"
    source_agent: test-reviewer
    source_report: 2026-05-18_test-review_lib_v3.yaml
    source_package: lib
    severity: WARNING
    category: structure
    rule: "UT-0002 (tests_rules_index.yaml)"
    file: lib/logger_test.go
    line: 9
    title: "NoopLogger split into 3 test functions instead of 1 table-driven function per PRP Task 7"
    description: |
      UT-0002 states "one method = one test function". The actual implementation correctly
      follows this rule per method (TestNoopLogger_Info, TestNoopLogger_Warn,
      TestNoopLogger_Error), and UT-0010 confirms the Test<Type>_<Method> naming format is
      correct.

      However, PRP Task 7 explicitly requires a SINGLE function "TestNoopLogger" that tests
      all three methods in one table-driven set with cases like "info_no_panic_with_nil_ctx",
      "warn_no_panic_with_nil_ctx", "error_no_panic_with_nil_err" together. The rationale is
      that the NoopLogger is a single concern (all methods are no-ops), and splitting into 3
      functions adds boilerplate without clarity benefit.

      The 3-function approach technically complies with UT-0002 (each method has one function),
      but the PRP task requirement is to have one unified TestNoopLogger function that exercises
      all three methods in one table. This is a deviation from the PRP spec.

      Current total cases across 3 functions: 9 (3 per method).
      PRP required cases in one function: 6 cases (happy_path per method + nil-ctx per method).
    suggestion: |
      Consolidate into a single function:

        func TestNoopLogger(t *testing.T) {
            t.Parallel()

            tests := map[string]struct {
                run func(l Logger)
            }{
                "happy_path": {
                    run: func(l Logger) { l.Info(context.Background(), "msg", "k", "v") },
                },
                "info_no_panic_with_nil_ctx": {
                    run: func(l Logger) {
                        var nilCtx context.Context
                        l.Info(nilCtx, "msg")
                    },
                },
                "warn_no_panic_with_empty_fields": {
                    run: func(l Logger) { l.Warn(context.Background(), "msg") },
                },
                "warn_no_panic_with_nil_ctx": {
                    run: func(l Logger) {
                        var nilCtx context.Context
                        l.Warn(nilCtx, "msg")
                    },
                },
                "error_no_panic_with_nil_err": {
                    run: func(l Logger) { l.Error(context.Background(), "msg", nil) },
                },
                "error_no_panic_with_nil_ctx_and_nil_err": {
                    run: func(l Logger) {
                        var nilCtx context.Context
                        l.Error(nilCtx, "msg", nil)
                    },
                },
            }

            for name, tc := range tests {
                tc := tc
                t.Run(name, func(t *testing.T) {
                    t.Parallel()
                    tc.run(NoopLogger{})
                })
            }
        }

