    title: "NoopLogger method godocs: 'No-op.' suffix restates the obvious empty body"
    description: |
      The godoc on each NoopLogger method follows the pattern "Info implements
      Logger. No-op." The "No-op." suffix is redundant -- the empty body `{}` already
      communicates this to any reader. CS-0111 discourages restating what the code
      already shows.

      "Info implements Logger." alone is sufficient and useful (documents interface
      satisfaction). The trailing "No-op." adds no information not already visible.
    suggestion: |
