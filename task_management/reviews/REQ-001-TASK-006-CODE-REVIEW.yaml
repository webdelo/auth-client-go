  warnings:
    - id: CR-001
      original_id: HTTPM-W001
      source_package: lib/examples/http_middleware
      severity: WARNING
      category: STYLE
      standard: "coding_style.md CS-0010"
      file: lib/examples/http_middleware/main.go
      line: 32
      title: "Missing blank line after guard-clause if block (CS-0010)"
      description: >
        The guard clause `if endpoint == "" { ... return 0 }` is immediately followed by
        `addr := getenvOr(...)` on the next line with no blank line separating them.
        CS-0010 requires an empty line after every `if` block. The exception applies
        only to `if err != nil` error-check pairs, not to arbitrary guard clauses.
      current_code: |
        if endpoint == "" {
            usage()
            return 0
        }
        addr := getenvOr("HTTP_ADDR", ":8080")
      recommended_fix: |
        if endpoint == "" {
            usage()
            return 0
        }

        addr := getenvOr("HTTP_ADDR", ":8080")

