issues:
  critical: []

  warnings:
    - id: 1
      severity: WARNING
      category: STYLE
      file: lib/examples/basic/main.go
      line: 34
      standard: "coding_style.md CS-0010"
      title: "Missing blank line after if-guard block before defer"
      description: >
        The closing brace of `if err != nil` (authclient.New error guard, line 34) is
        immediately followed by `defer func() {` on line 35 without a blank line.
        CS-0010 requires an empty line after if/for/switch/select blocks.
        The same pattern repeats in http_middleware (line 43) and grpc_interceptor (line 90).
      current_code: |
        client, err := authclient.New(authclient.Config{Endpoint: endpoint})
        if err != nil {
            fmt.Fprintf(os.Stderr, "authclient.New: %v\n", err)
            return 1
        }
        defer func() {   // <- missing blank line after closing brace above
            if cerr := client.Close(); cerr != nil {
                fmt.Fprintf(os.Stderr, "client.Close: %v\n", cerr)
            }
        }()
      fix_recommendation: |
        Add a blank line after the closing brace of the guard block:

        if err != nil {
            fmt.Fprintf(os.Stderr, "authclient.New: %v\n", err)
            return 1
        }

        defer func() {
            if cerr := client.Close(); cerr != nil {
                fmt.Fprintf(os.Stderr, "client.Close: %v\n", cerr)
            }
        }()

        Apply the same fix at:
          - lib/examples/http_middleware/main.go line 43
          - lib/examples/grpc_interceptor/main.go line 90

    - id: 2
      severity: WARNING
      category: STYLE
      file: lib/examples/basic/main.go
      line: 83
      standard: "coding_style.md CS-0002"
      title: "Naked return in readEnv() — identical violation in grpc_interceptor"
      description: >
        readEnv() uses named return parameters (endpoint, email, password string, ok bool)
        and terminates with a bare `return` statement (line 83). CS-0002 forbids naked
        returns. The identical function in lib/examples/grpc_interceptor/main.go:139
        has the same violation.
      current_code: |
        func readEnv() (endpoint, email, password string, ok bool) {
            endpoint = os.Getenv("AUTH_ENDPOINT")
            email    = os.Getenv("AUTH_TEST_EMAIL")
            password = os.Getenv("AUTH_TEST_PASSWORD")
            ok = endpoint != "" && email != "" && password != ""
            return   // <- naked return
        }
      fix_recommendation: |
        Use an explicit return statement with the named values, or restructure to avoid
        named returns entirely:

        // Option A: explicit named-return (keep named params, add values):
        func readEnv() (endpoint, email, password string, ok bool) {
            endpoint = os.Getenv("AUTH_ENDPOINT")
            email    = os.Getenv("AUTH_TEST_EMAIL")
            password = os.Getenv("AUTH_TEST_PASSWORD")
            ok = endpoint != "" && email != "" && password != ""
            return endpoint, email, password, ok
        }

        // Option B: drop named returns (cleaner):
        func readEnv() (string, string, string, bool) {
            endpoint := os.Getenv("AUTH_ENDPOINT")
            email    := os.Getenv("AUTH_TEST_EMAIL")
            password := os.Getenv("AUTH_TEST_PASSWORD")
            return endpoint, email, password, endpoint != "" && email != "" && password != ""
        }

        Apply the same fix at lib/examples/grpc_interceptor/main.go:139.

  suggestions:
    - id: 3
      severity: SUGGESTION
      category: STYLE
      file: lib/examples/basic/main.go
      line: 94
      standard: "coding_style.md CS-0010"
      title: "Missing blank line after if block in safeTrunc"
      description: >
        In the safeTrunc helper the closing brace of `if n > len(s)` (line 94)
        is directly followed by the return statement on line 95 without a blank line.
        CS-0010 applies here too, though safeTrunc is a tiny private helper and the
        impact on readability is minimal.
      current_code: |
        func safeTrunc(s string, n int) string {
            if n > len(s) {
                n = len(s)
            }
            return s[:n] + "…"   // <- missing blank line after if block
        }
      fix_recommendation: |
        func safeTrunc(s string, n int) string {
            if n > len(s) {
                n = len(s)
            }

            return s[:n] + "…"
        }

