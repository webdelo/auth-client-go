  suggestions:
    - id: CR-006
      original_id: BASIC-S001
      source_package: lib/examples/basic
      severity: SUGGESTION
      category: LOGIC
      file: lib/examples/basic/main.go
      line: 93
      title: "safeTrunc appends ellipsis even when string is not truncated"
      description: >
        When the input string is shorter than n (e.g. a token of length 3 with n=8),
        the guard clamps n to len(s) and returns s[:len(s)] + "..." — i.e. the full
        string with an appended ellipsis. The ellipsis is only semantically correct when
        actual truncation occurred. In the current demo the access token will always be a
        full JWT (100+ chars) so this never triggers in practice, but the function
        contract is subtly wrong and would mislead a future reader or reuser.
      current_code: |
        // existing: clamps n but still appends ellipsis unconditionally
      recommended_fix: |
        func safeTrunc(s string, n int) string {
            if len(s) <= n {
                return s
            }

            return s[:n] + "..."
        }

    - id: CR-007
      original_id: BASIC-S002
      source_package: lib/examples/basic
      severity: SUGGESTION
      category: DOCUMENTATION
      file: lib/examples/basic/README.md
      line: 33
      title: "README expected output prints 'Close ok' before Close actually executes"
      description: >
        Line 75 of main.go prints "step 5: Close ok (deferred)" while still inside run(),
        before the deferred client.Close() has fired. The README reproduces this line in
        the expected output without a clarifying note, which could confuse a reader into
        thinking the print is emitted by or after the Close call. The parenthetical
        "(deferred)" in the message itself partially mitigates this, but the README
        expected-output block has no note about the ordering.
      recommended_fix: |
        Add a brief comment in the ## Expected output section, for example:

            step 5: Close ok (deferred)

        *(This line is printed before `client.Close()` runs; the actual Close happens
        after `run()` returns, inside the deferred closure.)*

        Alternatively rename the log message in main.go to be less ambiguous:
            fmt.Println("step 5: defer Close registered -- will run on exit")

    - id: CR-008
      original_id: HTTPM-S001
      source_package: lib/examples/http_middleware
      severity: SUGGESTION
      category: PERFORMANCE
      standard: "effective_standards.md ES-0110"
      file: lib/examples/http_middleware/main.go
      line: 136
      title: "Use strconv.Itoa instead of fmt.Sprintf for Retry-After header value (ES-0110)"
      description: >
        `fmt.Sprintf("%d", int(d.Seconds()))` performs an integer-to-string conversion.
        ES-0110 recommends `strconv.Itoa` or `strconv.FormatInt` over `fmt.Sprintf` for
        numeric conversions — it is faster, allocates less, and expresses intent clearly.
        The `strconv` package is already available as a stdlib import.
      current_code: |
        w.Header().Set("Retry-After", fmt.Sprintf("%d", int(d.Seconds())))
      recommended_fix: |
        w.Header().Set("Retry-After", strconv.Itoa(int(d.Seconds())))
        // Add "strconv" to the import block.

    - id: CR-009
      original_id: GRPC-S001
      source_package: lib/examples/grpc_interceptor
      severity: SUGGESTION
      category: STYLE
      standard: "coding_style.md CS-0003"
      file: lib/examples/grpc_interceptor/main.go
      line: 54
      title: "CS-0003: Inline timeout durations are magic numbers"
      description: >
        The literal values 10*time.Second (loginCtx, line 54) and 5*time.Second (rpcCtx,
        line 101) are magic numbers. CS-0003 permits 0, 1, 2, and 0.5 without a constant,
        but all other numeric literals should be named. In an SDK example this adds clarity
        about the intended purpose of each timeout (login vs. in-process RPC).
      current_code: |
        loginCtx, cancelLogin := context.WithTimeout(context.Background(), 10*time.Second)
        // ...
        rpcCtx, cancelRPC := context.WithTimeout(context.Background(), 5*time.Second)
      recommended_fix: |
        const (
            loginTimeout = 10 * time.Second
            rpcTimeout   = 5 * time.Second
        )

        loginCtx, cancelLogin := context.WithTimeout(context.Background(), loginTimeout)
        // ...
        rpcCtx, cancelRPC := context.WithTimeout(context.Background(), rpcTimeout)

    - id: CR-010
      original_id: GRPC-S002
      source_package: lib/examples/grpc_interceptor
      severity: SUGGESTION
      category: LOGIC
      standard: "effective_concurrency.md EC-0053"
      file: lib/examples/grpc_interceptor/main.go
      line: 128
      title: "Logout reuses rpcCtx shared with 3 preceding RPCs"
      description: >
        client.Logout at line 128 reuses rpcCtx, which was created with a 5-second timeout
        at line 101. By the time Logout is called, the context may have only seconds (or
        less) of budget remaining, depending on how long the three RPCs took. For an
        in-process example this is unlikely to cause a real timeout, but it is a pattern
        mismatch: login is given its own 10-second context while Logout, which is
        semantically a separate I/O operation, piggybacks on the shared RPC context.
      current_code: |
        rpcCtx, cancelRPC := context.WithTimeout(context.Background(), 5*time.Second)
        defer cancelRPC()
        // ... three RPCs ...
        if lerr := client.Logout(rpcCtx, out.RefreshToken); lerr != nil {
      recommended_fix: |
        // Separate timeout for the cleanup logout call
        logoutCtx, cancelLogout := context.WithTimeout(context.Background(), 5*time.Second)
        defer cancelLogout()
        if lerr := client.Logout(logoutCtx, out.RefreshToken); lerr != nil {

    - id: CR-011
      original_id: GRPC-S003
      source_package: lib/examples/grpc_interceptor
      severity: SUGGESTION
      category: DOCUMENTATION
      standard: "coding_style.md CS-0021"
      file: lib/examples/grpc_interceptor/README.md
      line: 11
      title: "README: /Watch full method path is inconsistently abbreviated"
      description: >
        Line 11 reads: "`/grpc.health.v1.Health/Check` and `/Watch` are in the SDK's
        default open-methods registry". The second method is written as `/Watch` instead
        of its full path `/grpc.health.v1.Health/Watch`. The full method string is what
        the SDK registers in defaultOpenMethods (lib/client.go) and what consumers would
        use in WithOpenMethods calls. Abbreviated forms may confuse readers who call
        WithOpenMethods with the short form, which would not match.
      current_code: |
        `/grpc.health.v1.Health/Check` and `/Watch` are in the SDK's default open-methods
        registry (no auth needed).
      recommended_fix: |
        `/grpc.health.v1.Health/Check` and `/grpc.health.v1.Health/Watch` are in the
        SDK's default open-methods registry (no auth needed).

