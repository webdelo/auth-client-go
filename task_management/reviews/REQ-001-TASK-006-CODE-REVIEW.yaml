positive:
  - "All three examples compile cleanly and pass full audit (vet + lint + 214 tests + race)."
  - "No direct imports of lib/internal/* from examples — public API surface is clean."
  - "exitAfterDefer pattern (main calls only os.Exit(run())) is applied correctly in all three files."
  - "Error handling is thorough: client.Close, conn.Close, grpcSrv.Serve, srv.Shutdown, writeJSON encoder, and Logout are all handled explicitly — no silent discards."
  - "slogAdapter in http_middleware correctly satisfies authclient.Logger: Error prepends the err argument before variadic fields, matching the interface signature exactly."
  - "Graceful shutdown in http_middleware uses signal.NotifyContext + buffered serverErr channel + srv.Shutdown with timeout context — textbook EC-0080/EC-0082 pattern."
  - "Goroutine in http_middleware has a clean exit path on both signal and error branches; no goroutine leak."
  - "Goroutine in grpc_interceptor exits cleanly because grpcSrv.GracefulStop() (deferred) unblocks grpcSrv.Serve — no WaitGroup needed."
  - "grpc_interceptor correctly uses Health/List as the protected method, with Check/Watch as the default open methods per SDK contract."
  - "safeTrunc clamps n to len(s) before slicing — no out-of-bounds panic possible."
  - "Idempotent logout in http_middleware logoutHandler correctly swallows ErrInvalidToken to avoid 500 on already-invalidated cookies."
  - "No nolint directives anywhere in the examples."
  - "All top-level identifiers are unexported (lowercase) — only main() is present as expected for a main package."
  - "Package-level doc comment is present in all three main.go files describing what each example demonstrates."
  - "Makefile build-examples outputs to .temp/examples/<name> and clean target removes .temp/examples/ — consistent with stated requirements."
  - "README files are concise, accurate, and include What/Run/Expected-output/Notes sections."
  - "Cookie path-scoping caveat in http_middleware README is technically correct and clearly explained."

