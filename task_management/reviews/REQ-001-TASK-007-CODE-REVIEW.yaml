    - id: CR-008
      original_id: S-002
      source_phase: original_execute_prp
      source_report: "2026-05-19_code-review_REQ-001-TASK-007_lib_docs.yaml"
      status: FIXED
      title: "doc.go Quickstart uses user, _ (blank error) — may invite misuse"
      file: "lib/doc.go:24"
      description: |
        The Quickstart code example in lib/doc.go used:
          user, _ := authclient.UserFromContext(r.Context())

        UserFromContext returns (User, bool) — the blank identifier on the bool is
        intentional for brevity in a quickstart snippet. However, it teaches consumers
        to ignore the ok signal that indicates whether a user is actually present in
        context. Inside a middleware-protected handler the user will always be present,
        so ignoring ok is safe here. But the pattern could be copied verbatim to
        unprotected handlers.
      fix: |
        lib/doc.go Quickstart updated with lead-in comment:
          // Inside the handler — the middleware guarantees the user is present, so the
          // second return is safe to drop:
          //
          //	user, _ := authclient.UserFromContext(r.Context())

        Verified at lib/doc.go:22-25 in fix-validation-1.

    - id: CR-009
      original_id: S-003
      source_phase: original_execute_prp
      source_report: "2026-05-19_code-review_REQ-001-TASK-007_lib_docs.yaml"
      status: FIXED
      title: "README does not mention IsZero / IsAdmin / HasRole User helper methods"
      file: "README.md"
      description: |
        The public API includes three User convenience methods (lib/context.go:35-41):
          func (u User) IsZero() bool
          func (u User) IsAdmin() bool
          func (u User) HasRole(role Role) bool

        These are useful for handler authorization checks (e.g., gating admin endpoints)
        but were not mentioned in README. The omission is not critical — go doc covers them
        — but discoverability was low.
      fix: |
        README Quickstart section now includes the role-check helpers block:

          `User` exposes three small helpers for role checks inside protected handlers:

          ```go
          user, _ := authclient.UserFromContext(r.Context())
          if !user.IsAdmin() {
              http.Error(w, "forbidden", http.StatusForbidden)
              return
          }
          // user.HasRole(authclient.RoleUser) — exact-match role check.
          // user.IsZero() — true only if the middleware was skipped (FailOpen on AUTH-down).
          ```

        Verified at README.md:52-62 in fix-validation-1.

    - id: CR-010
      original_id: LIB-S001
      source_phase: fresh_review_code
      source_report: "2026-05-19_code-review_lib.yaml"
      status: FIXED
      title: "CHANGELOG 'default 30s' phrasing mirrors the LIB-W001 README ambiguity"
      file: "CHANGELOG.md:25"
      description: |
        CHANGELOG.md line 25 stated "positive-result TTL cache (default 30s)". This is
        accurate as a description of the SDK-intended TTL value when caching is used, but
        it mirrors the ambiguity from LIB-W001 (CR-005): it could be read as "30s is the
        default when you omit ValidateCacheTTL", which is wrong (zero = disabled).
      fix: |
        CHANGELOG.md Updated to:
          positive-result TTL cache (SDK-recommended TTL: `30s`; `Config.ValidateCacheTTL` Go
          zero-value is `0` = cache disabled; key = `sha256(token)`).

        CHANGELOG Known Limitations bullet also updated to match README wording. Both
        disambiguation sites corrected. Verified at CHANGELOG.md:25-26 in fix-validation-2.

    - id: CR-011
      original_id: LIB-S002
      source_phase: fresh_review_code
      source_report: "2026-05-19_code-review_lib.yaml"
      status: FIXED
      title: "doc.go Quickstart uses mux.Handle (undeclared variable) vs README http.Handle"
      file: "lib/doc.go:20"
      description: |
        The Quickstart example in doc.go used `mux.Handle(...)` but the code snippet
        only contains a conceptual godoc block. The `mux` variable is undeclared and would
        not compile as a standalone program. The README Quickstart correctly uses
        `http.Handle(...)` (stdlib's DefaultServeMux). The inconsistency between doc.go
        (mux.Handle) and README (http.Handle) creates confusion for consumers using
        `go doc` as their primary reference.
      fix: |
        lib/doc.go Quickstart snippet updated to:
          //	http.Handle("/api/secure", client.HTTPMiddleware(handler))

        Matches README Quickstart exactly. No undeclared `mux` variable in the godoc snippet.
        Verified at lib/doc.go:20 in fix-validation-2. Smoke test (smoke3) confirms
        go build exit 0 with the corrected snippet.

