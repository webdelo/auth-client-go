issues:
  critical:
    - id: C-001
      title: "Cache interface in README has wrong method signatures"
      file: "README.md:175-179"
      status: "FIXED"
      description: >
        Original review found README Cache interface code-block showed signatures
        without ctx parameter and with `any` instead of `User` — would cause compile
        errors for any consumer implementing a Redis-backed adapter.
      fix: >
        README §Adapter Interfaces / Cache now shows actual signatures from
        lib/client.go: Get(ctx, key) (User, bool), Set(ctx, key, User, ttl),
        Delete(ctx, key). Verified by fix-validation reviewer.

  warnings:
    - id: W-001
      title: "WithCache(nil) described as disabling caching — inaccurate"
      file: "README.md:80"
      status: "FIXED"
      description: >
        WithCache(nil) is a no-op (falls through to Config.Cache or default
        MemoryCache). Disabling caching requires Config.ValidateCacheTTL = 0.
      fix: >
        Functional-options table updated: "nil is a no-op (falls through to
        Config.Cache or the built-in MemoryCache). To disable caching set
        Config.ValidateCacheTTL = 0."

    - id: W-002
      title: "CHANGELOG AuthError field name wrong: RetryAfter vs RetryAfterHint"
      file: "CHANGELOG.md:63"
      status: "FIXED"
      description: >
        Actual exported field in lib/errors.go is RetryAfterHint, not RetryAfter.
      fix: "CHANGELOG line 63: `AuthError{Err, RetryAfterHint}` wrapper."

    - id: W-003
      title: "CHANGELOG date is 2026-05-19 but PRP DOD specifies 2026-05-18"
      file: "CHANGELOG.md:10"
      status: "WONT_FIX"
      decision: "option_b_accepted"
      justification: >
        The reviewer's W-003 offered two options. Option (b) — keep 2026-05-19 as
        the accurate release date and accept the PRP DOD literal as a template
        artifact — is the explicit team choice. Today's system date is 2026-05-19;
        the PRP was authored 2026-05-18, before the implementation day. Keep-a-
        Changelog format prescribes the actual release date, which is what is
        recorded. The fix-validation reviewer endorsed this decision.

  suggestions:
    - id: S-001
      title: "ValidateCacheTTL=0 description could clarify cache object still allocated"
      file: "README.md:65"
      status: "FIXED"
      fix: >
        Config table row for ValidateCacheTTL updated: "0 makes every
        ValidateAccessToken call reach AUTH (Set is a no-op for TTL=0)."

    - id: S-002
      title: "doc.go Quickstart uses user, _ (blank error) — may invite misuse"
      file: "lib/doc.go:24"
      status: "FIXED"
      fix: >
        lib/doc.go Quickstart now leads with: "Inside the handler — the middleware
        guarantees the user is present, so the second return is safe to drop:"
        before the user, _ := authclient.UserFromContext(...) line.

    - id: S-003
      title: "README does not mention IsZero / IsAdmin / HasRole User helper methods"
      file: "README.md"
      status: "FIXED"
      fix: >
        README Quickstart now references the role-check helpers with a concrete
        gating example using user.IsAdmin() + http.Error(403), plus comments
        describing user.HasRole and user.IsZero.

