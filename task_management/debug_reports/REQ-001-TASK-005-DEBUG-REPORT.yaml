fixes:
  - id: CR-002
    original_id: TR-LIB-002
    severity: SUGGESTION
    file: lib/cookies_test.go
    status: FIXED
    agent: unit-test-writer
    summary: |
      Added standalone TestSetRefreshCookie_SecurityRegressionGuard with 2 subtests
      (happy_path, with_many_options_still_secure). Both assert Secure==true and
      HttpOnly==true with descriptive failure messages. t.Parallel() at top-level
      and in each subtest.

  - id: CR-003
    original_id: SA-LIB-001
    severity: SUGGESTION
    original_severity: LOW
    file: lib/helpers.go
    status: FIXED
    agent: code-writer
    summary: |
      IPFromRequest now whitespace-trims and validates via net.ParseIP both
      X-Real-IP and X-Forwarded-For first-entry values. Invalid (non-IP) or
      empty-after-trim values fall through to the next source instead of being
      forwarded to AUTH. r.RemoteAddr branch unchanged (stdlib guarantees
      well-formed value). Godoc extended; SECURITY: paragraph preserved and
      clarified to note ParseIP only rejects syntactic invalidity — spoofed
      but syntactically valid IPs still require a trusted proxy.

  - id: CR-004
    original_id: SA-LIB-002
    severity: SUGGESTION
    original_severity: INFO
    file: lib/cookies_test.go
    status: FIXED
    agent: unit-test-writer
    summary: |
      Added "base64url_token_value" case to TestSetRefreshCookie with token
      "AbCdEf123-_.=+/xYz". Asserts c.Value round-trip equality via
      rec.Result().Cookies(), guarding against future stdlib cookie-quoting
      changes for refresh tokens containing base64url special characters.

  - id: CR-005
    original_id: SA-LIB-003
    severity: SUGGESTION
    original_severity: INFO
    file: lib/helpers_test.go
    status: FIXED
    agent: unit-test-writer
    summary: |
      Added 5 new test cases to TestIPFromRequest exercising the new validation
      paths from CR-003:
        - x_real_ip_with_whitespace_trimmed
        - x_real_ip_invalid_falls_through_to_xff
        - x_real_ip_invalid_falls_through_to_remote_addr
        - xff_invalid_falls_through_to_remote_addr
        - x_real_ip_empty_after_trim_falls_through

  - id: CR-006
    original_id: SA-LIB-004
    severity: SUGGESTION
    original_severity: INFO
    file: lib/cookies.go
    status: FIXED
    agent: refactorer
    summary: |
      Extended WithCookieMaxAge godoc with paragraph documenting that
      MaxAge=0 produces a session cookie (per RFC 6265 §5.2.2 and net/http
      Cookie godoc), and explaining how to restore default vs. expire
      immediately. Function body unchanged.

