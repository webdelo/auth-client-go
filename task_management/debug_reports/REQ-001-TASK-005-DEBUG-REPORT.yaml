    severity: SUGGESTION
    reason: |
      Original finding description explicitly states "No action is required" —
      package-level test function naming (TestSetRefreshCookie, etc.) is
      idiomatic Go and matches the PRP code patterns. The UT-0010
      Test<Type>_<Method> convention applies only when the tested symbol is
      a method on a named type; these helpers are package-level functions.
      Finding was flagged "for traceability only".
    user_consent: GRANTED
