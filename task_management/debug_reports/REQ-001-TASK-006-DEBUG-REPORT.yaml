execution_plan:
  approach: >
    Single wave — all 11 issues are localised cosmetic/style/doc edits with
    no cross-file dependencies. Grouped per file to honour the
    "one agent per file" rule.
  waves:
    - wave: 1
      agents:
        - agent: refactorer
          model: haiku
          scope: lib/examples/http_middleware/main.go
          issues: [CR-001, CR-002, CR-003, CR-004, CR-008]
          rationale: >
            Four CS-0010 blank-line insertions + one ES-0110 mechanical
            substitution (fmt.Sprintf -> strconv.Itoa with import add).
        - agent: refactorer
          model: haiku
          scope: lib/examples/grpc_interceptor/main.go
          issues: [CR-005, CR-009, CR-010]
          rationale: >
            CS-0010 blank line, CS-0003 magic-number extraction (three
            named timeout constants), EC-0053 separate Logout context.
        - agent: refactorer
          model: haiku
          scope: lib/examples/basic/main.go
          issues: [CR-006]
          rationale: >
            safeTrunc contract fix — return original string when no
            truncation occurred, append ellipsis only on actual truncation.
        - agent: refactorer
          model: haiku
          scope:
            - lib/examples/basic/README.md
            - lib/examples/grpc_interceptor/README.md
          issues: [CR-007, CR-011]
          rationale: >
            Two pure documentation edits — clarifying note about deferred
            Close ordering + expanding `/Watch` to full gRPC method path.

