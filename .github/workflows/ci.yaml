name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests (requires Docker + access to webdelo/auth repo)'
        type: boolean
        default: false

env:
  GOPRIVATE: github.com/webdelo/*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Run unit tests
        run: go test -v -race ./lib/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Build library
        run: go build ./lib/...

      - name: Build examples
        run: |
          for dir in lib/examples/*/; do
            go build "./${dir}"
          done

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # No `needs:` — manual workflow_dispatch trigger only. Running concurrently
    # with lint/test/build is intentional: integration tests don't share state
    # with unit checks and we want fast feedback on the manual run.
    if: ${{ inputs.run_integration == true }}
    continue-on-error: true
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Checkout webdelo/auth (sibling repo for compose build)
        uses: actions/checkout@v4
        with:
          repository: webdelo/auth
          token: ${{ secrets.GH_PAT }}
          path: auth-server

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Run integration tests
        env:
          AUTH_REPO_PATH: ${{ github.workspace }}/auth-server
        run: make test-integration
