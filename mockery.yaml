---
log-level: error
template: testify
template-data:
  unroll-variadic: true

packages:
  # All consumer-side interfaces in this module: Cache, authServiceClient.
  # Diagnostic logging uses *slog.Logger directly — no SDK-defined Logger
  # interface, no mock required.
  github.com/webdelo/auth-client-go/lib:
    config:
      all: true
      dir: '{{.InterfaceDir}}/mocks'
      pkgname: mocks
      filename: 'mock_{{.InterfaceName}}.go'
