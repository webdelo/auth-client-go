  warnings:
    - id: CR-LIB-W001
      severity: WARNING
      category: LOGIC
      rule_id: CS-0060
      file: lib/client.go
      line: 83
      title: "Config.ValidateCacheTTL godoc claims 'skips creation' but code always creates MemoryCache"
      description: |
        The field comment states: "the cache layer skips creation when TTL is zero."
        In practice, New() always reaches:
          cleanupInterval := cfg.ValidateCacheTTL / 2  // = 0
          c.cache = newCacheAdapter(cachepkg.NewMemoryCache(bgCtx, 0))
        The MemoryCache object IS created (though with no cleanup goroutine). Caching is
        effectively disabled because MemoryCache.Set is a no-op when ttl=0, and every
        Get returns a miss. The behavior is functionally correct, but the documentation
        is inaccurate and will mislead readers of Config or custom Cache implementors.
      current_code: |
        // ValidateCacheTTL is the TTL for ValidateToken results. Defaults to 30s
        // when negative. Zero means "cache disabled" and is preserved as-is by
        // New; the cache layer skips creation when TTL is zero.
        ValidateCacheTTL time.Duration
      recommendation: |
        Replace the inaccurate sentence with the actual mechanism:

        // ValidateCacheTTL is the TTL for ValidateToken results. Defaults to 30s
        // when negative. Zero means "cache disabled": New still allocates an
        // in-memory cache object, but Set is a no-op for TTL=0 so no entries are
        // ever stored. Effectively every ValidateAccessToken call reaches gRPC.
        ValidateCacheTTL time.Duration

    - id: CR-LIB-W002
      severity: WARNING
      category: TESTS
      rule_id: ES-0053
      file: lib/client.go
      line: 314
      title: "cacheAdapter.Get/Set/Delete at 0% coverage — type assertion in Get is untested"
      description: |
        cacheAdapter wraps *cachepkg.MemoryCache to satisfy the Cache interface.
        Its Get() method contains a type assertion:
          user, ok := v.(User)
        Because all validate.go tests inject a mock Cache (lib/mocks/cache.go), the
        cacheAdapter code paths are never exercised in the test suite. The type assertion
        in Get() would silently return (User{}, false) if cacheAdapter.Set were ever
        called with a non-User value — a bug that tests would not catch.
        Production coverage: cacheAdapter.Get=0%, cacheAdapter.Set=0%, cacheAdapter.Delete=0%.
        DOD requires ≥ 80% coverage for lib/ files; overall lib coverage is 92.8% (passes),
        but this specific adapter has zero direct test coverage.
      recommendation: |
        Add a test in client_test.go that creates a real Client (using FakeAuthClient
        from export_test.go) and calls ValidateAccessToken end-to-end with the default
        MemoryCache (no mock). This exercises the full cacheAdapter.Get/Set path:

        func TestCacheAdapter_TypeAssertion(t *testing.T) {
            // create client with real MemoryCache (no WithCache option)
            c := newTestClientWithRealCache(t)
            // call ValidateAccessToken twice — second hit exercises cacheAdapter.Get
            user, err := c.ValidateAccessToken(ctx, validToken)
            // assert user and err
        }

    - id: CR-LIB-W003
      severity: WARNING
      category: STYLE
      rule_id: CS-0060
      file: lib/errors.go
      line: 1
      title: "Package-level doc comment lives in errors.go instead of client.go"
      description: |
        Go convention (and godoc rendering) expects the package comment to be in
        the package's primary entry-point file or in a dedicated doc.go.
        Currently the package comment is on errors.go:
          // Package authclient is the official Go SDK ...
          package authclient
        Meanwhile client.go (which defines Client, New, Config — the main public
        surface) has no package comment. This is confusing for readers who open
        client.go first and find no package-level explanation.
      recommendation: |
        Move the package comment to client.go (prepend it before `package authclient`)
        or create a dedicated doc.go with only the package comment and no other
        declarations. Remove the comment from errors.go (leave only `package authclient`).

        // doc.go
        // Package authclient is the official Go SDK for the webdelo/auth service.
        //
        // The SDK is a thin wrapper over the gRPC contract from
        // github.com/webdelo/auth-proto with non-trivial concerns baked in: a
        // ValidateToken TTL cache, an HTTP middleware, a gRPC unary interceptor,
        // refresh-race serialization, and typed errors. Create a Client with New,
        // dispose with Close.
        package authclient

    - id: CR-LIB-W004
      severity: WARNING
      category: STYLE
      rule_id: ES-0080
      file: lib/errors.go
      line: 42
      title: "AuthError exported fields Err and RetryAfter lack field-level godoc"
      description: |
        The AuthError struct type has a good type-level comment, but its two exported
        fields have no individual documentation:
          type AuthError struct {
              Err        error
              RetryAfter time.Duration
          }
        Per ES-0080, exported struct fields should have godoc comments so that
        `go doc authclient.AuthError` shows the purpose of each field.
        The field name RetryAfter also creates a naming ambiguity: there is a
        package-level function RetryAfter(err error) time.Duration in the same file.
        A consumer doing `errors.As(err, &ae)` and then calling ae.RetryAfter
        (accessing the field) versus authclient.RetryAfter(err) (calling the function)
        may be confused by the identical names.
      recommendation: |
        Add field-level comments and clarify the naming:

        type AuthError struct {
            // Err is the underlying sentinel error (ErrRateLimited, etc.).
            // Use errors.Is(err, authclient.ErrXxx) instead of direct comparison.
            Err error

            // RetryAfterHint is the server-provided hint for when to retry.
            // Use the RetryAfter helper to extract this value from any error chain.
            // Zero when the server did not include a hint.
            RetryAfterHint time.Duration
        }

        Rename RetryAfter field to RetryAfterHint to eliminate the name collision
        with the RetryAfter() function. Update RetryAfter() and retryAfterFromStatus()
        accordingly. This is a breaking change and must be flagged in CHANGELOG.

  suggestions:
    - id: CR-LIB-S001
      severity: SUGGESTION
      category: LOGIC
      rule_id: EC-0054
      file: lib/errors.go
      line: 86
      title: "codes.Canceled maps to ErrUnavailable — misleading for caller-cancelled contexts"
      description: |
        In mapGRPCError, the switch has no case for codes.Canceled:
          default:
              return fmt.Errorf("authclient: unexpected grpc code %s: %w", st.Code(), ErrUnavailable)
        When a caller cancels their own context (e.g. request timeout on the consumer side),
        the gRPC call to AUTH returns codes.Canceled. mapGRPCError wraps this as ErrUnavailable
        with the message "unexpected grpc code Canceled".
        This has two problems:
          1. ErrUnavailable suggests "retry later" but context cancellation means the caller
             already abandoned the request — retrying is pointless.
          2. The error message "unexpected grpc code Canceled" is alarming in logs for a normal
             client-cancellation event.
        In practice, this is harmless because cancelled callers discard the response, but it
        produces misleading log lines when logger is wired up.
      recommendation: |
        Add an explicit case for codes.Canceled that returns the original context error:

        case codes.Canceled:
            // Propagate the caller's cancellation directly rather than masking it
            // as ErrUnavailable. The caller cancelled; there is nothing to retry.
            return fmt.Errorf("authclient: %w", context.Canceled)

        This requires importing "context". Alternatively, return ctx.Err() from
        ValidateAccessToken when err is codes.Canceled, which preserves the original
        cancellation context for the caller.

    - id: CR-LIB-S002
      severity: SUGGESTION
      category: STYLE
      rule_id: CS-0010
      file: lib/client.go
      line: 238
      title: "CS-0010: Missing blank lines after if blocks in several locations"
      description: |
        CS-0010 requires an empty line after the closing brace of if/for/switch/select blocks.
        Multiple violations found (golangci-lint does not enforce this rule; it is a project
        coding style):

        lib/client.go:238-244  — New(): two consecutive if-cache blocks without blank line between them
        lib/client.go:262-276  — applyDefaults(): 5 consecutive guard-clause if blocks, no blank lines
        lib/client.go:316-321  — cacheAdapter.Get(): no blank line after first if !ok return
        lib/validate.go:55-62  — ValidateAccessToken(): no blank line after err check / after IsValid check
        lib/middleware_http.go:25-27 — bearerToken(): no blank line after first if-return block
        lib/interceptor_grpc.go:45-57 — UnaryInterceptor closure: 3 consecutive if-return blocks without blank lines
      recommendation: |
        Add blank lines after each if block. Example fix for validate.go:

          if err != nil {
              return User{}, mapGRPCError(err)
          }
                                              // ← add blank line
          if !resp.IsValid {
              return User{}, mapErrorReason(resp.ErrorReason)
          }
                                              // ← add blank line
          user := User{...}

        For applyDefaults(), the guard-clause pattern with 5 consecutive ifs is common in Go
        and there is legitimate debate about whether blank lines add value there. Apply at the
        team's discretion — but be consistent across all files.

    - id: CR-LIB-S003
      severity: SUGGESTION
      category: LOGIC
      rule_id: ES-0080
      file: lib/client.go
      line: 66
      title: "Cache interface context parameter semantics undocumented for custom implementors"
      description: |
        The Cache interface passes ctx to Get/Set/Delete, but the built-in MemoryCache
        ignores context (sync.Map is inherently non-blocking). A custom Cache implementor
        connecting to Redis or Memcached would need to understand:
          - Should Get return (User{}, false) or block on a cancelled ctx?
          - Should Set be a no-op or return immediately on cancelled ctx?
        The current godoc does not state the expected behavior.
      recommendation: |
        Extend the Cache interface godoc to clarify context contract:

        // Cache is the interface for ValidateToken result caching.
        // ...
        //
        // Context semantics: ctx is provided for telemetry (tracing spans, metrics)
        // and cancellation. On a cancelled ctx, implementations should return the
        // zero value immediately (treat as miss) rather than blocking. Implementations
        // must not use ctx to bound the TTL of stored entries.
        type Cache interface {
            // Get returns the cached User and ok=true on hit.
            // Returns (User{}, false) on miss or when ctx is cancelled.
            Get(ctx context.Context, key string) (user User, ok bool)
            ...
        }

    - id: CR-LIB-S004
      severity: SUGGESTION
      category: STYLE
      rule_id: CS-0021
      file: lib/errors.go
      line: 42
      title: "AuthError.RetryAfter field name is identical to package-level RetryAfter() function"
      description: |
        The struct field AuthError.RetryAfter and the package-level function RetryAfter()
        share the same identifier. A consumer using errors.As to get the *AuthError and then
        accessing ae.RetryAfter (the field) versus calling authclient.RetryAfter(err) (the
        function) may confuse the two in code review and IDE autocomplete. This is a naming
        symmetry concern, not a bug.
        Severity kept at SUGGESTION because the pattern is intentional (the function wraps
        the field for type-safe extraction) and the current API is pre-v1.0.0 so a rename
        is still feasible.
      recommendation: |
        Consider renaming the field to RetryAfterHint to visually distinguish it from the
        helper function. The function RetryAfter(err) remains the canonical API for consumers;
        the field becomes an implementation detail of the *AuthError type.

        type AuthError struct {
            Err            error
            RetryAfterHint time.Duration  // was: RetryAfter
        }

        Update retryAfterFromStatus to return AuthError{Err: ErrRateLimited, RetryAfterHint: d}
        and update RetryAfter() helper accordingly. Flag in CHANGELOG as breaking if published.

