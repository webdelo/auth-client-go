fix_verification:
  - id: "LIB-W001"
    original_severity: "WARNING"
    title: "README Config table claims ValidateCacheTTL default is 30s, but Go zero-value is 0 (cache disabled)"
    status: FIXED
    evidence:
      file: "README.md"
      line: 78
      verified_text: |
        | `ValidateCacheTTL` | `0` (cache disabled) | Positive-result TTL of the in-memory
        `ValidateToken` cache. The Go zero-value is `0` — caching is OFF until you set this
        explicitly. Set to `30 * time.Second` for the SDK-recommended TTL, or to a negative
        value to apply that recommended default automatically. `0` keeps every call reaching
        AUTH (`Set` is a no-op for `TTL=0`). |
      known_limitations_line: 379
      known_limitations_text: |
        **Cache invalidation lag** — after AUTH bumps `token_version`
        (`LogoutAll` / `BlockUser` / `ChangePassword`), an old access token remains valid in
        the SDK cache for up to the configured `ValidateCacheTTL` (the Go zero-value is `0` /
        cache disabled; the SDK-recommended value is `30s`). Setting
        `Config.ValidateCacheTTL = 0` disables the cache entirely (every call reaches AUTH).
    notes: |
      Default column is now `0 (cache disabled)`. Description explains both the zero-value
      semantics (cache OFF) and how to activate the 30s recommended TTL. Known Limitations
      bullet updated to match. Both locations from the original issue are corrected.

  - id: "LIB-W002"
    original_severity: "WARNING"
    title: "README Fail Mode section: UserFromContext returns (User{}, false) — incorrect, actually returns (User{}, true)"
    status: FIXED
    evidence:
      file: "README.md"
      lines: 104-116
      verified_text: |
        - `FailOpen` — pass the request through with an empty `User{}` in context. The middleware
          calls `WithUser(ctx, User{})`, so `UserFromContext` returns `(User{}, true)` — the
          boolean is `true` because the key is present. Use `user.IsZero()` to detect the
          FailOpen pass-through:

          ```go
          user, _ := authclient.UserFromContext(r.Context())
          if user.IsZero() {
              // AUTH was unreachable and FailOpen is configured; treat as unauthenticated.
              http.Error(w, "unauthorized", http.StatusUnauthorized)
              return
          }
          ```
    notes: |
      The incorrect `(User{}, false)` claim has been replaced with the accurate `(User{}, true)`
      explanation. The `user.IsZero()` guard is now the stated idiom. The example block
      `http.Error(w, "unauthorized", ...)` is present as required. The gRPC interceptor FailOpen
      path (also calls `handler(WithUser(ctx, User{}), req)`) is implicitly covered by the same
      explanation, as the middleware and interceptor share the same WithUser semantics.

  - id: "LIB-S001"
    original_severity: "SUGGESTION"
    title: "CHANGELOG 'default 30s' phrasing is consistent with the README issue (LIB-W001)"
    status: FIXED
    evidence:
      file: "CHANGELOG.md"
      lines: 25-26
      verified_text: |
        positive-result TTL cache (SDK-recommended TTL: `30s`; `Config.ValidateCacheTTL` Go
        zero-value is `0` = cache disabled; key = `sha256(token)`).
      known_limitations_lines: 88-91
      known_limitations_text: |
        **Cache invalidation lag** — after AUTH bumps `token_version` (LogoutAll / BlockUser /
        ChangePassword), an old access token remains valid in the SDK cache for up to the
        configured `ValidateCacheTTL` (Go zero-value `0` = cache disabled; SDK-recommended
        value `30s`). Set `ValidateCacheTTL: 0` to disable cache entirely.
    notes: |
      ValidateToken description in ### Added now reads "SDK-recommended TTL: 30s;
      Config.ValidateCacheTTL Go zero-value is 0 = cache disabled". Known limitations bullet
      also updated. Both disambiguation sites in CHANGELOG are corrected and consistent with
      the fixed README wording.

  - id: "LIB-S002"
    original_severity: "SUGGESTION"
    title: "doc.go Quickstart uses mux variable that is not imported or declared"
    status: FIXED
    evidence:
      file: "lib/doc.go"
      line: 20
      verified_text: |
        //	http.Handle("/api/secure", client.HTTPMiddleware(handler))
    notes: |
      The `mux.Handle(...)` call has been replaced with `http.Handle(...)` (stdlib DefaultServeMux),
      matching the README Quickstart exactly. No undeclared `mux` variable in the godoc snippet.

