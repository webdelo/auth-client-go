  warnings:
    - id: 1
      severity: WARNING
      category: style
      rule: CS-0110
      file: lib/client.go
      line: 44
      title: Internal task identifiers (TASK-003, TASK-002) in exported godoc comments
      description: |
        Four exported godoc blocks reference internal task management identifiers
        that mean nothing to SDK consumers and violate CS-0110 ("No internal standard
        references in code comments"):
          - line 44: "FailMode controls how HTTPMiddleware/UnaryInterceptor (TASK-003) react"
          - line 60–61: "default implementation lives in lib/internal/cache (TASK-003); for
            TASK-002 the type is declared here so Config compiles"
          - line 107: "WithCache overrides Config.Cache. Used in TASK-003."
          - line 113: "that bypass the UnaryInterceptor (TASK-003)."

        CS-0110 forbids references to internal tracking artifacts (task IDs, rule IDs).
        Comments should explain WHAT and WHY, not trace back to internal roadmap items.
      suggestion: |
        Replace TASK-003/TASK-002 references with functional descriptions:

        // FailMode controls how the HTTP middleware and gRPC unary interceptor react
        // when the AUTH service is unavailable. See WithFailMode.

        // Cache is the interface for ValidateToken result caching. The default
        // implementation is created by New when Config.Cache is nil; supply a custom
        // implementation via WithCache to override TTL or storage backend.

        // WithCache overrides the ValidateToken result cache. Pass nil to disable caching.

        // "/myapp.v1.UserService/Login") that bypass the authentication interceptor.
        // The health-check endpoints /grpc.health.v1.Health/Check and /Watch are
        // always in the open set.

    - id: 2
      severity: WARNING
      category: godoc
      rule: CS-0060
      file: lib/client.go
      line: 74
      title: Config struct fields lack per-field godoc comments
      description: |
        The Config struct exports 9 fields, none of which have field-level
        documentation comments. The PRP Data Models pseudocode shows the intended
        inline documentation (e.g., "default 30s; 0 disables cache (used by TASK-003)",
        "default FailClosed", "appended after SDK defaults"). Without per-field
        comments, consumers cannot discover defaults or semantics via `go doc
        github.com/webdelo/auth-client-go/lib Config` — the output lists bare field
        names with no descriptions.

        CS-0060 requires godoc on all exported identifiers. In Go, struct field
        comments appear in `go doc` output and are part of the public API surface.
        This is particularly important for ValidateCacheTTL (zero has special meaning
        in TASK-003) and DialOptions (ordering matters for credential override).
      suggestion: |
        Add per-field comments to the Config struct:

        type Config struct {
            // Endpoint is the AUTH service address ("host:port"). Required.
            Endpoint string

            // ValidateCacheTTL is the TTL for ValidateToken results. Defaults to 30s.
            // Set to a negative value to use the default. Reserved: zero will disable
            // caching once the cache implementation is wired (currently ignored).
            ValidateCacheTTL time.Duration

            // FailMode controls middleware behavior when AUTH is unreachable.
            // Defaults to FailClosed (block the request with 503).
            FailMode FailMode

            // ValidateTimeout is the per-call timeout for ValidateToken. Defaults to 2s.
            ValidateTimeout time.Duration

            // LoginTimeout is the per-call timeout for Login. Defaults to 5s.
            LoginTimeout time.Duration

            // RefreshTimeout is the per-call timeout for Refresh. Defaults to 5s.
            RefreshTimeout time.Duration

            // DialOptions are appended to the SDK defaults, allowing the consumer
            // to override transport credentials (TLS), interceptors, etc.
            // The SDK insecure.NewCredentials() comes first; user options come after,
            // so a user-supplied WithTransportCredentials wins.
            DialOptions []grpc.DialOption

            // Logger is the diagnostic logger. Defaults to NoopLogger if nil.
            Logger Logger

            // Cache is the ValidateToken result cache. Defaults to nil (no cache).
            Cache Cache
        }

    - id: 3
      severity: WARNING
      category: correctness
      rule: PRP
      file: lib/client.go
      line: 201
      title: "applyDefaults: ValidateCacheTTL=0 is defaulted to 30s, making cache-disable impossible"
      description: |
        PRP Data Models document the contract:
          "ValidateCacheTTL time.Duration  // default 30s; 0 disables cache (used by TASK-003)"

        The current applyDefaults (lines 201–205):
          if cfg.ValidateCacheTTL < 0 { cfg.ValidateCacheTTL = 0 }
          if cfg.ValidateCacheTTL == 0 { cfg.ValidateCacheTTL = defaultValidateCacheTTL }

        When a consumer sets Config{ValidateCacheTTL: 0}, the zero value is silently
        promoted to 30s, making it impossible to opt out of the cache via the Config
        struct. TASK-003 will rely on ValidateCacheTTL==0 as the "disable cache" signal.
        This will cause a latent bug when TASK-003 wires the cache: the cache can never
        be disabled by Config alone.

        Note: the PRP Code Pattern pseudocode (line 759–763 of the PRP file) mirrors
        the current implementation. This is an internal PRP inconsistency between the
        Gotcha G10 prose and the pseudocode. The implementation follows the pseudocode,
        which is incorrect with respect to the stated contract.
      suggestion: |
        Use a sentinel constant to distinguish "user set zero (disable)" from "user
        omitted (use default)". The simplest fix without adding a new type is to treat
        negative as "use default" and zero as "disable":

        func applyDefaults(cfg Config) Config {
            if cfg.ValidateCacheTTL < 0 {
                // Negative has no sensible meaning; use default.
                cfg.ValidateCacheTTL = defaultValidateCacheTTL
            }
            // ValidateCacheTTL == 0 means "disable cache" — preserved as-is.
            // TASK-003 will skip creating the cache when TTL is 0.
            if cfg.ValidateTimeout <= 0 {
                cfg.ValidateTimeout = defaultValidateTimeout
            }
            // ... rest unchanged
        }

        Update the godoc for ValidateCacheTTL field accordingly (see issue #2).

    - id: 4
      severity: WARNING
      category: style
      rule: CS-0111
      file: lib/logger.go
      line: 19
      title: Redundant phrase "at every logging call site" after "per-call-site" in NoopLogger godoc
      description: |
        Line 19 of logger.go reads:
          "nil so that the SDK avoids per-call-site nil-checks at every logging call site."

        "per-call-site" and "at every logging call site" express the same idea; "call site"
        is repeated. CS-0111 requires comments to be minimal and non-redundant.
      suggestion: |
        // NoopLogger is the silent default Logger. It is used when Config.Logger is
        // nil so that the SDK avoids nil-checks at every call site.

  suggestions:
    - id: 5
      severity: SUGGESTION
      category: style
      rule: CS-0111
      file: lib/logger.go
      line: 22
      title: "NoopLogger method godocs: 'No-op.' suffix restates the obvious empty body"
      description: |
        The godoc on each NoopLogger method follows the pattern "Info implements
        Logger. No-op." The "No-op." suffix is redundant — the empty body `{}` already
        communicates this to any reader. CS-0111 discourages restating what the code
        already shows.

        "Info implements Logger." alone is sufficient and useful (documents interface
        satisfaction). The trailing "No-op." adds no information not already visible.
      suggestion: |
        // Info implements Logger.
        func (NoopLogger) Info(context.Context, string, ...any) {}

        // Warn implements Logger.
        func (NoopLogger) Warn(context.Context, string, ...any) {}

        // Error implements Logger.
        func (NoopLogger) Error(context.Context, string, error, ...any) {}

    - id: 6
      severity: SUGGESTION
      category: correctness
      rule: EC-0051
      file: lib/client.go
      line: 135
      title: "bgCtx context.Context stored in Client struct (EC-0051 acknowledged exception)"
      description: |
        EC-0051 states "Never store context in structs." The Client struct stores
        bgCtx context.Context (line 135) for lifecycle management of future background
        goroutines (cache cleaner, TASK-003).

        This is an ACKNOWLEDGED exception: the PRP explicitly prescribes
        "добавить поле bgCtx context.Context в Client struct" as the solution for
        goroutine lifecycle tracking across Close(). The background context is not a
        request-scoped context but an owner-lifetime context — semantically different
        from what EC-0051 targets.

        Flagged as SUGGESTION for documentation clarity, not as a defect.
      suggestion: |
        Add a comment to the bgCtx field to make the intentional exception visible:

        // bgCtx is the owner-lifetime context for background goroutines (cache
        // cleaner, etc.). It is NOT a request context. Cancelled by Close.
        // Storing it in the struct is intentional — this is a lifecycle context,
        // not a per-request context (EC-0051 exception).
        bgCtx    context.Context
        cancelBG context.CancelFunc

