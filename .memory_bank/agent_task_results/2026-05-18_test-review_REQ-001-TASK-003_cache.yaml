      recommendation: >
        Either rename BenchmarkMemoryCache_Get to BenchmarkValidateCache_Hit,
        or add a separate benchmark function with that name:

        ```go
        // BenchmarkValidateCache_Hit measures a 100% cache-hit path.
        // Must stay < 1µs/op per REQ-001-TASK-003 DOD.
        func BenchmarkValidateCache_Hit(b *testing.B) {
            c := NewMemoryCache(context.Background(), time.Minute)
            c.Set(context.Background(), "k", "user-payload", time.Minute)
            b.ReportAllocs()
            b.ResetTimer()
            for i := 0; i < b.N; i++ {
                _, _ = c.Get(context.Background(), "k")
            }
        }
        ```

        Keeping BenchmarkMemoryCache_Get alongside is fine for discoverability.

    - id: TR-CACHE-S002
      severity: SUGGESTION
      rule_id: UT-0040
      file: lib/internal/cache/memory_test.go
      line: 199
      title: "TestMemoryCache_Concurrent missing subtest table structure"
      description: >
        TestMemoryCache_Concurrent is a single flat test (no table, no subtests)
        and correctly calls t.Parallel(). The test itself is valid — it stresses
        concurrent access to the MemoryCache. However, per UT-0001 and UT-0002,
        all test functions should use the table-driven pattern. Currently there
        is only one scenario (50 goroutines, mixed Set/Get/Delete). Adding edge
        cases such as "all_goroutines_delete" or "single_key_contention" would
        require restructuring into a table, which would also make the intent
        of each concurrent scenario explicit.

        This is a suggestion, not a requirement — a single concurrent stress
        test is better than none, and the concurrent test as written is
        valuable.
      recommendation: >
        If additional concurrent scenarios are needed in the future, wrap into
        a table. For now, consider adding a brief comment explaining what the
        single scenario tests:

        ```go
        // TestMemoryCache_Concurrent verifies that concurrent Get/Set/Delete
        // on shared and distinct keys does not produce data races.
        // Run with: go test -race ./lib/internal/cache/
        func TestMemoryCache_Concurrent(t *testing.T) {
            t.Parallel()
            ...
        }
        ```

    - id: TR-CACHE-S003
      severity: SUGGESTION
      rule_id: null
      file: lib/internal/cache/memory_test.go
      line: 154
      title: "Goroutine-leak assertion is fragile: compares absolute count to baseline"
      description: >
        In "goroutine_exits_when_ctx_cancelled", the test captures
        `baseline := runtime.NumGoroutine()` before creating the cache and then
        asserts `runtime.NumGoroutine() <= baseline` after cancel.

        This is fragile for two reasons:
          1. Between baseline capture and cancel(), other tests running in
             parallel (TestMemoryCache_Get, TestMemoryCache_Concurrent) may
             start goroutines, inflating the count above baseline even after
             the cleanup goroutine exits.
          2. The test passes even if the goroutine count is exactly baseline-1
             (e.g., another goroutine that was alive at baseline has since
             exited), masking the possibility that the cleanup goroutine never
             started.

        The correct assertion for a goroutine-leak check is: count after equals
        count before (i.e., the net delta is zero), not "count ≤ baseline".
        Using synctest (TR-CACHE-W003) would resolve both concerns because it
        provides isolation from other goroutines.
      recommendation: >
        In the absence of synctest, strengthen the assertion by measuring the
        delta rather than the absolute count, or restrict the comparison to
        "did the count drop by exactly 1 from its peak right after start":

        ```go
        baseline := runtime.NumGoroutine()
        ctx, cancel := context.WithCancel(context.Background())
        _ = NewMemoryCache(ctx, 10*time.Millisecond)

        // Wait for the goroutine to start (count should be baseline+1).
        require.Eventually(t, func() bool {
            return runtime.NumGoroutine() >= baseline+1
        }, 100*time.Millisecond, 2*time.Millisecond, "goroutine did not start")

        cancel()

        // Wait for it to exit (count should return to baseline).
        assert.Eventually(t, func() bool {
            return runtime.NumGoroutine() <= baseline
        }, 200*time.Millisecond, 5*time.Millisecond, "goroutine did not exit after cancel")
        ```

        Using require.Eventually / assert.Eventually from testify eliminates the
        hand-rolled polling loop and makes the intent clearer.

