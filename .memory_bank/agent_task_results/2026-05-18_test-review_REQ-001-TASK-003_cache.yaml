issues:

  critical: []

  warnings:

    - id: TR-CACHE-W001
      severity: WARNING
      rule_id: UT-0040
      file: lib/internal/cache/memory_test.go
      line: 128
      title: "TestMemoryCache_Cleanup missing t.Parallel() on the outer function"
      description: >
        TestMemoryCache_Cleanup does not call t.Parallel() at the top, and its
        subtests also run sequentially (no t.Parallel() inside the loop). The
        comment on line 127-128 says "Goroutine-count subtests are NOT parallel
        (they measure global runtime state)." This is a legitimate reason — the
        goroutine-count test in subtest "goroutine_exits_when_ctx_cancelled"
        uses runtime.NumGoroutine() which is global state and would be
        invalidated by parallel execution. However, the outer test function
        itself could still declare t.Parallel() to run concurrently with other
        top-level test functions (TestMemoryCache_Get, TestMemoryCache_Delete,
        TestMemoryCache_Concurrent), without making its subtests parallel. Not
        calling t.Parallel() on the outer function means the entire
        TestMemoryCache_Cleanup blocks other parallelizable tests from running.
        Per UT-0040, the outer test should call t.Parallel() unless it
        genuinely cannot (e.g., modifies os.Setenv). Measuring NumGoroutine in
        subtests is a valid exclusion for those subtests, but not for the outer
        wrapper.
      recommendation: >
        Add t.Parallel() at line 129 (immediately after the function opens).
        Keep the subtests sequential (no t.Parallel() inside the loop) as
        documented, since they rely on global goroutine count. The comment
        explaining why subtests are sequential is good and should stay.

        ```go
        func TestMemoryCache_Cleanup(t *testing.T) {
            t.Parallel()  // add this line

            tests := map[string]struct { ... }{
                ...
            }
            for name, tc := range tests {
                tc := tc
                t.Run(name, func(t *testing.T) {
                    // no t.Parallel() here — correct, global state
                    tc.run(t)
                })
            }
        }
        ```

    - id: TR-CACHE-W002
      severity: WARNING
      rule_id: UT-0051
      file: lib/internal/cache/memory_test.go
      line: 43
      title: "Magic numbers for TTL and sleep durations"
      description: >
        Several magic numeric literals appear in test cases without named
        constants:
          - line 43: `10*time.Millisecond` (TTL for expiring entry)
          - line 44: `20*time.Millisecond` (sleepBefore — must be > TTL)
          - line 174: `const cleanupInterval = 20 * time.Millisecond` — local
            const is good, pattern to follow
          - line 176: `5*time.Millisecond` (TTL of short entry)
          - line 179: `60*time.Millisecond` (wait for cleanup)
          - line 202: `50` (numGoroutines — IS already a named const, good)

        The relationship between TTL (10ms), sleep (20ms) in
        "expired_returns_false" is implicit: sleep must be > TTL but the code
        does not express this contract. If TTL is changed and sleep is not
        updated, the test silently breaks.
      recommendation: >
        Define named constants that express the relationship:

        ```go
        "expired_returns_false": {
            setup: func(c *MemoryCache) {
                const entryTTL = 10 * time.Millisecond
                c.Set(context.Background(), "expiring", "payload", entryTTL)
            },
            sleepBefore: 25 * time.Millisecond, // > entryTTL
            ...
        }
        ```

        For "expired_entry_removed_by_cleanup" in TestMemoryCache_Cleanup, the
        local `const cleanupInterval` is correct; similarly extract the entry
        TTL and wait duration:

        ```go
        const cleanupInterval = 20 * time.Millisecond
        const entryTTL        = 5 * time.Millisecond
        const waitForCleanup  = 3 * cleanupInterval // explicit: needs ≥2 ticks
        ```

    - id: TR-CACHE-W003
      severity: WARNING
      rule_id: UT-0071
      file: lib/internal/cache/memory_test.go
      line: 128
      title: "Time-dependent tests use real time.Sleep instead of synctest"
      description: >
        Go 1.24 introduced testing/synctest (available since the project uses
        go1.26.2). The PRP §Applied Standards and the task notes explicitly
        reference UT-0071 and synctest for the cleanup goroutine tests.

        Three subtests rely on wall-clock sleeping:
          1. "expired_returns_false" (line 73-74): time.Sleep(20ms)
          2. "goroutine_exits_when_ctx_cancelled" (line 139,146): time.Sleep
             inside a polling loop (up to 200ms total)
          3. "expired_entry_removed_by_cleanup" (line 179): time.Sleep(60ms)

        Using real time.Sleep makes these tests:
          - Inherently slow (at least 20+60+30 = ~110ms extra per full run)
          - Potentially flaky under high CPU load (goroutine scheduler delay
            can exceed the poll budget)
          - Not deterministic (timing depends on OS scheduler)

        synctest.Run + synctest.Wait would make time-dependent tests
        deterministic and near-instantaneous by controlling the fake clock.
      recommendation: >
        Refactor time-dependent subtests with synctest. Example for the
        goroutine-lifecycle subtest:

        ```go
        import "testing/synctest"

        "goroutine_exits_when_ctx_cancelled": {
            run: func(t *testing.T) {
                synctest.Run(func() {
                    baseline := runtime.NumGoroutine()
                    ctx, cancel := context.WithCancel(context.Background())
                    _ = NewMemoryCache(ctx, 10*time.Millisecond)
                    synctest.Wait()  // wait for goroutine to start
                    cancel()
                    synctest.Wait()  // wait for goroutine to exit
                    assert.LessOrEqual(t, runtime.NumGoroutine(), baseline)
                })
            },
        },
        ```

        For "expired_returns_false" the lazy-expire path does not involve a
        goroutine, so synctest.Run + advancing the fake clock is sufficient:

        ```go
        synctest.Run(func() {
            c := NewMemoryCache(context.Background(), 0)
            c.Set(context.Background(), "expiring", "payload", 10*time.Millisecond)
            time.Sleep(20 * time.Millisecond) // advances fake clock, no real sleep
            synctest.Wait()
            val, ok := c.Get(context.Background(), "expiring")
            require.False(t, ok)
            assert.Nil(t, val)
        })
        ```

        Note: if synctest.Run is used, the test function must NOT also call
        t.Parallel() in the subtest body (synctest.Run has its own goroutine
        management). The outer TestMemoryCache_Cleanup can still call
        t.Parallel().

