  UT-0100_one_test_file_per_source:
    status: PASS
    note: errors_test.go, logger_test.go, client_test.go mirror their source files exactly.
  ES-0171_no_nolint:
    status: PASS
    note: No //nolint directives found in any test file.
  ES-0060_no_error_discards:
    status: PASS
