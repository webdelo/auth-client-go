  UT-0031_assert_for_additional:
    status: PASS
    note: assert used for field value checks and flags.
  UT-0032_no_conditional_logic:
    status: WARN
    note: >
      TestNew runner body contains `if tc.wantErr != ""` (line 98) and `if tc.check != nil`
      (line 111). Per UT-0032 these should be eliminated by making every case define a single
      `want func(t *testing.T, c *Client, err error)` closure that handles both the error and
