findings:
  critical: []

  warnings:
    - id: T-W001
      rule: UT-0002 + UT-0010
      file: 'lib/logger_test.go:9'
      description: >
        TestNoopLogger covers three distinct receiver methods (Info, Warn, Error) in a single
        test function. UT-0002 requires one method = one test function. UT-0010 requires
        Test<Type>_<Method> naming. The three methods should be split into TestNoopLogger_Info,
        TestNoopLogger_Warn, and TestNoopLogger_Error, each with its own table.
      recommendation: |
        Split into three functions:
          func TestNoopLogger_Info(t *testing.T) { ... }
          func TestNoopLogger_Warn(t *testing.T) { ... }
          func TestNoopLogger_Error(t *testing.T) { ... }
        Each should have a "happy_path" case plus the nil-context variants relevant to
        that specific method.

    - id: T-W002
      rule: UT-0011
      file: 'lib/logger_test.go:15'
      description: >
        TestNoopLogger has no case named exactly "happy_path". The standard requires the
        canonical happy path to be identified with this exact name so reviewers can quickly
        locate the baseline behavior.
      recommendation: |
        Rename "happy_path_info_with_ctx_and_fields" to "happy_path" (or add a "happy_path"
        case if the function is kept as-is). After T-W001 is resolved and the function is
        split, each new function must have its own "happy_path" case.

    - id: T-W003
      rule: UT-0032
      file: 'lib/client_test.go:98,111'
      description: >
        TestNew uses a two-field dispatch pattern (wantErr string + check func) with explicit
        if-branches in the runner body. This is conditional logic in the test body that
        UT-0032 prohibits. Some cases (e.g. "missing_endpoint_returns_error") define only
        wantErr and leave check nil, relying on `if tc.check != nil` in the runner.
      recommendation: |
        Collapse to a single `want func(t *testing.T, c *Client, err error)` closure per case:

          type testCase struct {
              cfg  Config
              opts []Option
              want func(t *testing.T, c *Client, err error)
          }

          "missing_endpoint_returns_error": {
              cfg: Config{},
              want: func(t *testing.T, c *Client, err error) {
                  require.Error(t, err)
                  assert.Contains(t, err.Error(), "Endpoint")
                  assert.Nil(t, c)
              },
          },
          "happy_path": {
              cfg: Config{Endpoint: "localhost:50051"},
              want: func(t *testing.T, c *Client, err error) {
                  require.NoError(t, err)
                  require.NotNil(t, c)
                  t.Cleanup(func() { _ = c.Close() })
                  assert.Equal(t, 30*time.Second, c.cfg.ValidateCacheTTL)
                  assert.Equal(t, FailClosed, c.failMode)
                  _, ok := c.logger.(NoopLogger)
                  assert.True(t, ok)
              },
          },

        This removes the if-branches from the runner body entirely.

    - id: T-W004
      rule: 'UT-0002 (coverage)'
      file: 'lib/client_test.go'
      description: >
        WithCache (client.go:108) has 0% coverage. It is a public Option that will be used
        starting in TASK-003, but it is already shipped and exercisable. The function is
        trivially testable: a test case "with_cache_custom" in TestNew that passes a
        WithCache(mockCache) option and asserts c.cfg.Cache != nil.
      recommendation: |
        Add a test case to TestNew:

          "with_cache_custom": {
              cfg:  Config{Endpoint: "x:1"},
              opts: []Option{WithCache(stubCache{})},
              want: func(t *testing.T, c *Client, err error) {
                  require.NoError(t, err)
                  require.NotNil(t, c)
                  t.Cleanup(func() { _ = c.Close() })
                  assert.NotNil(t, c.cfg.Cache)
              },
          },

        where stubCache is a minimal inline struct implementing the Cache interface
        (or a zero-value struct if the interface methods are empty stubs).

  suggestions: []

summary:
