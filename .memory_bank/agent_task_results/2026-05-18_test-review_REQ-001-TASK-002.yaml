standards_compliance:
  UT-0001_table_driven:
    status: PASS
    note: All test functions use map[string]struct table-driven pattern.
  UT-0002_one_method_one_function:
    status: WARN
    note: >
      TestNoopLogger combines Info, Warn, and Error (three distinct methods) into one
      test function. Per UT-0002 there should be TestNoopLogger_Info, TestNoopLogger_Warn,
      TestNoopLogger_Error.
    file: lib/logger_test.go
    line: 9
  UT-0010_naming_format:
    status: WARN
    note: >
      TestNoopLogger does not follow Test<Type>_<Method> format. All other functions
      (TestMapGRPCError, TestMapErrorReason, TestRetryAfter, TestAuthError_Error,
      TestAuthError_Unwrap, TestStatusFromWrapped, TestNew, TestClient_Close) are correct.
    file: lib/logger_test.go
    line: 9
  UT-0011_happy_path_first:
    status: WARN
    note: >
      TestNoopLogger has no case named exactly "happy_path". The first defined case
      is "happy_path_info_with_ctx_and_fields" which violates the naming requirement.
      All test tables in errors_test.go and client_test.go are compliant.
    file: lib/logger_test.go
    line: 15
