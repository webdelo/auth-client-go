issues:
  critical: []

  warnings:
    - id: "TASK001-W001"
      category: "LOGIC"
      title: "SDK-only env vars bleed into auth-app container via env_file: test.env"
      file: "dev/deployments/compose.test.yaml"
      line: 62
      standard: "effective_standards.md ES-0021 (minimize scope)"
      description: |
        auth-app's env_file: test.env injects SDK-test-only variables
        (AUTH_REPO_PATH=../../../auth, AUTH_ENDPOINT=localhost:50051,
        RUN_INTEGRATION_TESTS=true) into the auth server container environment.
        The AUTH server ignores unknown env vars, so this is not a runtime failure,
        but it violates the principle of minimal scope: server config and test harness
        config should not share the same env file.

        In the CI integration job, make test-integration sets AUTH_REPO_PATH via
        env: block and also via --env-file, creating potential for confusion when
        debugging unexpected auth-app behavior with unexpected env vars set.
      current_code: |
        # compose.test.yaml auth-app service:
        env_file:
          - test.env  # also injects AUTH_REPO_PATH, AUTH_ENDPOINT, RUN_INTEGRATION_TESTS into container
      recommended_fix: |
        Option A (minimal): Add a comment in compose.test.yaml clarifying the dual-purpose
        nature of test.env and that unknown vars are harmless:
          env_file:
            - test.env  # Includes SDK-test vars (AUTH_REPO_PATH, AUTH_ENDPOINT, RUN_INTEGRATION_TESTS);
                        # AUTH server silently ignores unrecognised variables.

        Option B (clean separation, TASK-002 window): Split test.env into:
          - dev/deployments/auth-server.env  (AUTH server config only)
          - dev/deployments/sdk-test.env     (AUTH_ENDPOINT, RUN_INTEGRATION_TESTS, AUTH_REPO_PATH)
        Update compose.test.yaml: env_file: [auth-server.env]
        Update extra.mk _COMPOSE: --env-file dev/deployments/auth-server.env
        Update ci.yaml integration step to source sdk-test.env separately.

        Option A is sufficient for TASK-001; Option B is recommended before TASK-003 adds
        real tests that depend on specific AUTH server configuration.
      reason: "Separation of concerns: server config should be isolated from test harness config"

    - id: "TASK001-W002"
      category: "LOGIC"
      title: "auth-postgres exposes port 5432 to host — conflicts with local Postgres"
      file: "dev/deployments/compose.test.yaml"
      line: 29
      standard: "effective_standards.md ES-0022 (minimize scope)"
      description: |
        auth-postgres binds port 5432 to the host interface. The comment in compose.test.yaml
        says "(opcionalmente, для отладки)" but the port binding is unconditional.
        On machines with a local Postgres instance (signal-analyzer, funding-bot also run PG),
        this will cause "address already in use" on `make env-up`, even though auth-app and
        auth-migrate communicate with auth-postgres purely over the compose project network
        and do not need the host binding at all.
      current_code: |
        auth-postgres:
          ports:
            - "5432:5432"  # unnecessary for inter-container communication
      recommended_fix: |
        Remove the ports binding entirely or make it non-conflicting:
          # Option A: Remove host binding (inter-container traffic uses compose DNS)
          # auth-postgres service: omit `ports:` block entirely
          # auth-migrate and auth-app connect via auth-postgres:5432 (compose hostname)

          # Option B: Use a non-standard host port to avoid conflicts
          ports:
            - "15432:5432"  # 15432 is unlikely to conflict; documents debug intent

        Recommended: Option A for CI correctness; Option B for local debugging convenience.
      reason: |
        Port 5432 is the default Postgres port used by many sibling services on the same
        developer machine. An unconditional host binding will prevent env-up on any machine
        already running a local Postgres (e.g. signal-analyzer's docker-compose).

  suggestions:
    - id: "TASK001-S001"
      category: "LOGIC"
      title: "env-down not guaranteed if env-up fails partially"
      file: "dev/deployments/extra.mk"
      line: 33
      description: |
        test-integration depends on dev-up-test-env as a Makefile prerequisite.
        If dev-up-test-env fails (e.g., auth-app never becomes healthy), make stops
        before executing the recipe body — env-down is NOT called.
        Partially started containers (auth-postgres, potentially auth-migrate) remain
        running and hold the named volume auth-jwt-keys.

        This behaviour is documented in the PRP Failure-Mode Sanity table and is acceptable
        for v0.1.0. The developer must run `make env-down` manually after a failed env-up.
        However, the README does not document this specific failure scenario — only the
        Ctrl+C scenario is documented.
      current_code: |
        test-integration: $(TEST_RUNNER) dev-up-test-env
            @set +e; \
                ...; \
                $(MAKE) --no-print-directory dev-down-test-env; \
                exit $$TEST_EXIT
        # If dev-up-test-env fails, the recipe body above never executes → no env-down
      recommended_fix: |
        Add a note to README "Known limitation" section (alongside the existing Ctrl+C note):

        **Known limitation (v0.1.0):** if `make env-up` fails (e.g., auth-app does not
        reach healthy state within the timeout), partially started containers remain running.
        Run `make env-down` manually to clean up before retrying.

        The code itself is consistent with the established `TEST_EXIT` pattern used by
        sibling repos (auth, signal-analyzer, funding-bot). No code change required.
      reason: "Documentation gap — partial cleanup scenario should be communicated to users of the SDK"

    - id: "TASK001-S002"
      category: "LOGIC"
      title: "auth-migrate double-run: run --rm then up auth-app triggers second migration"
      file: "dev/deployments/extra.mk"
      line: 17
      description: |
        The dev-up-test-env target runs auth-migrate explicitly via `docker compose run --rm`
        (step 2), then starts auth-app via `docker compose up -d --wait auth-app` (step 3).

        When compose processes `up auth-app`, it sees auth-migrate's depends_on condition
        (service_completed_successfully) but the container was already removed (--rm).
        Compose will spin up a new auth-migrate container to satisfy the dependency.
        This means migrations run twice: once visibly via `run --rm` and once silently
        in the background during `up auth-app`.

        Since `migrate up` is idempotent (already-applied migrations are skipped), this
        is not a correctness bug. However, it adds ~2-5s to env-up time and can produce
        confusing double-migration log output.
      current_code: |
        dev-up-test-env:
            ${_COMPOSE} --profile test up -d --wait auth-postgres     # step 1
            ${_COMPOSE} --profile test run --rm auth-migrate           # step 2 (explicit)
            ${_COMPOSE} --profile test up -d --wait auth-app           # step 3 (re-runs migrate silently)
      recommended_fix: |
        Two options:

        Option A: Use `up --no-deps` in step 3 to skip depends_on processing:
          ${_COMPOSE} --profile test up -d --wait --no-deps auth-app

        Option B: Replace explicit `run --rm auth-migrate` with a single `up` call
        that starts auth-postgres, auth-migrate, and auth-app in dependency order:
          ${_COMPOSE} --profile test up -d --wait auth-postgres
          ${_COMPOSE} --profile test up -d --wait auth-app
          # (auth-app depends_on auth-migrate:completed, compose handles ordering)
          # Explicit migrate step removed; compose orchestrates it internally

        Option A is minimal and preserves the explicit migrate output (useful for debugging).
        Option B simplifies the target but hides migration output until auth-app starts.

        Both options are safe. No change required for v0.1.0 (idempotency saves us).
      reason: "Implicit double migration run adds noise and latency to env-up; may confuse future developers"

    - id: "TASK001-S003"
      category: "STYLE"
      title: ".temp/ missing from .gitignore"
      file: ".gitignore"
      line: null
      standard: "coding_style.md CS-0004; CLAUDE.md policy (Temp files → .temp/)"
      description: |
        CLAUDE.md mandates: "Temp files → .temp/". The Makefile itself uses
        `.temp/` as the output directory when running ad-hoc go builds outside
        of make targets. PRP Task 9 required verifying that .temp/ is gitignored.

        The current .gitignore does not have an entry for .temp/.
        If a developer runs `go build -o .temp/auth-client-go` as documented in
        CLAUDE.md, the generated binary will show up as an untracked file.
      current_code: |
        # Current .gitignore (no .temp/ entry)
        bin/
        coverage/
        # ... no .temp/
      recommended_fix: |
        Add to .gitignore in the "Dev tools" or "Build artefacts" section:
          # Temp builds (per CLAUDE.md: use -o .temp/ for ad-hoc builds)
          .temp/
      reason: "Policy compliance: CLAUDE.md requires .temp/ for ad-hoc builds, .gitignore should prevent accidental commits"

    - id: "TASK001-S004"
      category: "STYLE"
      title: "CI integration job runs without requiring lint/test/build to pass first"
      file: ".github/workflows/ci.yaml"
      line: 76
      description: |
        The integration job has no `needs:` field. When triggered via workflow_dispatch
        with run_integration=true, it runs concurrently with lint, test, and build jobs.
        This means integration tests may run against code that hasn't passed basic quality
        gates. While the code must compile for go test to succeed, a lint failure in
        a separate job won't block integration.

        For v0.1.0 with manual-only trigger this is acceptable — the developer decides
        when to run integration. However, as the SDK grows and integration tests become
        more meaningful gates, this ordering becomes important.
      current_code: |
        integration:
          name: Integration Tests
          runs-on: ubuntu-latest
          if: ${{ inputs.run_integration == true }}
          continue-on-error: true
          # No `needs:` — runs concurrently with lint/test/build
      recommended_fix: |
        Add needs for the core quality gates (acceptable for v0.2.0 or when integration
        becomes mandatory):
          integration:
            needs: [lint, test, build]
            if: ${{ inputs.run_integration == true }}
            continue-on-error: true

        For v0.1.0, add a code comment explaining the intentional omission:
          # integration job intentionally has no `needs:` — manual-only trigger,
          # developer is responsible for running lint/test/build before integration.
          # Add `needs: [lint, test, build]` when integration becomes mandatory gate.
      reason: "Documentation of intentional ordering gap prevents future developers from accidentally removing a `needs:` that should be there"

    - id: "TASK001-S005"
      category: "STYLE"
      title: "Decorative separator characters in runtime echo output (extra.mk)"
      file: "dev/deployments/extra.mk"
      line: 16
      standard: "coding_style.md CS-0112"
      description: |
        The echo statements in extra.mk use box-drawing characters (━━━) as visual
        separators in terminal output. CS-0112 prohibits decorative comment separators
        in source code.

        Assessment: CS-0112 explicitly targets "decorative разделители между блоками кода"
        (code separators). The ━━━ usage here is in runtime echo output (terminal UX),
        not as code structural separators. The rule's intent is to prevent visual noise
        in source code that hides structural issues — not to prohibit user-facing terminal
        formatting. The Makefile help target also uses box-drawing chars (pre-existing,
        not in scope of this PR).

        Per CLAUDE.md policy: "SUGGESTIONS are MANDATORY (will be applied)". However,
        this specific pattern is a borderline CS-0112 application. The PRP does not
        explicitly address it. Flagging as suggestion for team awareness, not as a
        mandatory fix if team consensus is that runtime echo output is out of CS-0112 scope.
      current_code: |
        @echo "━━━ Starting AUTH test environment ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        @echo "━━━ Stopping AUTH test environment ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        @echo "━━━ Integration Tests ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      recommended_fix: |
        If CS-0112 is interpreted as covering runtime echo output:
          @echo "Starting AUTH test environment..."
          @echo "Stopping AUTH test environment..."
          @echo "Running integration tests..."

        If CS-0112 applies only to source code structure (recommended interpretation):
          No change required. The ━━━ in echo strings is user-facing terminal formatting,
          not a code organization mechanism.
      reason: "CS-0112 borderline case; flagged for team decision on scope of rule"

