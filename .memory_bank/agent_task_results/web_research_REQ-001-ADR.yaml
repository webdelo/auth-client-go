recommendations:
  - id: "REC-001"
    priority: "high"
    title: "grpc.NewClient с keepalive(30s/10s) и retry policy только для UNAVAILABLE"
    description: |
      Использовать grpc.NewClient (не Dial), настроить keepalive с Time=30s, Timeout=10s,
      PermitWithoutStream=true. Retry policy через WithDefaultServiceConfig только для
      UNAVAILABLE статуса. UNAUTHENTICATED и INVALID_ARGUMENT не ретраить.
    rationale: "Официальная рекомендация grpc-go; retry на auth-ошибки создаёт нагрузку без смысла."

  - id: "REC-002"
    priority: "high"
    title: "Гибридный TTL cache: sync.Map + lazy expire при Get + background cleanup"
    description: |
      Реализовать cache в lib/internal/cache/ с generic типом.
      Get: проверка expireAt, lazy delete. Background goroutine: Range + Delete каждые TTL/2.
      Goroutine lifecycle управляется через context, переданный в NewCache(ctx, ttl).
    rationale: "Предотвращает возврат expired токенов и memory leak без лишних зависимостей."

  - id: "REC-003"
    priority: "high"
    title: "singleflight для Refresh с Forget после успеха и DoChan для context-aware wait"
    description: |
      Ключ singleflight = userID (не refresh token — он меняется после refresh).
      DoChan + select по ctx.Done() для non-blocking ожидания. Forget(userID) после
      успешного refresh чтобы следующий вызов не ждал устаревшего результата.
    rationale: "Предотвращает refresh storm; Forget нужен иначе следующий refresh ждёт бесконечно."

  - id: "REC-004"
    priority: "high"
    title: "Fail-closed по умолчанию; FailOpen только через явную opt-in опцию"
    description: |
      Default поведение при ErrUnavailable: middleware возвращает 503.
      WithFailOpen() опция — явный opt-in с предупреждением в godoc.
      Задокументировать security implications прямо в комментарии к WithFailOpen.
    rationale: "OWASP A10:2025 — fail-open намеренно эксплуатируется атакующими."

  - id: "REC-005"
    priority: "medium"
    title: "WithPublicMethods registry для gRPC interceptor вместо string prefix matching"
    description: |
      Принимать []string FullMethod при создании interceptor.
      map[string]struct{} lookup: O(1) и явная конфигурация.
      Включить в дефолт: /grpc.health.v1.Health/Check.
    rationale: "Prefix matching хрупок при изменении proto package; registry — явный контракт."

  - id: "REC-006"
    priority: "medium"
    title: "Fingerprint helpers: IPFromRequest из X-Real-IP/X-Forwarded-For, UserAgentFromRequest"
    description: |
      В lib/helpers.go: IPFromRequest(*http.Request) string — проверять X-Real-IP,
      затем X-Forwarded-For (первый IP), затем RemoteAddr.
      Документировать требование к proxy конфигурации nginx.
    rationale: "Передача BFF IP в AUTH делает fingerprint бесполезным (OWASP рекомендует client IP)."

  - id: "REC-007"
    priority: "medium"
    title: "Sentinel errors через errors.New + wrapping type с Unwrap для контекста"
    description: |
      Публичные var ErrXxx = errors.New("auth: xxx").
      Внутренний AuthError{Err: ErrXxx} с Unwrap() для передачи message/code.
      Caller использует errors.Is(err, auth.ErrExpired).
    rationale: "Стандарт Go; совместимость с errors.Is/As; расширяемо без breaking change."

  - id: "REC-008"
    priority: "low"
    title: "Версионировать как v0.x.y до стабилизации API, затем v1.0.0"
    description: |
      В v0.x.y: breaking changes допустимы, фиксировать в CHANGELOG.md (keepachangelog.com).
      При v1.0.0: заморозить все публичные интерфейсы.
      При breaking change после v1.0.0: /v2 suffix в module path.
    rationale: "Go module semver semantics; без дисциплины consumers получат сюрпризы."

