issues:
  - id: 1
    severity: WARNING
    category: missing_case
    rule: DOD (REQ-001-TASK-002.md) + PRP Task 8
    file: lib/client_test.go
    line: 33
    title: "Missing TestNew case: endpoint_invalid_returns_dial_error_or_lazy"
    description: |
      PRP Task 8 (lib/client_test.go) lists 9 required cases for TestNew. All 8 functional
      cases are present, but the 9th — "endpoint_invalid_returns_dial_error_or_lazy" — is
      absent. The PRP specifies: "endpoint `\"bad host with spaces\"`. NB: grpc.NewClient
      иногда валидирует target, иногда лениво. Если возвращает err → ассерт; если nil →
      пропустить."

      The actual file has 9 cases (including an extra "with_cache_custom" that is not in
      the minimal PRP list), but the specific boundary case for an invalid/malformed endpoint
      string is not covered. grpc.NewClient does validate the target string — a space in the
      address triggers an error — and documenting this behavior in a test is explicitly required
      by the PRP.
    suggestion: |
      Add a test case in the TestNew map:

        "endpoint_invalid_format_returns_error": {
            cfg: Config{Endpoint: "bad host with spaces"},
            want: func(t *testing.T, c *Client, err error) {
                // grpc.NewClient rejects targets with spaces at parse time
                if err != nil {
                    require.Error(t, err)
                    assert.Nil(t, c)
                } else {
                    // lazy dial: no error at construction, only at first RPC
                    require.NotNil(t, c)
                    t.Cleanup(func() { _ = c.Close() })
                }
            },
        },

      Note: the want closure's conditional branch is acceptable here because the test
      explicitly documents the two possible grpc.NewClient behaviors (eager vs. lazy validation).

  - id: 2
    severity: WARNING
    category: structure
    rule: "UT-0002 (tests_rules_index.yaml)"
    file: lib/logger_test.go
    line: 9
    title: "NoopLogger split into 3 test functions instead of 1 table-driven function"
    description: |
      UT-0002 states "one method = one test function". The actual implementation correctly
      follows this rule per method (TestNoopLogger_Info, TestNoopLogger_Warn,
      TestNoopLogger_Error), and UT-0010 confirms the Test<Type>_<Method> naming format is
      correct.

      However, PRP Task 7 explicitly requires a SINGLE function "TestNoopLogger" that tests
      all three methods in one table-driven set with cases like "info_no_panic_with_nil_ctx",
      "warn_no_panic_with_nil_ctx", "error_no_panic_with_nil_err" together. The rationale is
      that the NoopLogger is a single concern (all methods are no-ops), and splitting into 3
      functions adds boilerplate without clarity benefit.

      The 3-function approach technically complies with UT-0002 (each method has one function),
      but the PRP task requirement is to have one unified TestNoopLogger function that exercises
      all three methods in one table. This is a deviation from the PRP spec.

      Current total cases across 3 functions: 9 (3 per method).
      PRP required cases in one function: 6 cases (happy_path per method + nil-ctx per method,
      deduplicated across methods).
    suggestion: |
      Consolidate into a single function:

        func TestNoopLogger(t *testing.T) {
            t.Parallel()

            tests := map[string]struct {
                run func(l Logger)
            }{
                "happy_path": {
                    run: func(l Logger) { l.Info(context.Background(), "msg", "k", "v") },
                },
                "info_no_panic_with_nil_ctx": {
                    run: func(l Logger) {
                        var nilCtx context.Context
                        l.Info(nilCtx, "msg")
                    },
                },
                "warn_no_panic_with_empty_fields": {
                    run: func(l Logger) { l.Warn(context.Background(), "msg") },
                },
                "warn_no_panic_with_nil_ctx": {
                    run: func(l Logger) {
                        var nilCtx context.Context
                        l.Warn(nilCtx, "msg")
                    },
                },
                "error_no_panic_with_nil_err": {
                    run: func(l Logger) { l.Error(context.Background(), "msg", nil) },
                },
                "error_no_panic_with_nil_ctx_and_nil_err": {
                    run: func(l Logger) {
                        var nilCtx context.Context
                        l.Error(nilCtx, "msg", nil)
                    },
                },
            }

            for name, tc := range tests {
                tc := tc
                t.Run(name, func(t *testing.T) {
                    t.Parallel()
                    tc.run(NoopLogger{})
                })
            }
        }

  - id: 3
    severity: SUGGESTION
    category: missing_case
    rule: "PRP Task 8 (TestNew)"
    file: lib/client_test.go
    line: 134
    title: "defaults_applied_for_timeouts does not verify ValidateCacheTTL default"
    description: |
      The "defaults_applied_for_timeouts" test case checks ValidateTimeout (2s), LoginTimeout
      (5s), and RefreshTimeout (5s) but omits the default ValidateCacheTTL (30s). The TTL
      default IS verified separately in the "happy_path" case, so coverage is present, but the
      "defaults_applied" case is named to cover all defaults and should be complete.

      This is a readability and maintainability concern: a future developer adding a new default
      would look at "defaults_applied_for_timeouts" and might not check "happy_path" for the TTL.
    suggestion: |
      Add the TTL assertion to the existing case:

        "defaults_applied_for_timeouts": {
            cfg: Config{Endpoint: "x:1"},
            want: func(t *testing.T, c *Client, err error) {
                require.NoError(t, err)
                require.NotNil(t, c)
                t.Cleanup(func() {
                    if cerr := c.Close(); cerr != nil {
                        t.Logf("close error: %v", cerr)
                    }
                })
                assert.Equal(t, 30*time.Second, c.cfg.ValidateCacheTTL)  // add this line
                assert.Equal(t, 2*time.Second, c.cfg.ValidateTimeout)
                assert.Equal(t, 5*time.Second, c.cfg.LoginTimeout)
                assert.Equal(t, 5*time.Second, c.cfg.RefreshTimeout)
            },
        },

  - id: 4
    severity: SUGGESTION
    category: structure
    rule: "UT-0001, IT-0010 (context)"
    file: lib/client_integration_test.go
    line: 24
    title: "TestAuthEndpointReachable uses t.Fatalf inside if-blocks — consider t.Skip for missing env"
    description: |
      TestAuthEndpointReachable is guarded by the build tag "integration" and the TestMain
      RUN_INTEGRATION_TESTS env check, so it only runs intentionally. However the test:
      1. Is not table-driven (acceptable for integration tests per IT-0010).
      2. Uses if-blocks with t.Fatalf for both the dial error and conn.Close error — this is
         correct for integration tests (t.Fatalf is the right call to stop on infra failure).
      3. Uses a conditional default for endpoint: `if endpoint == "" { endpoint = "..." }` —
         this is input-setup logic, not assertion logic, so it does not violate UT-0032.

      The only stylistic suggestion: the blank import of golang.org/x/sync/singleflight in
      an integration test file is an unusual dep-pinning technique. It works (go mod tidy
      respects it because the file is part of the module even under a build tag), but it's
      non-obvious. A clearer alternative for dep pinning is a tools.go file at module root.
    suggestion: |
      Consider creating lib/internal/tools/tools.go (or root-level tools.go) for dep pinning:

        //go:build tools

        package tools

        import (
            _ "golang.org/x/sync/singleflight" // pinned for TASK-004 refresh singleflight
        )

      This is idiomatic Go dep pinning (golang.org/x/tools/cmd/... convention) and does not
      pollute the integration test file with an unrelated concern. Not required — current
      approach works — but more discoverable.

  - id: 5
    severity: SUGGESTION
    category: style
    rule: "PRP Task 8 (recordingLogger note)"
    file: lib/client_test.go
    line: 12
    title: "recordingLogger lacks the infos counter field noted in PRP"
    description: |
      The PRP code pattern for recordingLogger shows:

        type recordingLogger struct {
            infos int
        }
        func (r *recordingLogger) Info(context.Context, string, ...any) { r.infos++ }

      The actual implementation omits the infos counter:

        type recordingLogger struct{}
        func (*recordingLogger) Info(context.Context, string, ...any) {}

      For the current test (only checking logger type assignment via type assertion), the
      counter is not needed. However the PRP included it as a future-use field: if a test
      needs to verify that the logger is actually being called (e.g., "WithLogger sets logger
      that receives SDK debug calls"), the counter enables that assertion without any change.

      This is a low-priority style note — the empty struct is functionally correct for
      TASK-002 scope.
    suggestion: |
      Optionally add the counter for forward-compatibility with future tests that verify
      logger invocation counts:

        type recordingLogger struct {
            infos int
        }

        func (r *recordingLogger) Info(_ context.Context, _ string, _ ...any)         { r.infos++ }
        func (r *recordingLogger) Warn(_ context.Context, _ string, _ ...any)         {}
        func (r *recordingLogger) Error(_ context.Context, _ string, _ error, _ ...any) {}

      No change required if TASK-002 scope does not require logger invocation count checks.

