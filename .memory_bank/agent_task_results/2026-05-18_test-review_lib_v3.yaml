    notes: |
      Each method has exactly one test function. The 3 NoopLogger functions (TestNoopLogger_Info,
      _Warn, _Error) each cover one method — technically compliant. The PRP deviation (issue #2)
      is a WARNING about PRP spec divergence, not a UT-0002 violation.

  UT_0010_naming_format:
    status: pass
    notes: |
      TestNew, TestClient_Close, TestMapGRPCError, TestMapErrorReason, TestRetryAfter,
      TestAuthError_Error, TestAuthError_Unwrap, TestStatusFromWrapped, TestNoopLogger_Info,
      TestNoopLogger_Warn, TestNoopLogger_Error — all follow Test<Type>_<Method> or TestFunc
      for free functions. Fully compliant.

  UT_0011_happy_path_first:
    status: pass
    notes: |
      All table-driven test maps declare "happy_path" as a key. Map iteration order is random,
      but per convention the key must exist and be the conceptual first case. All 8 test functions
      have "happy_path" present.

  UT_0012_snake_case:
    status: pass
    notes: "All test case names use snake_case. No violations."

  UT_0020_mocks_via_mockery:
    status: pass
    notes: |
      No mocks needed per PRP (all functions are pure or use lazy gRPC dial).
      recordingLogger and stubCache are local stub TYPES (not mock structs). They implement
      interfaces but do not use testify/mock.Mock embedding — they are not mocks, they are
      test doubles. PRP explicitly confirms this is allowed.

  UT_0027_no_decorative_separators:
    status: pass
    notes: "No decorative section separators (─, ═, etc.) found in any test file."

  UT_0028_no_helper_functions:
    status: pass
    notes: |
      No helper functions for test data construction exist in test files.
      recordingLogger and stubCache are type DECLARATIONS (not helper functions).
      Per PRP and UT-0028 exception note: stub struct types are allowed.

  UT_0029_no_package_level_variables:
    status: pass
    notes: "No package-level var declarations for test data in any test file."

  UT_0030_require_for_critical:
    status: pass
    notes: |
      require.Error / require.NoError / require.NotNil used for critical assertions
      that would make subsequent assertions meaningless. assert used for non-blocking checks.
      Pattern is consistent across all test functions.

  UT_0031_assert_for_additional:
    status: pass
    notes: "assert.Equal, assert.True, assert.Contains used for non-blocking additional checks."

  UT_0032_no_logic_in_tests:
    status: pass
    notes: |
      No if/switch logic in test loop bodies. The if-blocks inside want closures and run
      closures are inside the closure body (the test body IS the closure), not in the
      table iteration loop. TestNew loop calls tc.want(t, c, err) with no branching.
      TestClient_Close loop calls tc.run(t) with no branching.
      The if-block in close_cancels_background_context is inside the run closure — acceptable.

  UT_0040_parallel:
    status: pass
    notes: |
      t.Parallel() at top of ALL main test functions and inside ALL t.Run subtests.
      Verified: TestNew, TestClient_Close, TestMapGRPCError, TestMapErrorReason,
      TestRetryAfter, TestAuthError_Error, TestAuthError_Unwrap, TestStatusFromWrapped,
      TestNoopLogger_Info, TestNoopLogger_Warn, TestNoopLogger_Error — all have
      t.Parallel() at both levels.

  UT_0041_variable_capture:
    status: pass
    notes: |
      tc := tc present in ALL for-range loops before t.Run calls. No goroutine-captured
      loop variable issues. Compliant even beyond Go 1.22 requirement (project rule mandates
      explicit capture regardless).

  UT_0080_map_for_simple_scenarios:
    status: pass
    notes: "All table-driven tests use map[string]struct{} — correct for unordered simple scenarios."

  UT_0100_one_test_file_per_source:
    status: pass
    notes: |
      client_test.go → client.go (white-box, package authclient).
      errors_test.go → errors.go (white-box, package authclient).
      logger_test.go → logger.go (white-box, package authclient).
      client_integration_test.go → integration concern (black-box, package authclient_test,
        build tag: integration). Separate because it's a different test category (IT-* rules).
      All 1:1 mappings correct.

  ES_0171_no_nolint:
