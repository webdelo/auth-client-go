positive:
  - "errors.go is exemplary: nil-safe receiver methods on AuthError, statusFromWrapped correctly walks the unwrap chain, mapErrorReason has a conservative safe default."
  - "Retry policy is scoped ONLY to ValidateToken and ONLY for UNAVAILABLE — the security rationale (refresh family detection) is clearly documented inline."
  - "sync.Once for idempotent Close() is the correct pattern; cancelBG is owned exactly by Close() with no risk of double-cancel."
  - "applyDefaults uses return-copy pattern (value semantics) rather than mutating through a pointer — clean and testable."
  - "grpc.NewClient used (not deprecated grpc.Dial), keepalive parameters match ADR (30s/10s/true to avoid grpc-go silent bump)."
  - "All 5 sentinel errors are package-prefixed ('authclient: ...') for unambiguous log/error string identification."
  - "Compile-time interface check for NoopLogger (var _ Logger = NoopLogger{}) prevents future silent breakage."
  - "100% coverage on errors.go, 92.9% on client.go — well above the 85% DOD threshold."
