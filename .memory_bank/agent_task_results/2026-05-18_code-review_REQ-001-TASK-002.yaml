findings:
  critical: []

  warnings:
    - id: W-001
      rule: CS-0110
      file: "lib/logger.go:19"
      category: STYLE
      description: |
        The public godoc for NoopLogger contains a reference to the internal
        standard rule identifier "(ES-0143)":

          // NoopLogger is the silent default Logger. It is used when Config.Logger is
          // nil so that the SDK avoids per-call-site nil-checks (ES-0143).

        CS-0110 prohibits internal rule/standard/guide identifiers in code comments.
        The referenced justification is valid, but it should be expressed in plain
        language rather than via a guide ID.
      recommendation: |
        Remove the rule reference and keep only the human-readable explanation:

          // NoopLogger is the silent default Logger. It is used when Config.Logger is
          // nil so that the SDK avoids per-call-site nil-checks at every logging
          // call site.
          type NoopLogger struct{}

  suggestions:
    - id: S-001
      rule: coverage
      file: "lib/client.go:108"
      category: TESTS
      description: |
        WithCache has 0% test coverage. It is the only exported Option function
        without a test. The PRP explicitly excluded it from the test scope, but
        WithCache will be exercised by TASK-003 — adding a minimal test now
        keeps coverage consistent and prevents regression.
      recommendation: |
        Add a table-driven test case in the existing TestNew or a dedicated
        TestWithCache in client_test.go:

          func TestWithCache(t *testing.T) {
              t.Parallel()
              cache := &mockCache{} // implement Cache interface in test
              c, err := New(Config{Endpoint: "localhost:50051"}, WithCache(cache))
              require.NoError(t, err)
              defer c.Close()
              assert.Equal(t, cache, c.cfg.Cache)
          }

    - id: S-002
      rule: CS-0110
      file: "lib/client.go:29"
      category: STYLE
      description: |
        The comment on the unexported `retryServiceConfig` constant references
        "REQ-001-ADR §R11":

          // RefreshToken is intentionally excluded — retrying a refresh that succeeded
          // at AUTH but lost the response would trigger family detection and burn the
          // user's refresh chain (REQ-001-ADR §R11).

        While ADR references are less clearly prohibited by CS-0110 than rule IDs,
        the comment already explains the "why" in full detail in the preceding sentence.
        The ADR cross-reference adds no information for a reader of the code itself.
      recommendation: |
        Remove the ADR reference; the explanation is self-contained:

          // RefreshToken is intentionally excluded — retrying a refresh that succeeded
          // at AUTH but lost the response would trigger family detection and burn the
          // user's refresh chain. maxAttempts=4 means one initial attempt plus three
          // retries with exponential backoff 100ms→1s.

