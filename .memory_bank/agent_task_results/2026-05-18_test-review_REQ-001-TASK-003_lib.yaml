summary: |
  All 132 tests pass with -race. Coverage meets DOD for every specified file. Benchmark
  BenchmarkMemoryCache_Get runs at 33.26 ns/op with 0 allocs — well under the 1 µs target.
  Lint is clean. The test suite is well-structured overall: parallel at both levels,
  table-driven throughout, Expecter API used consistently, no mock.Anything.

  Seven issues found:
    - CRITICAL (3): logic in test loop body (UT-0032), redundant dead sleep in want closure,
      hexSHA256 local helper closure duplicating exported HashToken (UT-0028).
    - WARNING (3): three separate integration test functions for same method (UT-0002),
      missing newTestMocks(t) constructor functions (UT-0026), missing import-cycle
      documentation comment for client_test.go manual stubs.
    - SUGGESTION (1): context matcher could verify more than ctx != nil.

critical:
  - id: TEST-C001
    severity: CRITICAL
    rule_id: UT-0032
    file: lib/internal/cache/memory_test.go
    line: 80
    title: "Logic (if name == ...) in test loop body"
    description: |
      The test loop for TestMemoryCache_Get contains a conditional branch that inspects
      the case name to decide whether to sleep:

        if name == "expired_returns_false" {
            time.Sleep(20 * time.Millisecond)
        }

      UT-0032 strictly forbids if/switch logic in test loop bodies. The timing requirement
      for the "expired" case is a first-class property of that test case and must be expressed
      as data, not as a name check.
    recommended_fix: |
      Add a `sleepBefore time.Duration` field to the test struct and move the sleep into the
      subtest body before calling Get:

        tests := map[string]struct {
            setup       func(c *MemoryCache)
            key         string
            sleepBefore time.Duration   // ← new field
            want        func(*testing.T, any, bool)
        }{
            "expired_returns_false": {
                setup: func(c *MemoryCache) {
                    c.Set(context.Background(), "expiring", "payload", 10*time.Millisecond)
                },
                key:         "expiring",
                sleepBefore: 20 * time.Millisecond,   // ← declared inline
                want: func(t *testing.T, val any, ok bool) {
                    require.False(t, ok)
                    assert.Nil(t, val)
                },
            },
            // ...
        }

        t.Run(name, func(t *testing.T) {
            t.Parallel()
            c := NewMemoryCache(context.Background(), 0)
            tc.setup(c)
            if tc.sleepBefore > 0 {
                time.Sleep(tc.sleepBefore)
            }
            val, ok := c.Get(context.Background(), tc.key)
            tc.want(t, val, ok)
        })

      Note: the sleep inside the want closure of the current "expired_returns_false" case
      (line 47) is dead code — it executes after the Get call whose result is already
      determined. Remove it together with this fix.

  - id: TEST-C002
    severity: CRITICAL
    rule_id: UT-0032
    file: lib/interceptor_grpc_test.go
    line: 406
    title: "Logic (if tc.useLogger / if handler == nil) in test loop body"
    description: |
      The execution block inside the t.Run subtest contains two conditional branches:

        // lines 406-409
        var logger authclient.Logger
        if tc.useLogger {
            logger = m.logger
        }

        // lines 425-428
        handler := tc.handler
        if handler == nil {
            handler = noopHandler
        }

      Both are UT-0032 violations: control flow in the execution section must not depend on
      test-case fields used as flags. The intent of each test case should be fully expressed
      in the prepareMocks and want closures and in the struct fields themselves.
    recommended_fix: |
      1. Replace `useLogger bool` with a `logger authclient.Logger` field and set it
         directly in each test case that requires a real logger, defaulting to nil for others:

           // In struct:
           logger authclient.Logger

           // In test case that needs the logger:
           logger: m.logger,  // set inside prepareMocks or directly in struct

           // In execution body — no if:
           c := authclient.NewTestClient(cfg, m.cache, m.auth, tc.logger)

      2. Replace the `handler == nil` nil-check default by requiring every test case to
         specify a handler explicitly. Either set the field to `noopHandler` in each case
         that does not supply a custom one, or define a `handler` field that panics if nil
         and set noopHandler as the struct default:

           // Each test case with no custom handler:
           handler: noopHandler,

           // Remove the nil-check from the execution body entirely.

  - id: TEST-C003
    severity: CRITICAL
    rule_id: UT-0028
    file: lib/validate_test.go
    line: 42
    title: "hexSHA256 helper closure duplicates exported HashToken"
    description: |
      TestClient_ValidateAccessToken defines a local helper closure at the top of the test
      function body:

        hexSHA256 := func(s string) string {
            h := sha256.Sum256([]byte(s))
            return hex.EncodeToString(h[:])
        }

      UT-0028 forbids helper functions/closures that compute or transform test data. More
      importantly, `authclient.HashToken` is already exported via export_test.go precisely
      for this purpose — middleware_http_test.go and interceptor_grpc_test.go both call
      `authclient.HashToken(...)` directly. The closure in validate_test.go is a duplicate
      implementation that introduces inconsistency and unnecessary code.
    recommended_fix: |
      Remove the hexSHA256 closure and replace every occurrence with authclient.HashToken:

        // Before:
        hexSHA256 := func(s string) string { ... }
        expectedKey := hexSHA256("tok-u1")

        // After:
        expectedKey := authclient.HashToken("tok-u1")

      Also remove the now-unused imports of "crypto/sha256" and "encoding/hex" from
      validate_test.go.

warnings:
  - id: TEST-W001
    severity: WARNING
    rule_id: UT-0002
    file: lib/validate_integration_test.go
    line: 14
    title: "Three separate test functions for one method (ValidateAccessToken)"
    description: |
      validate_integration_test.go declares three separate top-level functions that all test
      the same method `ValidateAccessToken`:
        - TestValidateAccessToken_Happy (line 14) — skipped
        - TestValidateAccessToken_Invalid (line 18)
        - TestValidateAccessToken_Expired (line 31) — skipped

      UT-0002 mandates one method = one test function. Even for integration tests the naming
      convention UT-0010/UT-0002 applies. This also results in case-name suffixes (_Happy,
      _Invalid, _Expired) in the function names themselves — a pattern the standard reserves
      for the case map keys, not the function name.

      Note: the two skipped functions are placeholders pending TASK-004/007, so the impact
      is currently low. However the pattern violates the standard.
    recommended_fix: |
      Consolidate into one function with table-driven cases, skipping individual entries
      where the test cannot yet run:

        func TestClient_ValidateAccessToken(t *testing.T) {
            tests := map[string]struct {
                run func(t *testing.T, c *authclient.Client)
            }{
                "happy_path": {
                    run: func(t *testing.T, c *authclient.Client) {
                        t.Skip("requires authclient.Login (TASK-004) for token acquisition")
                    },
                },
                "invalid_token_returns_ErrInvalidToken": {
                    run: func(t *testing.T, c *authclient.Client) {
                        _, err := c.ValidateAccessToken(context.Background(), "definitely-not-a-real-token")
                        require.ErrorIs(t, err, authclient.ErrInvalidToken)
                    },
                },
                "expired_token_returns_ErrExpired": {
                    run: func(t *testing.T, c *authclient.Client) {
                        t.Skip("requires waiting >1m for access_token TTL; deferred to TASK-007")
                    },
                },
            }
            // ... create client, iterate
        }

  - id: TEST-W002
    severity: WARNING
    rule_id: UT-0026
    file: lib/validate_test.go
    line: 28
    description_applies_to:
      - lib/validate_test.go (validateTestMocks)
      - lib/middleware_http_test.go (httpMiddlewareTestMocks)
      - lib/interceptor_grpc_test.go (interceptorTestMocks)
    title: "testMocks struct lacks newTestMocks(t) constructor"
    description: |
      UT-0026 requires the canonical pattern: testMocks struct + newTestMocks(t *testing.T)
      constructor (with t.Helper()) + newHandlerFromMocks for object construction. The three
      test files define the struct correctly but instantiate it via inline struct literals:

        m := &validateTestMocks{
            cache: mocks.NewMockCache(t),
            auth:  &authclient.FakeAuthClient{},
        }

      Without a newTestMocks(t) constructor, t.Helper() is not called, which means any
      failure during mock setup is attributed to the t.Run subtest line rather than the
      actual failing mock.NewMockXxx call. Also, adding a new dependency to the mocks
      struct requires updating every instantiation site instead of just the constructor.
    recommended_fix: |
      Add a newTestMocks(t) constructor in each test file. Example for validate_test.go:

        func newValidateTestMocks(t *testing.T) *validateTestMocks {
            t.Helper()
            return &validateTestMocks{
                cache: mocks.NewMockCache(t),
                auth:  &authclient.FakeAuthClient{},
            }
        }

      Then in the t.Run body:
        m := newValidateTestMocks(t)
        tc.prepareMocks(t, m)

      Repeat for httpMiddlewareTestMocks (middleware_http_test.go) and
      interceptorTestMocks (interceptor_grpc_test.go).

  - id: TEST-W003
    severity: WARNING
    rule_id: UT-0020
    file: lib/client_test.go
    line: 12
    title: "recordingLogger / stubCache are manual stubs without import-cycle explanation"
    description: |
      client_test.go defines two hand-written types that implement SDK interfaces:
        - type recordingLogger struct{} implementing Logger
        - type stubCache struct{} implementing Cache

      UT-0020 forbids manually written mock/stub structs — generated mocks must be used.
      The accepted exception here is the import cycle: client_test.go is in package authclient
      (internal test file), and importing lib/mocks from package authclient would create a
      circular dependency (lib/mocks → lib → lib, cycle). This is the same reason
      FakeAuthClient exists in export_test.go.

      However, while export_test.go has a clear 7-line comment block explaining the
      import-cycle workaround, client_test.go has no such explanation. A future developer
      seeing recordingLogger/stubCache without context may attempt to replace them with
      mocks.MockLogger/mocks.MockCache, causing a build error.
    recommended_fix: |
      Add an explanatory comment at the top of client_test.go before the type declarations:

        // recordingLogger and stubCache are hand-written test doubles rather than mockery-
        // generated mocks because this file is in package authclient (internal test package).
        // Importing lib/mocks from package authclient would create a circular dependency:
        //   lib (authclient) → lib/mocks → lib (authclient).
        // External tests (package authclient_test) use mocks.MockCache / mocks.MockLogger
        // and avoid the cycle. See export_test.go for the same pattern applied to FakeAuthClient.

suggestions:
  - id: TEST-S001
    severity: SUGGESTION
    rule_id: UT-0023
    file: lib/validate_test.go
    line: 59
    description_applies_to:
      - lib/validate_test.go (all mock.MatchedBy for ctx)
      - lib/middleware_http_test.go (all mock.MatchedBy for ctx)
      - lib/interceptor_grpc_test.go (all mock.MatchedBy for ctx)
    title: "Context MatchedBy check is ctx != nil — consider asserting derivation"
    description: |
      All cache mock expectations use:
        mock.MatchedBy(func(ctx context.Context) bool { return ctx != nil })

      `mock.MatchedBy` is the correct approach when the exact context value cannot be
      injected (the middleware/interceptor creates a derived context with timeout internally).
      However, the predicate `ctx != nil` is the weakest possible check — it accepts
      any non-nil context including context.Background().

      A stronger predicate would verify that the context has a deadline (i.e., that the
      ValidateTimeout was actually applied):

        mock.MatchedBy(func(ctx context.Context) bool {
            _, hasDeadline := ctx.Deadline()
            return hasDeadline
        })

      This is a suggestion rather than a violation because (a) mock.MatchedBy IS the
      prescribed fallback for context parameters that cannot be captured, and (b) the
      current check does protect against a nil context being passed (a regression that
      would indicate a serious bug).
    recommended_fix: |
      Optionally strengthen the context matcher in validate_test.go, middleware_http_test.go,
      and interceptor_grpc_test.go:

        mock.MatchedBy(func(ctx context.Context) bool {
            _, hasDeadline := ctx.Deadline()
            return hasDeadline  // validates ValidateTimeout was applied
        })

      If the context timeout logic is already tested via behavior (e.g., the test for
      grpc_deadline_exceeded), keeping ctx != nil is acceptable to avoid over-specifying
      the internal implementation detail of when context.WithTimeout is called.

