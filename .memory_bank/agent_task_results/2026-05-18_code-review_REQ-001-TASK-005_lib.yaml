prp_dod_compliance:

  # 1. HttpOnly=true and Secure=true are set AFTER the opts loop.
  #    lib/cookies.go:102-106: for-loop executes opts, then cookie.HttpOnly=true, cookie.Secure=true.
  cookies_security_regression_guard: pass

  # 2. No WithCookieInsecure, WithCookieAllowJS, WithCookieValue, WithCookieName options exist.
  #    Only 4 exported option constructors: WithCookieDomain, WithCookiePath,
  #    WithCookieMaxAge, WithCookieSameSite. Confirmed by grepping all exported funcs.
  cookies_no_insecure_options: pass

  # 3. Defaults verified:
  #    defaultRefreshCookieName   = "refresh_token"        (line 9)
  #    defaultRefreshCookiePath   = "/auth/refresh"        (line 10)
  #    defaultRefreshCookieMaxAge = 14 * 24 * 60 * 60      (line 11; = 1209600)
  #    SameSite                   = http.SameSiteStrictMode (line 100)
  #    Domain                     = ""                     (zero value; host-only)
  cookies_defaults_correct: pass

  # 4. ClearRefreshCookie sets cookie.MaxAge = -1 (line 81)
  #    AND cookie.Expires = time.Unix(0, 0) (line 85).
  #    Both present; inline comment explains RFC 6265 §5.3 legacy-browser compat.
  cookies_clear_expires_epoch: pass

  # 5. IPFromRequest fallback chain (helpers.go:33-43):
  #      X-Real-IP (non-empty) →
  #      X-Forwarded-For[0] (SplitN limit=2, TrimSpace applied) →
  #      net.SplitHostPort host part →
  #      r.RemoteAddr verbatim (SplitHostPort error branch).
  #    Order matches PRP specification exactly.
  helpers_fallback_chain_order: pass

  # 6. SECURITY warning in IPFromRequest godoc (helpers.go:24-28):
  #    "SECURITY: This function is spoofable in the absence of a trusted proxy."
  #    Warning explains the spoofing risk and prescribes mitigation (trusted proxy).
  helpers_security_warning: pass

  # 7. All exported identifiers have godoc starting with the identifier name (ES-0080/0081):
  #    CookieOption (line 14), WithCookieDomain (line 24), WithCookiePath (line 29),
  #    WithCookieMaxAge (line 36), WithCookieSameSite (line 44), SetRefreshCookie (line 51),
  #    ClearRefreshCookie (line 72), IPFromRequest (line 9), UserAgentFromRequest (line 46).
  godoc_es0080_es0081: pass

  # 8. No //nolint annotations found in either file (grep returned empty).
  no_nolint_es0171: pass

