critical_rules_summary:
  effective_standards:
    - rule: "ES-0051"
      description: "Interfaces at consumer. SDK экспортирует Logger/MetricsRecorder как adapter interfaces в lib/client.go."
    - rule: "ES-0053"
      description: "var _ auth_v1.AuthServiceClient = (*Client)(nil) или compile-time checks для impl."
    - rule: "ES-0062"
      description: "Sentinel errors: var ErrInvalidToken = errors.New(...). Используется с errors.Is()."
    - rule: "ES-0120"
      description: "Functional options для New(): WithLogger, WithMetrics, WithCacheTTL, WithFailOpen, WithKeepalive."
    - rule: "ES-0140"
      description: "Constructor name = New(). Не NewClient, не NewAuthClient."
    - rule: "ES-0141"
      description: "Dependencies struct если 3+ зависимостей. В SDK: Config + opts ...Option."
    - rule: "ES-0142"
      description: "Validate в конструкторе: addr не пустой, TTL > 0, и т.д."
    - rule: "ES-0143"
      description: "Noop defaults: если Logger не передан — noopLogger{}. Nil-checks в методах запрещены."
    - rule: "ES-0171"
      description: "nolint аннотации запрещены. Мигрировать на grpc.NewClient — нет необходимости в nolint."

  coding_style:
    - rule: "CS-0051"
      description: "File structure: client.go = interfaces + Config + Client struct + New() + private helpers."
    - rule: "CS-0100"
      description: "Нет envDefault в Config. SDK не использует env tags вообще — конфигурация через functional options."
    - rule: "CS-0117"
      description: "UserInfo (возвращается из ValidateToken) — это DTO (открытые поля, boundary struct)."

  effective_concurrency:
    - rule: "EC-0034"
      description: "RWMutex для кэша ValidateToken: RLock на чтение, Lock на запись."
    - rule: "EC-0056"
      description: "type userContextKey struct{} — unexported type key для context.WithValue(ctx, userContextKey{}, user)."
    - rule: "EC-0060"
      description: "atomic.Bool для isActive если нужен lifecycle (Start/Close). В SDK — не нужен."
    - rule: "EC-0062"
      description: "Swap(true) вместо Load+Store для entry guards."
    - rule: "EC-0063"
      description: "Не смешивать atomic и mutex для одного поля."
