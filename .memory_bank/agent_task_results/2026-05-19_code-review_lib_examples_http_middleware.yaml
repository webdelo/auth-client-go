positive:
  - "Correct gocritic exitAfterDefer pattern: main() contains only os.Exit(run()); all defers in run() execute normally."
  - "Compile-time interface assertion var _ authclient.Logger = slogAdapter{} catches signature drift at build time."
  - "slogAdapter.Error correctly prepends the err as a structured 'error' key before variadic fields, matching the SDK Logger contract."
  - "Graceful shutdown is textbook: signal.NotifyContext + buffered(1) serverErr channel + srv.Shutdown with 5s timeout context."
  - "Buffered channel serverErr(1) prevents the server goroutine from blocking if nobody drains after srv.Shutdown returns."
  - "Idempotent logout: errors.Is(lerr, authclient.ErrInvalidToken) correctly swallows the stale-cookie error."
  - "ReadHeaderTimeout: 5s protects against Slowloris without requiring external middleware."
  - "Method-prefixed mux routing (POST /auth/login, GET /api/profile) leverages Go 1.22+ enhanced ServeMux safely on go 1.25."
  - "Package doc comment is present, starts with 'Package main', and describes all three endpoints plus the demonstrated patterns."
  - "README is accurate: cookie path /auth/refresh claim verified against lib/cookies.go defaultRefreshCookiePath; curl examples are runnable; Expected output section matches actual response shapes."
  - "No exported identifiers in an example package — correct since it is package main."
  - "No //nolint directives — clean lint posture maintained."

