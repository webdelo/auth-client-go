# ─────────────────────────────────────────────
# Issues
# ─────────────────────────────────────────────
issues:
  critical: []

  warnings:
    - id: HTTPM-W001
      category: STYLE
      title: "Missing blank line after guard-clause if block (CS-0010)"
      file: lib/examples/http_middleware/main.go
      line: 32
      standard: "coding_style.md CS-0010"
      description: |
        The guard clause `if endpoint == "" { ... return 0 }` is immediately followed by
        `addr := getenvOr(...)` on the next line with no blank line separating them.
        CS-0010 requires an empty line after every `if` block. The exception applies
        only to `if err != nil` error-check pairs, not to arbitrary guard clauses.
      current_code: |
        if endpoint == "" {
            usage()
            return 0
        }
        addr := getenvOr("HTTP_ADDR", ":8080")
      recommended_fix: |
        if endpoint == "" {
            usage()
            return 0
        }

        addr := getenvOr("HTTP_ADDR", ":8080")
      reason: "CS-0010 block spacing improves visual separation between guard clauses and subsequent logic."

    - id: HTTPM-W002
      category: STYLE
      title: "Missing blank line after switch block (CS-0010)"
      file: lib/examples/http_middleware/main.go
      line: 146
      standard: "coding_style.md CS-0010"
      description: |
        The `switch` block handling login errors (lines 130–146) is immediately followed
        by `authclient.SetRefreshCookie(...)` on line 147 with no blank line.
        CS-0010 requires an empty line after switch blocks.
      current_code: |
        switch {
        case errors.Is(err, authclient.ErrInvalidToken):
            http.Error(w, "invalid credentials", http.StatusUnauthorized)
            return
        // ... other cases
        case err != nil:
            http.Error(w, err.Error(), http.StatusInternalServerError)
            return
        }
        authclient.SetRefreshCookie(w, out.RefreshToken)
      recommended_fix: |
        switch {
        // ... cases unchanged
        case err != nil:
            http.Error(w, err.Error(), http.StatusInternalServerError)
            return
        }

        authclient.SetRefreshCookie(w, out.RefreshToken)
      reason: "CS-0010 block spacing — blank line after switch separates error dispatch from success path."

    - id: HTTPM-W003
      category: STYLE
      title: "Missing blank line after guard-clause if block in profileHandler (CS-0010)"
      file: lib/examples/http_middleware/main.go
      line: 181
      standard: "coding_style.md CS-0010"
      description: |
        In `profileHandler`, the guard `if !ok { http.Error(...); return }` (lines 178–181)
        is immediately followed by `writeJSON(...)` on line 182 with no blank line.
        CS-0010 requires an empty line after if blocks; the exception is only for
        `if err != nil` error-check pairs, not boolean-flag guards.
      current_code: |
        user, ok := authclient.UserFromContext(r.Context())
        if !ok {
            http.Error(w, "no user", http.StatusInternalServerError)
            return
        }
        writeJSON(w, http.StatusOK, map[string]string{
      recommended_fix: |
        user, ok := authclient.UserFromContext(r.Context())
        if !ok {
            http.Error(w, "no user", http.StatusInternalServerError)
            return
        }

        writeJSON(w, http.StatusOK, map[string]string{
      reason: "CS-0010 block spacing — blank line after guard clearly separates error path from success path."

    - id: HTTPM-W004
      category: STYLE
      title: "Missing blank line after if block in getenvOr (CS-0010)"
      file: lib/examples/http_middleware/main.go
      line: 200
      standard: "coding_style.md CS-0010"
      description: |
        In `getenvOr`, the if block (lines 198–200) is immediately followed by
        `return def` on line 201 with no blank line. CS-0010 applies to all if blocks.
      current_code: |
        func getenvOr(key, def string) string {
            if v := os.Getenv(key); v != "" {
                return v
            }
            return def
        }
      recommended_fix: |
        func getenvOr(key, def string) string {
            if v := os.Getenv(key); v != "" {
                return v
            }

            return def
        }
      reason: "CS-0010 block spacing — consistent with the rule applied across the codebase."

  suggestions:
    - id: HTTPM-S001
      category: PERFORMANCE
      title: "Use strconv.Itoa instead of fmt.Sprintf for Retry-After header value (ES-0110)"
      file: lib/examples/http_middleware/main.go
      line: 136
      standard: "effective_standards.md ES-0110"
      description: |
        `fmt.Sprintf("%d", int(d.Seconds()))` performs an integer-to-string conversion.
        ES-0110 recommends `strconv.Itoa` or `strconv.FormatInt` over `fmt.Sprintf`
        for numeric conversions — it is faster, allocates less, and expresses intent clearly.
        The `strconv` package is already available as a stdlib import.
      current_code: |
        w.Header().Set("Retry-After", fmt.Sprintf("%d", int(d.Seconds())))
      recommended_fix: |
        w.Header().Set("Retry-After", strconv.Itoa(int(d.Seconds())))
        // Add "strconv" to the import block.
      reason: "strconv.Itoa is the idiomatic and more performant approach for int-to-string conversion."

