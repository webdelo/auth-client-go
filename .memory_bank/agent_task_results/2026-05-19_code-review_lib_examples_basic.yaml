issues:
  critical: []

  warnings: []

  suggestions:
    - id: 1
      severity: SUGGESTION
      file: lib/examples/basic/main.go
      line: 93
      title: "safeTrunc appends ellipsis even when string is not truncated"
      description: >
        When the input string is shorter than n (e.g. a token of length 3 with n=8),
        the guard clamps n to len(s) and the function returns s[:len(s)] + "…" — i.e. the
        full string with an appended ellipsis. The ellipsis is only semantically correct
        when actual truncation occurred. In the current demo the access token will always
        be a full JWT (100+ chars) so this never triggers in practice, but the function
        contract is subtly wrong and would mislead a future reader or reuser.
      fix_recommendation: |
        func safeTrunc(s string, n int) string {
            if len(s) <= n {
                return s
            }

            return s[:n] + "…"
        }

    - id: 2
      severity: SUGGESTION
      file: lib/examples/basic/README.md
      line: 33
      title: "README expected output prints 'Close ok' before Close actually executes"
      description: >
        Line 75 of main.go prints "step 5: Close ok (deferred)" while still inside run(),
        before the deferred client.Close() has fired. The README reproduces this line in
        the expected output without any clarifying note, which could confuse a reader into
        thinking the print is emitted by or after the Close call. The parenthetical
        "(deferred)" in the message itself partially mitigates this, but the README
        expected-output block has no note about the ordering.
      fix_recommendation: |
        Add a brief comment in the ## Expected output section, for example:

        ```
        step 5: Close ok (deferred)
        ```
        *(This line is printed before `client.Close()` runs; the actual Close happens
        after `run()` returns, inside the deferred closure.)*

        Alternatively rename the log message in main.go to be less ambiguous:
            fmt.Println("step 5: defer Close registered — will run on exit")

