issues:
  critical: []

  warnings:
    - id: GRPC-W001
      category: STYLE
      title: "CS-0010: Missing empty line after if guard clause (line 125)"
      file: lib/examples/grpc_interceptor/main.go
      line: 125
      standard: "coding_style.md CS-0010"
      description: |
        The closing brace of the RPC3 assertion guard clause (line 125) is
        immediately followed by a fmt.Printf call on line 126 without an
        intervening empty line. CS-0010 requires an empty line after every
        if/switch/select/for block, including guard clauses.
      current_code: |
        if !ok || st.Code() != codes.Unauthenticated {
            fmt.Fprintf(os.Stderr, "RPC3 Health/List without token: expected Unauthenticated, got %v\n", err)
            return 1
        }
        fmt.Printf("RPC3 Health/List (no metadata) → %s (as expected)\n", st.Code())
      recommended_fix: |
        if !ok || st.Code() != codes.Unauthenticated {
            fmt.Fprintf(os.Stderr, "RPC3 Health/List without token: expected Unauthenticated, got %v\n", err)
            return 1
        }

        fmt.Printf("RPC3 Health/List (no metadata) → %s (as expected)\n", st.Code())
      reason: "Block spacing is required after every if block per CS-0010."

  suggestions:
    - id: GRPC-S001
      category: STYLE
      title: "CS-0003: Inline timeout durations are magic numbers"
      file: lib/examples/grpc_interceptor/main.go
      line: 54
      standard: "coding_style.md CS-0003"
      description: |
        The literal values 10*time.Second (loginCtx, line 54) and 5*time.Second
        (rpcCtx, line 101) are magic numbers. CS-0003 permits 0, 1, 2, and 0.5
        without a constant, but all other numeric literals should be named.
        In an SDK example this adds clarity about the intended purpose of each
        timeout (login vs. in-process RPC).
      current_code: |
        loginCtx, cancelLogin := context.WithTimeout(context.Background(), 10*time.Second)
        // ...
        rpcCtx, cancelRPC := context.WithTimeout(context.Background(), 5*time.Second)
      recommended_fix: |
        const (
            loginTimeout = 10 * time.Second
            rpcTimeout   = 5 * time.Second
        )

        loginCtx, cancelLogin := context.WithTimeout(context.Background(), loginTimeout)
        // ...
        rpcCtx, cancelRPC := context.WithTimeout(context.Background(), rpcTimeout)
      reason: "Named constants make intent explicit and prevent future copy-paste errors."

    - id: GRPC-S002
      category: LOGIC
      title: "Logout uses rpcCtx shared with 3 preceding RPCs"
      file: lib/examples/grpc_interceptor/main.go
      line: 128
      standard: "effective_concurrency.md EC-0053"
      description: |
        client.Logout at line 128 reuses rpcCtx, which was created with a 5-second
        timeout at line 101. By the time Logout is called, the context may have only
        seconds (or less) of budget remaining, depending on how long the three RPCs
        took. For an in-process example this is unlikely to cause a real timeout, but
        it is a pattern mismatch: login is given its own 10-second context while
        Logout, which is semantically a separate I/O operation, piggybacks on the
        shared RPC context.
      current_code: |
        rpcCtx, cancelRPC := context.WithTimeout(context.Background(), 5*time.Second)
        defer cancelRPC()
        // ... three RPCs ...
        if lerr := client.Logout(rpcCtx, out.RefreshToken); lerr != nil {
      recommended_fix: |
        // Separate timeout for the cleanup logout call
        logoutCtx, cancelLogout := context.WithTimeout(context.Background(), 5*time.Second)
        defer cancelLogout()
        if lerr := client.Logout(logoutCtx, out.RefreshToken); lerr != nil {
      reason: |
        Each remote call should have its own context budget (EC-0053).
        Sharing one timeout across multiple independent operations obscures
        which operation exhausted the deadline and may cause premature cancellation.

    - id: GRPC-S003
      category: STYLE
      title: "README: /Watch full method path is inconsistently abbreviated"
      file: lib/examples/grpc_interceptor/README.md
      line: 11
      standard: "coding_style.md CS-0021"
      description: |
        Line 11 reads: "`/grpc.health.v1.Health/Check` and `/Watch` are in the
        SDK's default open-methods registry". The second method is written as
        `/Watch` instead of its full path `/grpc.health.v1.Health/Watch`.
        The full method string is what the SDK registers in defaultOpenMethods
        (lib/client.go) and what consumers would use in WithOpenMethods calls.
        Abbreviated forms may confuse readers who look at the SDK source or call
        WithOpenMethods with the short form, which would not match.
      current_code: |
        `/grpc.health.v1.Health/Check` and `/Watch` are in the SDK's default open-methods
        registry (no auth needed).
      recommended_fix: |
        `/grpc.health.v1.Health/Check` and `/grpc.health.v1.Health/Watch` are in the
        SDK's default open-methods registry (no auth needed).
      reason: "Accuracy: consumers copy these strings into WithOpenMethods calls."

