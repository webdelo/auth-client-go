positive:
  - "exitAfterDefer pattern correctly implemented: main() is a single os.Exit(run()) call."
  - "All three error-producing defers (client.Close, conn.Close, grpcSrv.GracefulStop)
    are properly handled without silent discards — satisfies ES-0060."
  - "Goroutine lifecycle is clean: Serve goroutine is guaranteed to unblock via
    defer grpcSrv.GracefulStop() registered immediately after launch (EC-0012)."
  - "grpc.Server.Serve() returns nil (not ErrServerStopped) during normal GracefulStop
    — no spurious stderr output on happy path."
  - "Ephemeral port 127.0.0.1:0 is the correct choice for CI-parallelism."
  - "Metadata key 'authorization' is lowercase — gRPC HTTP/2 header compliance verified."
  - "readEnv() uses named return values WITH explicit return (not naked return) — CS-0002 satisfied."
  - "SetServingStatus(\"\", SERVING) correctly enables Health/Check to return SERVING
    for the empty-string (default) service."
  - "RPC3 assertion uses status.FromError idiom correctly — handles both nil error
    (ok=true, code=OK != Unauthenticated) and non-status error (ok=false) paths."
  - "Import order (stdlib / external grpc / internal authclient) is correct per ES-0130."
  - "Makefile targets use tab indentation exclusively — verified via od output."
  - "build-examples target names binaries .temp/examples/<name> (no example- prefix)
    and clean removes the same path."
  - "No //nolint annotations anywhere in scope."
  - "make audit passes: 214/214 tests, 0 lint issues, go.sum unchanged."

