  health_list_as_protected_method:
    result: pass
    notes: "Check and Watch are the only methods in defaultOpenMethods (client.go:335-340).
      Health/List is NOT in the open set, so the interceptor correctly enforces auth for RPC2/RPC3."

  error_handling_es0060:
    client_close: pass
    conn_close: pass
    grpc_serve_goroutine: pass
    logout: pass
    notes: |
      All error paths are handled. client.Close() and conn.Close() are wrapped in
      defer func with explicit error reporting. grpcSrv.Serve() error is checked
      inside the goroutine. client.Logout error is checked with warning output.
      No errors are silently discarded.

  goroutine_cleanup_ec0012:
    result: pass
    notes: "defer grpcSrv.GracefulStop() is registered immediately after the goroutine
      is launched (line 84), guaranteeing that Serve() unblocks when run() returns.
      grpc.Server.Serve() returns nil (not ErrServerStopped) when GracefulStop is called
      while Serve is actively running — verified in grpc@v1.79.3/server.go:888-891."

  ephemeral_port:
    result: pass
    notes: "net.Listen(\"tcp\", \"127.0.0.1:0\") on line 68 requests OS-assigned port.
      Safe for parallel CI execution."

  set_serving_status:
    result: pass
    notes: "healthSrv.SetServingStatus(\"\", grpc_health_v1.HealthCheckResponse_SERVING)
      on line 76 registers the empty-string service. Health/Check (which queries the
      empty-string service) returns SERVING as expected by RPC1."

  metadata_key_case:
    result: pass
    notes: "metadata.Pairs(\"authorization\", ...) on line 111 uses lowercase key,
      matching the HTTP/2 header requirement. The interceptor reads the same key
      via md.Get(\"authorization\") — exact match confirmed."

  three_rpc_self_test:
    result: pass
    notes: |
      RPC1 (Check, no metadata): interceptor skips auth (open method) → SERVING.
      RPC2 (List, Bearer): interceptor validates token → success, len(statuses)==1.
      RPC3 (List, no metadata): interceptor returns codes.Unauthenticated → asserted
      via status.FromError. Any deviation causes return 1 (non-zero exit).

  exit_after_defer_pattern:
    result: pass
    notes: "main() contains only os.Exit(run()). All logic and cleanup are in run()."

  readenv_cs0002_named_returns_explicit:
    result: pass
    notes: "readEnv() uses named return params AND explicit return statement:
