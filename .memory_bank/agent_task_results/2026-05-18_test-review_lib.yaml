# === ISSUES ===
issues:
  critical: []

  warnings: []

  suggestions:
    - id: "TEST-S001"
      title: "conn.Close error could use errors.Join pattern in future real tests"
      file: "lib/client_integration_test.go"
      line: 36
      standard: "ES-0060 (effective_standards.md)"
      description: |
        Currently `conn.Close` error is handled with a standalone `t.Fatalf`. For this TCP
        smoke test that is perfectly fine. In future integration tests that do multiple cleanup
        operations (e.g. gRPC connection close + context cancel), consider chaining errors
        with errors.Join or defer-with-named-return to ensure all cleanup errors surface.
        No action required for TASK-001.
      current_code: |
        if err := conn.Close(); err != nil {
            t.Fatalf("close conn: %v", err)
        }
      recommended_fix: |
        # No change needed for TASK-001. For multi-step cleanup in future tests:
        # t.Cleanup(func() {
        #     if err := conn.Close(); err != nil {
        #         t.Errorf("close conn: %v", err)  // non-fatal cleanup error
        #     }
        # })
      reason: "Informational only — pattern to keep in mind for TASK-003+ gRPC connection teardown."

    - id: "TEST-S002"
      title: "Consider t.Skip instead of os.Exit(0) in TestMain for skip semantics visibility"
      file: "lib/client_integration_test.go"
      line: 22
      standard: "IT-0008 (integration_tests_standards.md)"
      description: |
        TestMain uses os.Exit(0) when RUN_INTEGRATION_TESTS != "true". This exits cleanly
        and prevents test execution as intended. Some projects prefer os.Exit(0) (current)
        while others call m.Run() after printing a skip message so the test binary reports
        "no test files" rather than zero exit. Both approaches are valid; the current one
        matches the pattern in IT-0060 runner.go reference implementation.
        No change required.
      current_code: |
        if os.Getenv("RUN_INTEGRATION_TESTS") != "true" {
            os.Exit(0)
        }
      recommended_fix: |
        # Alternative (informational only):
        # if os.Getenv("RUN_INTEGRATION_TESTS") != "true" {
        #     fmt.Println("skipping integration tests: set RUN_INTEGRATION_TESTS=true")
        #     os.Exit(0)
        # }
      reason: "Minor observability improvement for CI logs. Current form is compliant."

