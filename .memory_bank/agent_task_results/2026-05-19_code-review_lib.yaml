  warnings:
    - id: "LIB-W001"
      category: "LOGIC"
      title: "README Config table claims ValidateCacheTTL default is 30s, but Go zero-value is 0 (cache disabled)"
      file: "README.md"
      line: 78
      standard: "ES-0081 (doc accuracy); documentation correctness"
      description: |
        The Configuration table in README.md shows:
          | ValidateCacheTTL | 30s | ... |
        A consumer reading only the table will conclude that omitting ValidateCacheTTL
        activates a 30-second cache automatically. This is incorrect.

        The actual behavior (from client.go applyDefaults):
          - ValidateCacheTTL < 0  → SDK applies 30s (the explicit SDK default)
          - ValidateCacheTTL == 0 → PRESERVED AS ZERO, meaning cache is disabled
                                    (cache.Set is a no-op for TTL<=0)
          - ValidateCacheTTL > 0  → used as-is

        The Config struct's Go zero-value is 0, so:
          authclient.New(authclient.Config{Endpoint: "auth:50051"})
        produces a client with NO cache at all, not a 30s cache.

        The same misleading "default 30s" phrasing appears in:
          - README.md line 78 (Config table Default column)
          - README.md line 368 (Known Limitations: "(default 30s)")
          - CHANGELOG.md line 25 ("positive-result TTL cache (default 30s)")

        Note: The godoc on Config.ValidateCacheTTL is accurate:
          "Defaults to 30s when negative. Zero means 'cache disabled'…"
        The discrepancy is only in the README table and CHANGELOG description.
      current_code: |
        # README.md line 78
        | `ValidateCacheTTL` | `30s` | Positive-result TTL...`0` makes every call reach AUTH... |
      recommended_fix: |
        # README.md Config table — change Default column:
        | `ValidateCacheTTL` | `0` (cache disabled) | Positive-result TTL of the in-memory
        `ValidateToken` cache. `0` (the zero-value) disables caching — every call reaches AUTH.
        Set to `30*time.Second` to use the SDK-recommended TTL, or set to a negative value to
        apply the SDK default of 30s automatically. |

        # README.md Known Limitations — update "(default 30s)":
        `ValidateCacheTTL` (default `0`, i.e., cache disabled unless explicitly set).

        # CHANGELOG.md line 25 — clarify:
        positive-result TTL cache (SDK-recommended TTL: 30s; set `ValidateCacheTTL` to activate);
      reason: |
        "Default" in a config table means "value when field is omitted". For ValidateCacheTTL the
        Go zero-value is 0 = disabled. Documenting "30s" trains consumers to expect caching without
        explicit configuration, leading to surprise (all calls hit AUTH) or incorrect debugging.

    - id: "LIB-W002"
      category: "LOGIC"
      title: "README Fail Mode section: UserFromContext returns (User{}, false) — incorrect, actually returns (User{}, true)"
      file: "README.md"
      line: 105
      standard: "ES-0081 (doc accuracy); documentation correctness"
      description: |
        README.md Fail Mode section states:
          "Downstream code must treat `UserFromContext(...)` returning `(User{}, false)` as 'unauthenticated'."

        This is factually wrong. In FailOpen mode the middleware executes:
          next.ServeHTTP(w, r.WithContext(WithUser(r.Context(), User{})))
        which calls WithUser, which stores an empty User{} in context via context.WithValue.

        UserFromContext then performs a type assertion:
          user, ok := ctx.Value(userCtxKey{}).(User)
        The key IS present (empty User{} was stored), so the type assertion succeeds and
        ok = TRUE, not false.

        The returned value is (User{}, true), not (User{}, false).

        (User{}, false) would only happen if the middleware was bypassed entirely — i.e., when
        the route is not wrapped with HTTPMiddleware at all and no user was ever stored.

        The README itself already shows the correct idiom one paragraph above (line 61):
          "user.IsZero() — true only if the middleware was skipped (FailOpen on AUTH-down)"
        The IsZero() check is correct; the (User{}, false) claim is not.

        The same pattern appears in the gRPC UnaryInterceptor FailOpen path, which also calls
        handler(WithUser(ctx, User{}), req), so UserFromContext returns (User{}, true) there too.
      current_code: |
        - `FailOpen` — pass the request through with an empty `User` in context. Downstream code must
          treat `UserFromContext(...)` returning `(User{}, false)` as "unauthenticated".
      recommended_fix: |
        - `FailOpen` — pass the request through with an empty `User` in context. Downstream code must
          call `user.IsZero()` to detect the unauthenticated pass-through (the bool returned by
          `UserFromContext` is `true` even on FailOpen — an empty `User{}` is stored, so the key is
          present). Example:

          ```go
          user, _ := authclient.UserFromContext(r.Context())
          if user.IsZero() {
              // AUTH was unreachable and FailOpen is configured; treat as unauthenticated
              http.Error(w, "unauthorized", http.StatusUnauthorized)
              return
          }
          ```
      reason: |
        Telling consumers to check `ok == false` to detect FailOpen pass-through will silently
        break their auth check: ok is true, so the if-branch is skipped and the request proceeds
        as if authenticated. user.IsZero() is the correct guard, and it is already shown on line
        61 of the same document.

  suggestions:
    - id: "LIB-S001"
      category: "LOGIC"
      title: "CHANGELOG 'default 30s' phrasing is consistent with the README issue (LIB-W001)"
      file: "CHANGELOG.md"
      line: 25
      description: |
        CHANGELOG.md line 25 states "positive-result TTL cache (default 30s)". This is accurate
        as a description of the SDK-intended TTL value when caching is used, but it mirrors the
        ambiguity from LIB-W001: it could be read as "30s is the default when you omit
        ValidateCacheTTL", which is wrong (zero = disabled).
        Fix alongside LIB-W001 for consistency.
      recommended_fix: |
        # CHANGELOG.md - clarify the TTL description
        positive-result TTL cache (recommended TTL: 30s; `ValidateCacheTTL` defaults to 0 / disabled);

    - id: "LIB-S002"
      category: "LOGIC"
      title: "doc.go Quickstart uses mux variable that is not imported or declared"
      file: "lib/doc.go"
      line: 20
      description: |
        The Quickstart example in doc.go uses `mux.Handle(...)` but the code snippet only imports
        nothing in the godoc (it's a conceptual snippet, not a runnable // Example_ test). The `mux`
        variable is undeclared and would not compile as a standalone program. However the README
        Quickstart correctly uses `http.Handle(...)` (stdlib's DefaultServeMux). The inconsistency
        between doc.go (mux.Handle) and README (http.Handle) may confuse consumers who use
        `go doc` as their primary reference.
      recommended_fix: |
        // In lib/doc.go, replace the Quickstart snippet to match README:
        //
        //	http.Handle("/api/secure", client.HTTPMiddleware(handler))
        //
        // Or declare mux explicitly for clarity:
        //
        //	mux := http.NewServeMux()
        //	mux.Handle("/api/secure", client.HTTPMiddleware(handler))
        //	log.Fatal(http.ListenAndServe(":8080", mux))
      reason: |
        Godoc examples should be internally consistent with README examples. The doc.go snippet
        uses a bare `mux` reference that would not compile; while godoc does not require Examples
        to be runnable in this form, it creates unnecessary confusion for the reader.

