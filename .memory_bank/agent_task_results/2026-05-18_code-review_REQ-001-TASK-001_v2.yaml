# ──────────────────────────────────────────────────────────────────────
# REGRESSION ANALYSIS FOR FIXES
# ──────────────────────────────────────────────────────────────────────
regression_analysis:
  w002_ports_removal:
    description: "Removing ports: from auth-postgres"
    concern: "Could break postgres discovery for auth-migrate or auth-app"
    verdict: "NO REGRESSION"
    reasoning: |
      Both auth-migrate and auth-app connect to auth-postgres via compose DNS hostname
      (auth-postgres:5432), not via host-mapped port. The host port binding served only
      for ad-hoc external debugging access — never for inter-container communication.
      auth-app gets POSTGRES_HOST=auth-postgres:5432 from test.env.
      auth-migrate DSN hardcodes @auth-postgres:5432 in compose command.
      Removing ports: has zero impact on compose-internal connectivity.

  s002_no_deps_flag:
    description: "Adding --no-deps to auth-app startup step"
    concern: "Could skip auth-postgres health validation causing auth-app to start against unhealthy DB"
    verdict: "NO REGRESSION"
    reasoning: |
      --no-deps suppresses bringing up dependency services, NOT health-checking them.
      The execution sequence guarantees auth-postgres is healthy BEFORE auth-app starts:
        Step 1: up -d --wait auth-postgres  →  postgres healthy (blocking)
        Step 2: run --rm auth-migrate       →  migrations applied (blocking, uses healthy postgres)
        Step 3: up -d --wait --no-deps auth-app  →  starts auth-app without restarting dependencies
      auth-app's own healthcheck (inherited from Dockerfile) is still validated by --wait.
      auth-postgres continues running and healthy throughout; auth-app startup is safe.
      auth-app's depends_on: auth-postgres/auth-migrate conditions are used only when compose
      decides what to start alongside the target — with --no-deps this logic is bypassed.
      The sequential Makefile steps provide equivalent ordering guarantees.

