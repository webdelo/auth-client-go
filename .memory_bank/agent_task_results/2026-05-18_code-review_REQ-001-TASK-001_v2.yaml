# ──────────────────────────────────────────────────────────────────────
# PRIOR ISSUE FIX VERIFICATION
# Each entry: status = FIXED | ACCEPTED_DEVIATION | NOT_FIXED
# ──────────────────────────────────────────────────────────────────────
prior_issues_verification:
  - id: "TASK001-W001"
    title: "SDK-only env vars bleed into auth-app container via env_file: test.env"
    original_severity: "warning"
    fix_applied: "Clarifying comment added near env_file: line documenting the dual-purpose nature and v0.2.0 split plan"
    status: "FIXED"
    evidence: |
      dev/deployments/compose.test.yaml lines 65–68:
        # test.env mixes AUTH server config and SDK-test harness vars
        # (AUTH_REPO_PATH, AUTH_ENDPOINT, RUN_INTEGRATION_TESTS). The server ignores
        # unknown vars — but be aware these bleed into the container env. A split
        # into auth-server.env + sdk-test.env is tracked for v0.2.0.
      Comment is present immediately above env_file: block. Fully satisfies the
      "Option A (minimal)" fix from the v1 review recommendation. Deferred full
      env-file split to v0.2.0 is explicitly documented.
    residual: "Env var bleed still exists functionally (v0.2.0 fix deferred). Accepted — AUTH server silently ignores unknown vars."

  - id: "TASK001-W002"
    title: "auth-postgres exposes port 5432 to host — conflicts with local Postgres"
    original_severity: "warning"
    fix_applied: "ports: block removed from auth-postgres service; explanatory comment added explaining why host binding is unnecessary"
    status: "FIXED"
    evidence: |
      dev/deployments/compose.test.yaml lines 29–33:
        # No host port binding — auth-migrate and auth-app talk to postgres over the
        # compose project network (service hostname `auth-postgres:5432`). Avoid
        # colliding with local Postgres on :5432 or other docker-compose stacks
        # (signal-analyzer, funding-bot). Set DEBUG_POSTGRES_PORT externally if you
        # need host access for ad-hoc debugging.
      No ports: block exists under auth-postgres service — verified by reading the
      full service definition (lines 21–42). auth-app ports: ["50051:50051"] at line 76
      is present and correct (SDK needs this to reach the gRPC server).
    regression_check: |
      auth-migrate connects via DSN: postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable
      auth-app receives POSTGRES_HOST=auth-postgres:5432 via test.env.
      Both use compose DNS hostname — no host port required. Regression-free.

  - id: "TASK001-S001"
    title: "env-down not guaranteed if env-up fails partially"
    original_severity: "suggestion"
    fix_applied: "Second Known limitations bullet added to README.md documenting the partial env-up scenario"
    status: "FIXED"
    evidence: |
      README.md lines 65–72 (Known limitations v0.1.0 section):
        - If `make test-integration` is interrupted (Ctrl+C), Docker containers may remain running.
          Run `make env-down` manually to clean up.
        - If `make env-up` fails partway through (for example, the AUTH image build errors out),
          `env-down` is not invoked automatically — leftover Postgres or migrate containers may stay.
          Run `make env-down` to reset before retrying.
      Both the original Ctrl+C caveat and the new partial-failure caveat are present.
      No code change was required or made — documentation gap closed.

  - id: "TASK001-S002"
    title: "auth-migrate double-run: run --rm then up auth-app triggers second migration"
    original_severity: "suggestion"
    fix_applied: "--no-deps added to `up -d --wait auth-app` step in extra.mk"
    status: "FIXED"
    evidence: |
      dev/deployments/extra.mk line 21:
        ${_COMPOSE} --profile test up -d --wait --no-deps auth-app
      --no-deps flag is present. This instructs compose to bring up only auth-app
      without re-evaluating or re-running its depends_on services (auth-postgres,
      auth-migrate). Migrations run exactly once via the explicit `run --rm auth-migrate`
      step (line 19).
    regression_check: |
      Step ordering in dev-up-test-env:
        1. up -d --wait auth-postgres          (postgres healthy)
        2. run --rm auth-migrate               (migrations applied, container exits)
        3. up -d --wait --no-deps auth-app     (auth-app starts; --no-deps skips migrate re-run)
      auth-app still depends on auth-postgres being healthy (separate healthcheck).
      However: with --no-deps, compose does NOT re-start auth-postgres either.
      auth-postgres was already started and is healthy from step 1 — this is safe.
      The --no-deps flag only skips dependency startup, not health validation of
      the running auth-app container itself. Correct behavior preserved.

  - id: "TASK001-S003"
    title: ".temp/ missing from .gitignore"
    original_severity: "suggestion"
    fix_applied: ".temp/ entry added with explanatory comment"
    status: "FIXED"
    evidence: |
      .gitignore lines 42–43:
        # Scratch/temp work area (per CLAUDE.md policy — never write to project root)
        .temp/
      Entry is present in the "Dev tools" area of .gitignore with the CLAUDE.md
      policy reference. Correct placement and wording.

  - id: "TASK001-S004"
    title: "CI integration job runs without requiring lint/test/build to pass first"
    original_severity: "suggestion"
    fix_applied: "Explanatory comment added above `if:` in ci.yaml integration job"
    status: "FIXED"
    evidence: |
      .github/workflows/ci.yaml lines 79–81:
        # No `needs:` — manual workflow_dispatch trigger only. Running concurrently
        # with lint/test/build is intentional: integration tests don't share state
        # with unit checks and we want fast feedback on the manual run.
      Comment is present and accurately documents the intentional design choice.
      Future developers will understand this is a deliberate omission, not an oversight.

  - id: "TASK001-S005"
    title: "Decorative separator characters in runtime echo output (extra.mk)"
    original_severity: "suggestion"
    fix_applied: "n/a — accepted as team convention"
    status: "ACCEPTED_DEVIATION"
    evidence: |
      dev/deployments/extra.mk lines 16, 25, 34 still contain ━━━ in @echo strings:
        @echo "━━━ Starting AUTH test environment ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        @echo "━━━ Stopping AUTH test environment ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        @echo "━━━ Integration Tests ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    rationale: |
      CS-0112 targets decorative separators in source code structure, not runtime
      terminal output. The ━━━ usage here is user-facing UX (echo strings), matching
      the pattern used in sibling repos (auth, signal-analyzer, funding-bot) that the
      team has already accepted. The Makefile help target in the same file also uses
      box-drawing chars (pre-existing baseline). No code change required — deviation
      documented as team convention.

