issues:
  critical:
    - id: C-001
      category: LOGIC
      title: "Cache interface in README has wrong method signatures"
      file: "README.md:175-179"
      description: |
        The Cache interface block in the README Adapter Interfaces section shows
        signatures that do not exist in the actual lib/client.go Cache interface:

        README shows:
          Get(key string) (value any, ok bool)
          Set(key string, value any, ttl time.Duration)
          Delete(key string)

        Actual Cache interface (lib/client.go:73-79) is:
          Get(ctx context.Context, key string) (user User, ok bool)
          Set(ctx context.Context, key string, user User, ttl time.Duration)
          Delete(ctx context.Context, key string)

        A consumer implementing a custom Cache (e.g. Redis-backed) from the README
        example will write code that does NOT satisfy the interface and will get a
        compile error. This is the most dangerous accuracy issue in the deliverable.
      recommended_fix: |
        Replace the Cache interface block in README (## Adapter Interfaces → ### Cache)
        with the correct signatures from lib/client.go:

        ```go
        type Cache interface {
            Get(ctx context.Context, key string) (user User, ok bool)
            Set(ctx context.Context, key string, user User, ttl time.Duration)
            Delete(ctx context.Context, key string)
        }
        ```

  warnings:
    - id: W-001
      category: LOGIC
      title: "WithCache(nil) described as disabling caching — inaccurate"
      file: "README.md:80"
      description: |
        README options table states:
          WithCache(c) | Overrides Config.Cache. nil disables caching (each call hits AUTH).

        The actual code in lib/client.go:151-153 is:
          func WithCache(cache Cache) Option {
              return func(c *Client) { c.cache = cache }
          }

        Passing nil sets c.cache = nil, which causes New to fall through to
        Config.Cache (if non-nil) or the default built-in MemoryCache. Nil does NOT
        disable caching — the built-in MemoryCache is still created and used.

        To truly disable caching the consumer must set Config.ValidateCacheTTL = 0,
        which is correctly documented in the Configuration table and Known Limitations.
        The WithCache(nil) claim contradicts the WithCache godoc which explicitly states
        "Passing nil here is a no-op for the option".
      recommended_fix: |
        Change the WithCache row description to:
          Overrides Config.Cache with a custom implementation. nil is a no-op (falls
          through to Config.Cache or built-in MemoryCache). To disable caching set
          Config.ValidateCacheTTL = 0.

    - id: W-002
      category: LOGIC
      title: "CHANGELOG AuthError field name wrong: RetryAfter vs RetryAfterHint"
      file: "CHANGELOG.md:63"
      description: |
        The CHANGELOG v0.1.0 Added section reads:
          AuthError{Err, RetryAfter} wrapper.

        The actual exported struct field in lib/errors.go:41-45 is named RetryAfterHint:
          type AuthError struct {
              Err            error
              RetryAfterHint time.Duration
          }

        This is a factual inaccuracy in a release changelog that will be referenced
        by consumers looking up the AuthError struct.
      recommended_fix: |
        Change the CHANGELOG line 63 to:
          `AuthError{Err, RetryAfterHint}` wrapper.

    - id: W-003
      category: LOGIC
      title: "CHANGELOG date is 2026-05-19 but PRP DOD specifies 2026-05-18"
      file: "CHANGELOG.md:10"
      description: |
        The CHANGELOG header reads:
          ## [v0.1.0] — 2026-05-19

        The PRP DOD (task_management/plans/REQ-001-TASK-007-PRP.md:1048) requires:
          ## [v0.1.0] — 2026-05-18

        The PRP was authored on 2026-05-18 and specifies that date as the release date.
        The CHANGELOG was written on today (2026-05-19). While the actual git tag date
        is what matters for Keep-a-Changelog, the DOD criterion literally checks for
        "2026-05-18". This causes the DOD checkbox to evaluate as FAILED against
        automated grep of "2026-05-18".
      recommended_fix: |
        Either:
        a) Change CHANGELOG date to 2026-05-18 to satisfy the DOD literal check, OR
        b) Confirm with the team that 2026-05-19 (actual release date) is intentional
           and update the PRP DOD to reference the correct date.
        Option (b) is preferable for accuracy; the DOD text is a template artifact.

  suggestions:
    - id: S-001
      category: LOGIC
      title: "ValidateCacheTTL = 0 description could clarify cache object is still allocated"
      file: "README.md:65"
      description: |
        README config table says ValidateCacheTTL "0 disables cache entirely".
        The actual behavior (from lib/client.go godoc): "New still allocates an
        in-memory cache object, but Set is a no-op for TTL=0 so no entries are ever
        stored. Effectively every ValidateAccessToken call reaches gRPC."

        Practically indistinguishable from the consumer's perspective, but technically
        the cache object exists. Low priority — the observable effect matches the doc.
      recommended_fix: |
        Minor clarification: change "0 disables cache entirely" to
        "0 makes every ValidateToken call hit AUTH (Set is a no-op for TTL=0)."

    - id: S-002
      category: STYLE
      title: "doc.go Quickstart uses user, _ (blank error) — may invite misuse"
      file: "lib/doc.go:24"
      description: |
        The Quickstart code example in lib/doc.go uses:
          user, _ := authclient.UserFromContext(r.Context())

        UserFromContext returns (User, bool) — the blank identifier on the bool is
        intentional for brevity in a quickstart snippet. However, it teaches consumers
        to ignore the ok signal that indicates whether a user is actually present in
        context. Inside a middleware-protected handler the user will always be present,
        so ignoring ok is safe here. But the pattern could be copied verbatim to
        unprotected handlers. A short inline comment would mitigate the concern.
      recommended_fix: |
        Consider adding a brief inline comment:
          user, _ := authclient.UserFromContext(r.Context()) // ok is always true inside HTTPMiddleware
        Or expand to the two-return form with a comment that the middleware guarantees presence.
        Minor — quickstart brevity is a valid tradeoff.

    - id: S-003
      category: LOGIC
      title: "README does not mention IsZero / IsAdmin / HasRole User helper methods"
      file: "README.md"
      description: |
        The public API includes three User convenience methods (lib/context.go:35-41):
          func (u User) IsZero() bool
          func (u User) IsAdmin() bool
          func (u User) HasRole(role Role) bool

        These are useful for handler authorization checks (e.g., gating admin endpoints)
        but are not mentioned in README. The omission is not critical — go doc covers them
        — but a note in the Context / Cookie Helpers section or a small example would
        help discoverability.
      recommended_fix: |
        Add a brief mention under the Quickstart or Adapter Interfaces section, e.g.:
          // role-based gate in a handler:
          user, _ := authclient.UserFromContext(r.Context())
          if !user.IsAdmin() { http.Error(w, "forbidden", http.StatusForbidden); return }

