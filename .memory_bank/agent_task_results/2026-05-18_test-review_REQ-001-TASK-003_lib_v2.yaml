      effective_status: PASS

    - rule: UT-0029
      description: "No package-level shared variables for test data"
      status: WARNING
      violations:
        - file: lib/internal/cache/memory_test.go
          lines: [202, 203]
          detail: >
            const numGoroutines = 50 and const key = "shared" are defined
            inside the TestMemoryCache_Concurrent function body (not at package
            level), so UT-0029 is not violated. PASS.
      effective_status: PASS

    - rule: UT-0030
      description: "require for critical checks"
      status: PASS
      note: "require.NoError, require.Error, require.True, require.False used
        correctly for setup-critical checks. assert used for additional checks."

    - rule: UT-0031
      description: "assert for additional checks"
      status: PASS

    - rule: UT-0032
      description: "No logic (if/switch) in test body"
      status: WARNING
      violations:
        - file: lib/middleware_http_test.go
          line: 362
          detail: >
            if tc.authzHeader != "" { req.Header.Set(...) } — conditional logic
            in the test loop body. This is test infrastructure logic (setting up
            the HTTP request), not assertion logic, but UT-0032 prohibits all
            if/switch in test bodies. The fix is to move the Authorization
            header setup into the prepareMocks closure (or add an authzHeader
            field that is always set, with the empty case simply representing
            "no header"). Since the missing-header cases explicitly test the
            absence of an Authorization header, the cleanest fix is to model
            this as a request builder function or to set req.Header.Set only
            when needed inside prepareMocks.
            Severity: WARNING (logic is benign infrastructure, not hiding
            assertion logic, but still violates the rule).

    - rule: UT-0040
      description: "t.Parallel() at top of main test and each subtest"
      status: WARNING
      violations:
        - file: lib/internal/cache/memory_test.go
          line: 128
          detail: >
            TestMemoryCache_Cleanup does NOT call t.Parallel() at the top of
            the function. The comment says "Goroutine-count subtests are NOT
            parallel — they measure global runtime state." This is a valid
            UT-0042 exception (tests use runtime.NumGoroutine which is a shared
            global). However, the exception should be explicitly noted by
            referencing UT-0042 in the comment. Currently the comment explains
            the rationale but does not cite the rule.
        - file: lib/internal/cache/memory_test.go
          lines: [190-196]
          detail: >
            The subtests inside TestMemoryCache_Cleanup also do NOT call
            t.Parallel(). Again valid per UT-0042, but the exception needs
            documentation.
      effective_status: PASS_WITH_NOTE
      note: >
        All other test functions correctly call t.Parallel() at the top and in
        each subtest. The cache cleanup test's omission of t.Parallel() is
        architecturally correct (goroutine-count tests cannot run in parallel)
        and should be retained. The suggestion is to annotate with UT-0042.

    - rule: UT-0041
      description: "tc := tc capture before t.Parallel()"
      status: PASS
      note: "tc := tc present in all for-range loops where t.Parallel() is used."

    - rule: UT-0051
      description: "No magic numbers"
      status: PASS
      note: >
        Named constants used throughout: cacheTTL, validateTimeout, tokenABC,
        healthMethod, appMethod, numGoroutines, cleanupInterval. HTTP status
        codes use http.StatusXxx constants. gRPC codes use codes.Xxx.

    - rule: UT-0070
      description: "go-cmp for struct comparison"
      status: SUGGESTION
      note: >
        assert.Equal is used for User struct comparisons throughout. For simple
        two-field structs (UUID + Role) this is acceptable and readable.
        go-cmp would add verbosity without clarity benefit here. Suggesting
        but not flagging as a violation.

    - rule: UT-0071
      description: "testing/synctest for time-dependent code"
      status: SUGGESTION
      note: >
        The cache expiration test (expired_returns_false) uses time.Sleep(20ms)
        instead of testing/synctest. For Go 1.24+ projects this is available.
        The sleep is short (20ms) and the test is still fast; however, synctest
        would eliminate the real sleep, making the test faster and more
        deterministic. Suggesting for cache tests.

    - rule: UT-0100
      description: "One test file per source file"
      status: PASS
      note: >
        Test file layout:
          client.go         -> client_test.go (same pkg) + client_integration_test.go
          validate.go       -> validate_test.go + validate_integration_test.go
          middleware_http.go -> middleware_http_test.go
          interceptor_grpc.go -> interceptor_grpc_test.go
          context.go        -> context_test.go
          errors.go         -> errors_test.go
          logger.go         -> logger_test.go
          export_test.go    -> bridge (no source counterpart — correct)
        All comply. context_test.go contains tests for User methods and
        UserFromContext which all live in context.go.

issues:
  critical: []

  warnings:
    - id: TEST-W001
      rule_id: UT-0010
      severity: WARNING
      file: lib/client_test.go
      line: 34
      title: "TestNew does not follow Test<Type>_<Method> naming"
      description: >
        The function name is TestNew. The tested constructor is New() which
        constructs a Client. The required format is Test<Type>_<Method>, so
        the name should be TestClient_New to match the subject type.
      recommendation: >
        Rename TestNew to TestClient_New. This is a cosmetic change with no
        functional impact, but consistency with UT-0010 is required.

    - id: TEST-W002
      rule_id: UT-0010
      severity: WARNING
      file: lib/logger_test.go
      line: 9
      title: "TestNoopLogger does not include method component"
      description: >
        The function exercises three methods of NoopLogger (Info, Warn, Error).
        The name TestNoopLogger lacks the method component required by UT-0010.
        Options: (a) one function with sub-cases per method using the current
        name TestNoopLogger_AllMethods or (b) split into three functions
        TestNoopLogger_Info, TestNoopLogger_Warn, TestNoopLogger_Error.
      recommendation: >
        Rename to TestNoopLogger_Info / TestNoopLogger_Warn / TestNoopLogger_Error
        (three separate functions, each with its own table) or combine as
        TestNoopLogger_Smoke if the intent is a smoke test for the no-op
        behaviour collectively.

    - id: TEST-W003
      rule_id: UT-0020
      severity: WARNING
      file: lib/client_test.go
      lines: [20, 28]
      title: "Manual stub structs violate UT-0020"
      description: >
        recordingLogger (line 20) and stubCache (line 28) are hand-written
        struct types that implement Logger and Cache interfaces. UT-0020 requires
        all mocks/stubs to be generated by mockery. The file comment explains the
        import-cycle rationale (package authclient cannot import lib/mocks which
        imports lib), which is a real constraint. However, the standard approach
        to resolve this in this SDK is the same pattern used in validate_test.go:
        move the test to package authclient_test and bridge internal access via
        export_test.go. The authclient internal-package tests in client_test.go
        access unexported fields (c.failMode, c.logger, c.cache, c.bgCtx,
        c.openMethods, c.cfg) which is why they live in package authclient.
      recommendation: >
        Two paths to resolution:
        (a) Accept as an approved exception: add an explicit code comment
            "// import-cycle exception: UT-0020 waived — see client_test.go header."
        (b) Expose the required observability via export_test.go helpers (e.g.,
            ClientFailMode(c *Client) FailMode) so client_test.go can be moved
            to package authclient_test, enabling use of mockery mocks. This is
            the preferred fix but requires adding several export_test.go helpers.
        Either path is valid; (b) eliminates the violation fully.

    - id: TEST-W004
      rule_id: UT-0020
      severity: WARNING
      file: lib/export_test.go
      lines: [21-30]
      title: "FakeAuthClient is a hand-written test double"
      description: >
        FakeAuthClient implements the unexported authServiceClient interface
        manually. A mockery-generated mock exists at lib/mocks/mock_authServiceClient.go
        but is unexported (newMockauthServiceClient), so external test packages
        cannot access it. The FakeAuthClient serves as a functional substitute
        and carries a ValidateCalls counter for assertion. While the design is
        intentional and well-documented, it technically violates UT-0020.
      recommendation: >
        Either: (a) export the generated mock by configuring mockery to use
        an exported name (MockAuthServiceClient) in mockery.yaml, or (b) retain
        FakeAuthClient but document the UT-0020 waiver explicitly in the struct's
        comment. If path (a) is chosen, update export_test.go to use the generated
        mock and remove FakeAuthClient.

    - id: TEST-W005
      rule_id: UT-0032
      severity: WARNING
      file: lib/middleware_http_test.go
      line: 362
      title: "Conditional logic in test loop body violates UT-0032"
      description: >
        The subtest body contains:
          if tc.authzHeader != "" {
              req.Header.Set("Authorization", tc.authzHeader)
          }
        This is an if-statement inside the test execution block, which UT-0032
        forbids. Although the logic is request-construction (not assertion logic),
        the rule applies to all conditional branching in test bodies.
      recommendation: >
        Move header configuration into the test case struct. Add a
        setupRequest func(*http.Request) field (or simply use the existing
        authzHeader and always set it, treating "" as "no header" by changing
        the request construction to always call req.Header.Set when the field
        is non-empty via a dedicated setupRequest closure per test case).
        Simplest fix: add a setupRequest field to the test case struct and
        move the conditional inline:
          "missing_authorization_returns_401": {
              setupRequest: func(r *http.Request) { /* no-op */ },
          },
          "happy_path": {
              setupRequest: func(r *http.Request) {
                  r.Header.Set("Authorization", "Bearer valid-token")
              },
          },
        Then in the loop body: tc.setupRequest(req) — no if needed.

  suggestions:
    - id: TEST-S001
      rule_id: UT-0040
      severity: SUGGESTION
      file: lib/internal/cache/memory_test.go
      line: 128
      title: "TestMemoryCache_Cleanup omits t.Parallel() without citing UT-0042"
      description: >
        The function does not call t.Parallel() at the top. The comment
        explains why (goroutine-count tests cannot run in parallel) but does
        not reference UT-0042, which is the official exception for this case.
        Future reviewers may flag this as a missing t.Parallel() without
        understanding the rationale.
      recommendation: >
        Add a comment: "// Not parallel — measures runtime.NumGoroutine() which
        is global state. UT-0042 exception." This does not require a code change,
        only a comment update.

    - id: TEST-S002
      rule_id: UT-0071
      severity: SUGGESTION
      file: lib/internal/cache/memory_test.go
      lines: [41-50]
      title: "Use testing/synctest instead of time.Sleep for expiry test"
      description: >
        "expired_returns_false" uses time.Sleep(20ms) to wait for a 10ms TTL
        to expire. Go 1.24+ provides testing/synctest which allows virtual-time
        advancement without real sleeping.
      recommendation: >
        Wrap the expiry case in synctest.Run and use synctest.Wait() after
        advancing fake time (or use fake clock injection if available).

    - id: TEST-S003
      rule_id: UT-0070
      severity: SUGGESTION
      file: lib/validate_test.go
      lines: [86, 103]
      title: "Consider go-cmp for User struct assertions"
      description: >
        assert.Equal(t, authclient.User{UUID: "u1", Role: authclient.RoleUser}, user)
        works fine for small structs. go-cmp would produce better diffs on
        failure, especially if User gains more fields over time.
      recommendation: >
        Replace with:
          if diff := cmp.Diff(expectedUser, user); diff != "" {
              t.Errorf("User mismatch (-want +got):\n%s", diff)
          }

    - id: TEST-S004
      severity: SUGGESTION
      file: lib/validate_integration_test.go
      title: "Integration test does not use t.Parallel() in subtests — UT-0042 exception OK, but missing note"
      description: >
        The integration test intentionally skips t.Parallel() because tests
        share the real AUTH server. The comment "Integration tests do not use
        t.Parallel()" explains this at the function level, but the subtests
        also lack both t.Parallel() and a per-subtest comment. This is correct
        by UT-0042 but could be confusing.
      recommendation: >
        Add a short note in each t.Run body or as a per-subtest comment:
        "// Not parallel — shares real AUTH server (UT-0042)."

    - id: TEST-S005
      severity: SUGGESTION
      file: lib/client_test.go
      lines: [193-204]
      title: "endpoint_invalid_format_returns_error handles two branches with internal if"
      description: >
        The want closure for "endpoint_invalid_format_returns_error" contains:
          if err != nil { ... return }
          require.NotNil(t, c)
        This is a conditional inside a want closure, which the spirit of UT-0032
        discourages. The comment acknowledges that gRPC may defer validation.
        This specific case is genuinely behaviour-ambiguous, so the if is
        arguably necessary. Consider instead splitting into two subtests:
        "endpoint_with_spaces_returns_error_if_eager" and
        "endpoint_with_spaces_allows_lazy_dial" (with t.Skip if not applicable),
        or document the ambiguity as an approved deviation.
      recommendation: >
        Low priority. If gRPC guarantees eager validation in a future version,
        remove the branch. Until then, document with a comment explaining
        the gRPC target-resolution contract.

