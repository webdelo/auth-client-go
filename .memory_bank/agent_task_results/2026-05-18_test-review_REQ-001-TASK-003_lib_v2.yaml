standards_compliance:
  checklist:
    - rule: UT-0001
      description: "Table-driven tests mandatory"
      status: PASS
      note: "All test functions use table-driven pattern."

    - rule: UT-0002
      description: "One method = one test function"
      status: PASS
      note: "Each tested method/function has exactly one Test* function."

    - rule: UT-0010
      description: "Naming: Test<Type>_<Method>"
      status: WARNING
      violations:
        - file: lib/client_test.go
          line: 34
          detail: >
            TestNew does not follow Test<Type>_<Method>. Should be
            TestClient_New (since New is the constructor of Client).
        - file: lib/logger_test.go
          line: 9
          detail: >
            TestNoopLogger does not follow the pattern. As it exercises all
            three methods (Info, Warn, Error) of NoopLogger, a valid name
            would be TestNoopLogger_Smoke or the test cases should be split
            into TestNoopLogger_Info / TestNoopLogger_Warn / TestNoopLogger_Error.
            The current name omits the method component.
        - file: lib/middleware_http_test.go
          line: 23
          detail: >
            TestBearerToken is a package-function test. Standard format for
            a package-level function is TestPackage_Function or simply
            Test_bearerToken; the exported alias is BearerToken so TestBearerToken
            is acceptable, but strictly it lacks a type qualifier. Low severity.
        - file: lib/errors_test.go
          lines: [15, 99, 138]
          detail: >
            TestMapGRPCError, TestMapErrorReason, TestRetryAfter — these test
            package-level functions. Format is debatable (no type prefix), but
            consistent with Go standard library conventions for unexported helpers.
            Acceptable.

    - rule: UT-0011
      description: "First case must be happy_path"
      status: PASS
      note: >
        Verified in all table maps. Since Go maps are unordered, the standard
        approach is to ensure the key named "happy_path" exists as the canonical
        first case (by convention). All test functions comply.

    - rule: UT-0012
      description: "Test case naming in snake_case"
      status: PASS
      note: "All case names use snake_case throughout."

    - rule: UT-0020
      description: "Mocks ONLY via mockery"
      status: WARNING
      violations:
        - file: lib/client_test.go
          lines: [20-27, 28-32]
          detail: >
            recordingLogger (lines 20-27) and stubCache (lines 28-32) are
            hand-written stub/spy structs that satisfy Logger and Cache interfaces.
            UT-0020 forbids manual mock structs and requires mockery-generated
            mocks. The comment in the file explains this is done to avoid an
            import cycle (package authclient internal tests cannot import
            lib/mocks which imports lib). While the technical constraint is
            real, the correct solution per project standards is to either:
            (a) move client_test.go to package authclient_test and use export_test.go
            helpers (as validate_test.go does), or
            (b) accept the violation as an approved exception with an explicit
            comment documenting the cycle constraint and adding a TODO to revisit.
            The current comment explains the reasoning but does not explicitly
            call out UT-0020.
        - file: lib/export_test.go
          lines: [21-30]
          detail: >
            FakeAuthClient is a hand-written test double for the unexported
            authServiceClient interface. This is partially justified by the
            import-cycle constraint (mockery's mock_authServiceClient.go is
            unexported and cannot be used from authclient_test), but the
            mock already exists at lib/mocks/mock_authServiceClient.go.
            Review whether the mock can be accessed from the internal package
            through export_test.go or if it is truly impossible.

    - rule: UT-0021
      description: "Use Expecter API (.EXPECT())"
      status: PASS
      note: "All mock interactions use the Expecter API. No .On() calls found."

    - rule: UT-0022
      description: "Explicit call count (.Once()/.Times(n))"
      status: PASS
      note: "All EXPECT() calls include .Once() or .Return() without explicit
        .Times() only where the call count is implied — verify mockery defaults
        .Times(1) when Return is chained without Times. Spot check: all cache
        Get/Set calls use .Once(). Logger Warn/Error in interceptor use .Once()."

    - rule: UT-0023
      description: "No mock.Anything for business data"
      status: PASS
      note: >
        No mock.Anything usage found. Context parameters use mock.MatchedBy
        with nil-check (valid per standard: ctx is not a business data arg, but
        the rules still require MatchedBy rather than Anything — compliant).

    - rule: UT-0024
      description: "New mocks per subtest"
      status: PASS
      note: >
        Each t.Run creates a new testMocks instance via newValidateTestMocks,
        newHTTPMiddlewareTestMocks, newInterceptorTestMocks respectively.

    - rule: UT-0026
      description: "testMocks struct grouping"
      status: PASS
      note: >
        validateTestMocks, httpMiddlewareTestMocks, interceptorTestMocks all
        group dependencies in a struct. Constructor functions are named
        newXxxTestMocks(t) following the UT-0026 pattern.

    - rule: UT-0027
      description: "No decorative section separators"
      status: PASS
      note: "No decorative comment dividers found."

    - rule: UT-0028
      description: "No helper functions for test data"
      status: WARNING
      violations:
        - file: lib/validate_test.go
          line: 31
          detail: >
            newValidateTestMocks is an allowed exception per UT-0026 (testMocks
