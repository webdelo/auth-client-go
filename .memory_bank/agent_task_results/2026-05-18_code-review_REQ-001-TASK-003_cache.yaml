  warnings:
    - id: CACHE-W001
      category: CONCURRENCY
      title: "No WaitGroup — goroutine exit is fire-and-forget after Close"
      file: lib/internal/cache/memory.go
      line: 41
      standard: "EC-0081: Wait for all goroutines to complete"
      description: |
        NewMemoryCache launches cleanupLoop as a bare `go c.cleanupLoop(bgCtx, cleanupInterval)`
        with no WaitGroup tracking. When Client.Close() calls cancelBG(), it signals the goroutine
        to stop but returns immediately without waiting for cleanupLoop to exit.

        The goroutine may still be mid-execution inside c.m.Range(func ...) at the moment
        Close() returns. While it will exit on the next select iteration (ctx.Done is already
        cancelled), the caller has no guarantee that the goroutine has actually finished.
        This makes goroutine-count-based tests (runtime.NumGoroutine) inherently racy —
        they must sleep after Close() to give the goroutine time to exit, which is an
        anti-pattern.

        DOD item: "Cleanup goroutine завершается при Close() (тест с runtime.NumGoroutine:
        число goroutines до New == после Close)." This is hard to satisfy reliably without
        a WaitGroup.
      current_code: |
        func NewMemoryCache(bgCtx context.Context, cleanupInterval time.Duration) *MemoryCache {
            c := &MemoryCache{}

            if cleanupInterval > 0 {
                go c.cleanupLoop(bgCtx, cleanupInterval)  // no WaitGroup — fire-and-forget
            }

            return c
        }
      recommended_fix: |
        type MemoryCache struct {
            m  sync.Map
            wg sync.WaitGroup // tracks the background cleanup goroutine
        }

        func NewMemoryCache(bgCtx context.Context, cleanupInterval time.Duration) *MemoryCache {
            c := &MemoryCache{}

            if cleanupInterval > 0 {
                c.wg.Add(1)
                go func() {
                    defer c.wg.Done()
                    c.cleanupLoop(bgCtx, cleanupInterval)
                }()
            }

            return c
        }

        // Wait blocks until the background goroutine has fully exited.
        // Call after cancelling bgCtx (i.e., after Client.Close cancels cancelBG).
        func (c *MemoryCache) Wait() {
            c.wg.Wait()
        }

        // In Client.Close():
        // func (c *Client) Close() error {
        //     c.closeOnce.Do(func() {
        //         c.cancelBG()
        //         c.memCache.Wait() // wait for goroutine exit before closing conn
        //         c.closeErr = c.grpcConn.Close()
        //     })
        //     return c.closeErr
        // }
      reason: |
        EC-0081 requires waiting for goroutines on shutdown. Without WaitGroup,
        the DOD condition (goroutine count restores after Close) cannot be
        deterministically verified in tests without artificial sleeps.

    - id: CACHE-W002
      category: RUNTIME
      title: "Bare type assertion v.(entry) without comma-ok in Get and cleanupLoop"
      file: lib/internal/cache/memory.go
      line: 55
      standard: "ES-0052: Use type assertions with comma-ok"
      description: |
        Line 55: `e := v.(entry)` — bare assertion, panics if the stored value is not entry.
        Line 94: `v.(entry).expiresAt` — same issue inside Range callback.

        The map is private and only written via Set (which stores entry values), so the
        assertion is logically safe today. However:
        1. ES-0052 mandates comma-ok form for all type assertions as a defensive measure.
        2. Future callers who embed or extend MemoryCache could corrupt the map.
        3. If something outside the package ever stored a non-entry value via a reflect
           trick or through a test hack, the panic would surface in production.

        Additionally, for the Range callback on line 94, a panic inside Range does not
        stop the iteration gracefully — it propagates up to the goroutine and would crash
        the cleanup goroutine silently (no recover), causing it to never exit until bgCtx
        is cancelled separately.
      current_code: |
        // line 55 — in Get
        e := v.(entry)

        // line 94 — in cleanupLoop Range callback
        if now.After(v.(entry).expiresAt) {
      recommended_fix: |
        // In Get (line 55):
        e, ok := v.(entry)
        if !ok {
            // unexpected type in map — treat as miss and evict
            c.m.Delete(key)
            return nil, false
        }

        // In cleanupLoop Range callback (line 94):
        e, ok := v.(entry)
        if !ok {
            c.m.Delete(k) // evict corrupt entry
            return true
        }
        if now.After(e.expiresAt) {
            c.m.Delete(k)
        }
      reason: |
        ES-0052 requires comma-ok for type assertions. Defensive coding prevents
        a panic from a corrupt map state from crashing the background goroutine.

