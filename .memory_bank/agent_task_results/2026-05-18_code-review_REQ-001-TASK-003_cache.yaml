  suggestions:
    - id: CACHE-S001
      category: PERFORMANCE
      title: "cleanupLoop Range callback allocates an entry copy on every iteration"
      file: lib/internal/cache/memory.go
      line: 93
      description: |
        Inside the Range callback, `v.(entry).expiresAt` triggers a copy of the
        entry struct (user any + expiresAt time.Time). For large caches this is a
        minor but measurable allocation per Range call. Storing only the expiry time
        in the map (and separately storing user data) would avoid this, but changes
        the data model significantly.

        A simpler improvement: assign to a local variable to make the copy explicit
        and re-use it (no double-assert). This pairs well with the CACHE-W002 fix.
      recommended_fix: |
        c.m.Range(func(k, v any) bool {
            e, ok := v.(entry)
            if !ok {
                c.m.Delete(k)
                return true
            }
            if now.After(e.expiresAt) {
                c.m.Delete(k)
            }
            return true
        })
      reason: |
        Single assignment + reuse is clearer and avoids a double type-assertion.
        Pairs naturally with the CACHE-W002 defensive fix.

    - id: CACHE-S002
      category: LOGIC
      title: "cleanupInterval derivation (TTL/2) is outside MemoryCache — consider documenting the contract"
      file: lib/internal/cache/memory.go
      line: 37
      description: |
        The recommended `cleanupInterval = ValidateCacheTTL / 2` is computed in
        client.go (line 242). NewMemoryCache accepts any interval > 0 and treats it
        as-is. If a caller passes an interval > TTL, tombstones will accumulate for
        longer than the TTL; if interval << TTL, excessive CPU is spent scanning.

        The godoc on NewMemoryCache currently says "A cleanupInterval of 0 or less
        skips the goroutine entirely" but does not recommend a typical ratio relative
        to the TTL. A brief note would make the API contract clearer for future
        consumers of this internal package (e.g., integration tests, Redis-backed
        cache that embeds this for local fallback).
      recommended_fix: |
        // NewMemoryCache constructs a MemoryCache and, when cleanupInterval > 0,
        // launches a background cleanup goroutine.
        //
        // bgCtx controls the cleanup goroutine lifecycle. Cancel it to stop the
        // goroutine and call Wait() to block until it exits.
        //
        // cleanupInterval controls how often the background scan removes expired
        // tombstones. A value of TTL/2 is recommended: frequent enough to bound
        // memory growth while keeping overhead low. A value of 0 or less skips
        // the goroutine entirely — expired entries are still evicted lazily
        // inside Get.
        func NewMemoryCache(bgCtx context.Context, cleanupInterval time.Duration) *MemoryCache {
      reason: |
        Internal package but used by tests and potentially future swappable
        implementations. The ratio guidance reduces mis-use risk.

